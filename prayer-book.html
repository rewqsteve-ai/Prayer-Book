    var focusOn = inGuide && ui.focus !== false;
    if (document.body && document.body.classList) document.body.classList.toggle('focus', focusOn);
    syncWake(focusOn);
  }
  function flash(msg) { ui.flash = msg; render(); }
  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }

  /* ---------- actions ---------- */
  function act(a, id) {
    var t = dkey(), r, i;
    if (a !== 'delreq' && a !== 'delentry' && a !== 'delslot') ui.confirm = null;
    switch (a) {
      case 'tab': tab = id; ui.answering = null; ui.confirm = null; ui.flash = ''; ui.editing = null; ui.pendingRestore = null; ui.backupShow = false; if (id === 'week') ui.weekOffset = 0; render(); window.scrollTo(0, 0); return;
      case 'slot':
        S.done[t] = S.done[t] || {};
        if (S.done[t][id]) delete S.done[t][id]; else S.done[t][id] = true;
        if (!Object.keys(S.done[t]).length) delete S.done[t];
        save(); render(); return;
      case 'pray':
        r = S.requests.filter(function (x) { return x.id === id; })[0]; if (!r) return;
        r.prayed = r.prayed || [];
        i = r.prayed.indexOf(t);
        if (i === -1) { r.prayed.push(t); r.prayed.sort(); } else r.prayed.splice(i, 1);
        save(); render(); return;
      case 'addreq':
        var text = val('reqText');
        if (!text) { flash('Write a request first.'); return; }
        S.requests.push({ id: uid(), text: text, cat: val('reqCat') || 'Other', created: t, prayed: [], answered: null, shelved: false, shelvedAt: null });
        ui.filter = 'open'; ui.flash = ''; save(); render(); return;
      case 'filter': ui.filter = id; render(); return;
      case 'answer': ui.answering = id; render(); var n = document.getElementById('ansNote'); if (n) n.focus(); return;
      case 'cancelanswer': ui.answering = null; render(); return;
      case 'saveanswer':
        r = S.requests.filter(function (x) { return x.id === id; })[0]; if (!r) return;
        r.answered = { date: t, note: val('ansNote') };
        ui.answering = null; save(); render(); return;
      case 'shelve':
        r = S.requests.filter(function (x) { return x.id === id; })[0]; if (r) { r.shelved = true; r.shelvedAt = t; }
        save(); render(); return;
      case 'unshelve':
        r = S.requests.filter(function (x) { return x.id === id; })[0]; if (r) { r.shelved = false; r.shelvedAt = null; }
        save(); render(); return;
      case 'reopen':
        r = S.requests.filter(function (x) { return x.id === id; })[0]; if (r) r.answered = null;
        save(); render(); return;
      case 'delreq': case 'delentry': case 'delslot':
        if (ui.confirm !== a + id) { ui.confirm = a + id; render(); return; }
        ui.confirm = null;
        if (a === 'delreq') S.requests = S.requests.filter(function (x) { return x.id !== id; });
        if (a === 'delentry') S.journal = S.journal.filter(function (x) { return x.id !== id; });
        if (a === 'delslot') S.slots = S.slots.filter(function (x) { return x.id !== id; });
        save(); render(); return;
      case 'addentry':
        var body = val('jText');
        if (!body) { flash('Write something first.'); return; }
        S.journal.push({ id: uid(), date: new Date().toISOString(), text: body, thanks: val('jThanks') });
        ui.flash = 'Entry saved.'; save(); render(); return;
      case 'addslot':
        S.slots.push({ id: uid(), label: 'Prayer', time: '12:00', on: true });
        save(); render(); return;
      case 'newverse':
        todaysVerse(); S.verse.offset++; save(); render(); return;
      case 'verseentry':
        var vv = todaysVerse(); ui.prefill = 'On ' + vv.ref + ': ';
        tab = 'journal'; ui.flash = ''; render(); window.scrollTo(0, 0);
        var jt = document.getElementById('jText');
        if (jt) { jt.focus(); jt.setSelectionRange(jt.value.length, jt.value.length); }
        return;
      case 'start':
        ui.session = newSession(id); ui.openRefs = {}; ui.flash = ''; render(); window.scrollTo(0, 0); return;
      case 'startpsalm':
        ui.session = newSession('psalm', id); ui.openRefs = {}; ui.flash = ''; render(); window.scrollTo(0, 0); return;
      case 'snext':
        if (ui.session && ui.session.rest && ui.session.rest.running) { ui.session.rest.remaining = restRemaining(ui.session); ui.session.rest.running = false; ui.session.rest.endAt = null; }
        if (ui.session) {
          if (ui.session.step >= sessionSteps(ui.session).length - 1) ui.session.done = true; else ui.session.step++;
          render(); window.scrollTo(0, 0);
        }
        return;
      case 'sback':
        if (ui.session && ui.session.rest && ui.session.rest.running) { ui.session.rest.remaining = restRemaining(ui.session); ui.session.rest.running = false; ui.session.rest.endAt = null; }
        if (ui.session && ui.session.step > 0) { ui.session.step--; render(); window.scrollTo(0, 0); }
        return;
      case 'leave':
        if (ui.session && ui.session.rest && ui.session.rest.running) { ui.session.rest.remaining = restRemaining(ui.session); ui.session.rest.running = false; ui.session.rest.endAt = null; }
        ui.session = null; ui.openRefs = {}; render(); window.scrollTo(0, 0); return;
      case 'sfsave':
        if (ui.session) {
          var stxt = sessionText(ui.session);
          if (stxt) { S.journal.push({ id: uid(), date: new Date().toISOString(), text: stxt, thanks: '' }); ui.session.saved = true; save(); }
          render();
        }
        return;
      case 'part':
        ui.part = id; ui.partManual = true; render(); return;
      case 'evetoggle':
        var et = prayDay(); ui.eveOpen = ui.eveOpen === et ? '' : et; render(); return;
      case 'everead':
        var et2 = prayDay(); S.eveRead = S.eveRead || {};
        if (S.eveRead[et2]) delete S.eveRead[et2]; else S.eveRead[et2] = true;
        save(); render(); return;
      case 'eveentry':
        var evx = todaysEvening();
        ui.prefill = 'On ' + (evx ? evx.ref : 'tonight\u2019s reading') + ': ';
        tab = 'journal'; ui.flash = ''; render(); window.scrollTo(0, 0);
        var jev = document.getElementById('jText');
        if (jev) { jev.focus(); jev.setSelectionRange(jev.value.length, jev.value.length); }
        return;
      case 'focustoggle':
        ui.focus = ui.focus === false; render(); window.scrollTo(0, 0); return;
      case 'weekprev':
        ui.weekOffset = (ui.weekOffset || 0) - 1; render(); return;
      case 'weeknext':
        if ((ui.weekOffset || 0) < 0) ui.weekOffset++; render(); return;
      case 'weekentry':
        var wk = weekDays(ui.weekOffset || 0);
        ui.prefill = 'Weekly review, week of ' + wk[0].toLocaleDateString(undefined, { month: 'long', day: 'numeric' }) +
          '\n\nWhere I saw God at work:\n\nWhat I\u2019m thankful for:\n\nWhat I\u2019ll carry into next week:\n';
        tab = 'journal'; ui.flash = ''; render(); window.scrollTo(0, 0);
        var jw = document.getElementById('jText');
        if (jw) { jw.focus(); jw.setSelectionRange(jw.value.length, jw.value.length); }
        return;
      case 'devtoggle':
        ui.devOpen = ui.devOpen === t ? '' : t; render(); return;
      case 'devread':
        S.devRead = S.devRead || {};
        if (S.devRead[t]) delete S.devRead[t]; else S.devRead[t] = true;
        save(); render(); return;
      case 'deventry':
        ui.prefill = 'On ' + todaysDevotional().ref + ': ';
        tab = 'journal'; ui.flash = ''; render(); window.scrollTo(0, 0);
        var jd = document.getElementById('jText');
        if (jd) { jd.focus(); jd.setSelectionRange(jd.value.length, jd.value.length); }
        return;
      case 'ref':
        ui.openRefs[id] = !ui.openRefs[id]; render(); return;
      case 'startlectio':
        ui.session = newSession('lectio', id); ui.openRefs = {}; ui.flash = ''; render(); window.scrollTo(0, 0); return;
      case 'restpick':
        if (ui.session && ui.session.rest && !ui.session.rest.started) {
          ui.session.rest.duration = +id; ui.session.rest.remaining = +id; ui.session.rest.done = false; render();
        }
        return;
      case 'restphrase':
        if (ui.session) {
          if (!ui.session.rest) ui.session.rest = freshRest();
          var opts = restPhraseOptions(ui.session);
          ui.session.rest.phrase = opts[+id] || ''; render();
        }
        return;
      case 'resttoggle':
        if (ui.session && ui.session.rest && ui.session.rest.duration) {
          var rs = ui.session.rest;
          if (rs.running) { rs.remaining = restRemaining(ui.session); rs.running = false; rs.endAt = null; }
          else { var rem = rs.remaining || rs.duration; rs.remaining = rem; rs.endAt = Date.now() + rem * 1000; rs.running = true; rs.started = true; }
          render();
        }
        return;
      case 'restend':
        if (ui.session && ui.session.rest) {
          var re2 = ui.session.rest; re2.running = false; re2.endAt = null; re2.remaining = 0; re2.done = true; re2.endedEarly = true; render();
        }
        return;
      case 'restreset':
        if (ui.session) { ui.session.rest = freshRest(); render(); }
        return;
      case 'retrypassage':
        delete passages[id]; render(); return;
      case 'newquote':
        todaysQuote(); S.quote.offset++; save(); render(); return;
      case 'quoteentry':
        var qq = todaysQuote(); ui.prefill = 'Reflecting on ' + qq.by + ': ';
        tab = 'journal'; ui.flash = ''; render(); window.scrollTo(0, 0);
        var jq = document.getElementById('jText');
        if (jq) { jq.focus(); jq.setSelectionRange(jq.value.length, jq.value.length); }
        return;
      case 'editreq':
        r = S.requests.filter(function (x) { return x.id === id; })[0]; if (!r) return;
        ui.editing = { kind: 'req', id: id, err: '', d: { text: r.text, cat: r.cat, note: r.answered ? (r.answered.note || '') : '' } };
        ui.answering = null; ui.confirm = null; render();
        var ie = document.getElementById('editReqText'); if (ie) ie.focus();
        return;
      case 'editentry':
        var en = S.journal.filter(function (x) { return x.id === id; })[0]; if (!en) return;
        ui.editing = { kind: 'entry', id: id, err: '', d: { text: en.text, thanks: en.thanks || '' } };
        ui.confirm = null; render();
        var it = document.getElementById('editEntryText'); if (it) it.focus();
        return;
      case 'canceledit':
        ui.editing = null; render(); return;
      case 'saveedit':
        var ed = ui.editing; if (!ed) return;
        syncDraft();
        var etxt = (ed.d.text || '').trim();
        if (!etxt) { ed.err = ed.kind === 'req' ? 'Write a request first.' : 'Write something first.'; render(); return; }
        if (ed.kind === 'req') {
          var er = S.requests.filter(function (x) { return x.id === ed.id; })[0];
          if (er) { er.text = etxt; if (ed.d.cat) er.cat = ed.d.cat; if (er.answered) er.answered.note = (ed.d.note || '').trim(); }
        } else {
          var ee = S.journal.filter(function (x) { return x.id === ed.id; })[0];
          if (ee) { ee.text = etxt; ee.thanks = (ed.d.thanks || '').trim(); ee.edited = new Date().toISOString(); }
        }
        ui.editing = null; ui.flash = ''; save(); render(); return;
      case 'export': doExport(); return;
      case 'copybackup': doCopyBackup(); return;
      case 'restore':
        var rt = val('restoreText');
        if (!rt) { flash('Paste your backup first, or choose a backup file.'); return; }
        prepareRestore(rt, ''); return;
      case 'restoreconfirm': applyRestore(); return;
      case 'restorecancel': ui.pendingRestore = null; render(); return;
    }
  }

  function backupStatus() {
    if (!S.lastBackup) return 'You haven\u2019t saved a backup yet.';
    var t = new Date(S.lastBackup);
    if (isNaN(t.getTime())) return 'You haven\u2019t saved a backup yet.';
    var days = Math.floor((Date.now() - t.getTime()) / 86400000);
    return 'Last backed up ' + t.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) + (days >= 7 ? '. It\u2019s been a while, so now is a good time for a new one.' : '.');
  }
  function backupData(stamp) {
    var o = {};
    for (var k in S) o[k] = S[k];
    o.lastBackup = stamp;
    return JSON.stringify(o, null, 2);
  }
  function backupDone(stamp, msg) { S.lastBackup = stamp; save(); flash(msg); }
  function browserDownload(filename, text) {
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  }
  function doExport() {
    var stamp = new Date().toISOString(), data = backupData(stamp), filename = 'prayer-book-backup-' + dkey() + '.json';
    function fallback() {
      try { browserDownload(filename, data); backupDone(stamp, 'Backup saved. Look in your Downloads folder.'); }
      catch (e) { flash('Couldn\u2019t save a file here. Try Copy backup instead.'); }
    }
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function (dl) {
        if (!dl) { fallback(); return; }
        return dl.save({ filename: filename, data: data }).then(function () { backupDone(stamp, 'Backup saved.'); }, function (err) {
          if (err && err.code === 'declined') return;
          flash('Couldn\u2019t save the backup. Try Copy backup instead.');
        });
      }, fallback);
    } else fallback();
  }
  function doCopyBackup() {
    var stamp = new Date().toISOString(), data = backupData(stamp);
    function shown() { ui.backupShow = true; flash('Couldn\u2019t copy automatically. Select the text below and copy it yourself.'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(data).then(function () { ui.backupShow = false; backupDone(stamp, 'Backup copied. Paste it into a note or message and keep it safe.'); }, shown);
    } else shown();
  }
  function prepareRestore(raw, label) {
    var d = null;
    try { d = JSON.parse(raw); } catch (e) {}
    if (!d || !Array.isArray(d.slots) || !Array.isArray(d.requests) || !Array.isArray(d.journal) || !d.done || typeof d.done !== 'object') {
      ui.pendingRestore = null; flash('That doesn\u2019t look like a Prayer Book backup.'); return;
    }
    ui.pendingRestore = { data: d, label: label || '' }; ui.flash = ''; render();
  }
  function applyRestore() {
    var pr = ui.pendingRestore; if (!pr) return;
    var d = pr.data;
    try { localStorage.setItem(KEY + ':before-restore', JSON.stringify(S)); } catch (e) {}
    (d.requests || []).forEach(function (r) { if (typeof r.shelved === 'undefined') r.shelved = false; if (typeof r.shelvedAt === 'undefined') r.shelvedAt = null; });
    S = {
      slots: d.slots, done: d.done || {}, requests: d.requests, journal: d.journal,
      verse: d.verse || { day: '', offset: 0 }, quote: d.quote || { day: '', offset: 0 }, devRead: d.devRead || {}, eveRead: d.eveRead || {},
      lastBackup: typeof d.lastBackup === 'string' ? d.lastBackup : ''
    };
    ui.pendingRestore = null; ui.editing = null; save(); flash('Backup restored.');
  }
  function syncDraft() {
    var ed = ui.editing; if (!ed) return;
    var map = ed.kind === 'req' ? { text: 'editReqText', cat: 'editReqCat', note: 'editReqNote' } : { text: 'editEntryText', thanks: 'editEntryThanks' };
    for (var k in map) { var el = document.getElementById(map[k]); if (el && typeof el.value === 'string') ed.d[k] = el.value; }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (el) act(el.getAttribute('data-act'), el.getAttribute('data-id'));
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var t0 = e.target, en0 = t0 && t0.getAttribute && t0.getAttribute('data-enter');
      if (en0) { e.preventDefault(); act(en0, null); return; }
    }
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target;
    if (el && el.getAttribute && el.getAttribute('role') === 'button' && el.getAttribute('data-act')) {
      e.preventDefault(); act(el.getAttribute('data-act'), el.getAttribute('data-id'));
    }
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    if (el.getAttribute('data-note') && ui.session) ui.session.notes[ui.session.step] = el.value;
    var dk = el.getAttribute('data-draft');
    if (dk && ui.editing) ui.editing.d[dk] = el.value;
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    var dk = el.getAttribute('data-draft');
    if (dk && ui.editing) { ui.editing.d[dk] = el.value; return; }
    if (el.id === 'restoreFile') {
      var file = el.files && el.files[0]; if (!file) return;
      var fr = new FileReader();
      fr.onload = function () { prepareRestore(String(fr.result || ''), file.name); };
      fr.onerror = function () { flash('Couldn’t read that file.'); };
      fr.readAsText(file); return;
    }
    var id = el.getAttribute('data-slot');
    if (!id) return;
    var s = S.slots.filter(function (x) { return x.id === id; })[0]; if (!s) return;
    var f = el.getAttribute('data-field');
    if (f === 'on') s[f] = el.checked;
    else if (f === 'time') { if (!el.value) return; s[f] = el.value; }
    else s[f] = el.value.trim() || 'Prayer';
    save();
    if (f !== 'label') render();
  });

  if (typeof navigator !== 'undefined' && navigator.serviceWorker && window.self === window.top) {
    window.addEventListener('load', function () {
      try { navigator.serviceWorker.register('./sw.js').catch(function () {}); } catch (e) {}
    });
  }

  setInterval(function () {
    if (ui.session && ui.session.rest && ui.session.rest.running) {
      var rem = restRemaining(ui.session);
      ui.session.rest.remaining = rem;
      if (rem <= 0) {
        ui.session.rest.running = false; ui.session.rest.endAt = null; ui.session.rest.done = true; ui.session.rest.endedEarly = false;
        try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
      }
      if (tab === 'pray') render();
    }
  }, 1000);

  setInterval(function () { if (tab === 'today' && !document.hidden) render(); }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { wakeLock = null; wakePending = false; if (tab === 'today' || ui.session) render(); } });
  render();
})();
</script>
</body>
</html>
