    {"d": "2026-12-23", "ref": "Luke 14:10", "theme": "Go and Sit Down", "r": "But go and sit down in the lowest room. A new believer typically approaches God with a trembling, uncertain fear, instinctively taking the lowest possible place, unsure of any real welcome. This is not, in itself, a flaw to quickly outgrow with embarrassment, but it does, with real growth, change shape over time: the same fear slowly becomes something closer to reverence, still humble but no longer anxious, and the believer finds themselves actually called higher, invited into closer access rather than left indefinitely at the furthest distance from the table.\n\nWhat makes that closer access possible is not growing personal merit earned through longer discipleship, but the same covering that was available from the very first trembling approach: the blood and righteousness of Christ, which was never partial or provisional to begin with. As a believer matures, what becomes more visible is not God's demanding majesty, which was always real, but his covenant goodness, which was also always real but took longer to actually come into focus through growing familiarity.\n\nThe soul that has grown this way enjoys a freedom in approaching God that the newer, more anxious believer has not yet discovered, bowing in genuine humility while simultaneously resting, without contradiction, in the plain awareness of boundless mercy already secured. If you still find yourself hovering nervously near the lowest room out of old habit rather than present necessity, consider whether you have actually been invited higher and simply have not yet taken the seat.", "q": ["Have I been hovering at the lowest room out of old habit, when I've actually been invited to closer access?", "What would it look like today to hold both humility and confidence together rather than choosing one over the other?"], "p": "Lord, thank you for inviting me closer rather than leaving me at a trembling distance. Let me take the place you've actually given me. Amen.", "k": "bring us to be what he is"},
    {"d": "2026-12-24", "ref": "2 Corinthians 8:9", "theme": "Though He Was Rich", "r": "Though he was rich, yet for your sakes he became poor. Real fellowship between two people requires something more than polite proximity; it requires a genuine sharing of actual substance, which is why a wealthy believer cannot have true fellowship with a poor one while keeping every resource carefully to themselves. Applied to Christ, this principle explains something essential about why the incarnation had to happen in the specific, costly way it did.\n\nBecause of the fall, humanity in its natural condition simply could not commune with a holy God, the gap too wide for ordinary closeness to bridge on its own. For genuine fellowship to become possible at all, the Savior had to actually impart his own riches rather than simply observing human poverty from a comfortable distance, giving over his own estate to people who had, relationally speaking, nothing of their own to offer in return. He clothed what was bare in his own righteousness and washed what was stained in his own blood, not adjacent acts of charity but the specific prerequisites fellowship itself required.\n\nPoverty had to be enriched, and guilt had to be covered, before the soul could actually walk alongside a pure and holy God rather than merely admiring him from outside the relationship. As you consider this exchange today, notice what it actually cost the one making it, and let that costliness, rather than mere sentiment, be what moves you toward him this Christmas Eve.", "q": ["Do I see Christ's incarnation mainly as sentiment, or do I actually grasp what it specifically cost him?", "Is there a relationship in my own life where real fellowship requires me to share actual substance, not just polite proximity?"], "p": "Lord Jesus, thank you for becoming poor so that I could be made rich. Let the real cost of that move me today, not just the sentiment of it. Amen.", "k": "made man that we might be made God"},
    {"d": "2026-12-25", "ref": "Isaiah 7:14", "theme": "Immanuel", "r": "Therefore the Lord himself shall give you a sign; Behold, a virgin shall conceive. Go, in imagination, to Bethlehem alongside the shepherds and the distant travelers who actually made that journey, and look honestly at what you find there: God himself, in human flesh, close enough to call both Jehovah and brother in the very same breath, a claim that sounded as startling the first time it was made as it still does today when actually considered rather than merely celebrated by habit.\n\nThe conception itself remains genuinely singular, unrepeated before or since, the specific, miraculous fulfillment of an ancient promise that one born of woman would ultimately deal with the ancient breach between humanity and God. In his human nature, Christ's holiness restores something of what humanity had lost, which is why believers are invited not merely to admire his birth from a distance but to actually pray for him to be formed within their own lives, not a historical event only but a present, ongoing reality.\n\nIt is worth noticing, too, how humble the actual circumstances were: an unknown young woman, neither wealthy nor politically connected, and a newborn king given the kind of poor, makeshift welcome that no one would have planned in advance for royalty. The name given to him, Immanuel, God with us, reaches further than that single night, covering his presence in ordinary life, in sorrow, in judgment borne, in the grave, in resurrection, and in whatever is still to come. Worship him today as genuinely with you, not merely once, long ago, in a stable.", "q": ["Do I approach Christmas as mere celebration by habit, or do I actually let the strangeness of Immanuel land freshly?", "What would it mean to pray for Christ to be formed in me today, not just to admire his birth as history?"], "p": "Lord Jesus, Immanuel, God with us. Be with me today, not just in the story I celebrate but in the actual circumstances of this day. Amen.", "k": "The Word without a word"},
    {"d": "2026-12-26", "ref": "1 Corinthians 15:45", "theme": "The Last Adam", "r": "The last Adam was made a quickening spirit. Just as the first Adam represented and acted on behalf of the whole human race under a covenant of works, so Christ, the second Adam, represents and acts on behalf of everyone united to him under an entirely different covenant, one of grace rather than earned merit. Believers, in a sense Scripture takes seriously rather than merely poetically, were already present in him, the way an ancestor's descendants could be said to have acted within him long before they were individually born.\n\nWhatever Christ has accomplished, he accomplished specifically for his whole church rather than only for himself in isolation, which means believers can genuinely say they were crucified, buried, raised, and seated with him, not as a figure of speech alone but as a real, spiritual participation in his own history. The church, looked at this way, is not approved by God on the strength of her own, often inconsistent, record, but is viewed with the same complacency God holds toward his own beloved Son, because she is seen specifically in him rather than examined separately from him.\n\nJust as Adam's first sin was credited to all those descending from him, the second Adam's obedience is credited, in exactly the same structural way, to everyone united to him by faith. This is the actual foundation beneath the whole covenant of grace, not a minor supporting detail but the load-bearing wall itself. Rest your own standing on that structure today rather than on your own performance.", "q": ["Am I resting my standing with God on Christ's obedience credited to me, or on my own inconsistent performance?", "How does it change things to think of myself as having genuinely participated in Christ's death and resurrection, not just benefited from them?"], "p": "Lord, thank you that I am viewed in Christ, not examined separately from him. Let me rest in his obedience credited to me today. Amen.", "k": "will not save you without you"},
    {"d": "2026-12-27", "ref": "Job 8:11", "theme": "Can the Rush Grow Without Mire?", "r": "Can the rush grow up without mire? can the flag grow without water? A rush is spongy, hollow, entirely dependent on the wet ground it happens to be standing in, thriving only as long as favorable conditions continue and withering almost immediately once they do not. The comparison Scripture draws is pointed rather than gentle: a hypocrite's religion behaves the same way, flourishing visibly only while circumstances remain comfortable, and collapsing the moment comfort is withdrawn.\n\nThis deserves honest, specific self-examination rather than a quick reassurance that it surely does not describe you. Does your own devotion show up reliably only in good company, warm feelings, and received comforts, the religious equivalent of the rush's favorable mire? Or does it actually hold, and in some cases even grow stronger, precisely when the mire dries up and the comfortable conditions disappear? The difference between genuine faith and mere religious performance rarely shows itself clearly until the conditions supporting performance are removed.\n\nGenuine godliness, strikingly, often grows best in exactly the circumstances that would wither a rush, worldly comfort declining rather than increasing. If your own spiritual life has recently lost some of its favorable mire, job security, health, approval, ease, do not assume this means your faith is failing. It may be the very moment that reveals, honestly, whether what has been growing in you was ever rooted in Christ or merely rooted in comfortable circumstances all along.", "q": ["Does my own devotion show up reliably only when circumstances are comfortable, or does it hold when comfort is removed?", "What recent loss of comfort in my life might actually be revealing, rather than threatening, the real root of my faith?"], "p": "Lord, let my faith be rooted in you, not in favorable circumstances. If the mire dries up, let me still be found growing. Amen.", "k": "found difficult; and left untried"},
    {"d": "2026-12-28", "ref": "Galatians 2:20", "theme": "I Live, Yet Not I", "r": "I live; yet not I, but Christ liveth in me. Before anything else can follow, life itself has to be given first, which is why the very first word spoken over the helpless, bloodied figure in an earlier passage is simply Live, a single word establishing the possibility of everything that comes after it. The life in question here is not generic vitality but specifically Christ's own life, flowing the way sap flows from a stem into a branch, not a borrowed resource occasionally tapped but a continuous, living connection sustaining everything that grows from it.\n\nFaith's role in this is to actually perceive and hold onto a union that was already real before faith noticed it, not creating the connection but recognizing and relying on what Christ himself has already established and continues to strengthen with his own, described here as eternal, arms. When this union is genuinely grasped rather than merely affirmed as correct doctrine, something practical follows: love, confidence, joy, and real fellowship all begin flowing between the believer and Christ in a way that abstract agreement alone never produces.\n\nThere is a particular nearness available to a soul that has actually perceived this oneness, as close to heaven, this reading suggests, as anything available on this side of it. If your own sense of union with Christ has felt more like theological accuracy than living connection lately, ask today for faith to actually perceive what has already, quietly, been true all along.", "q": ["Has my sense of union with Christ felt more like correct theology than an actual living connection lately?", "What would change today if I actually perceived, rather than just affirmed, that his life is flowing through me?"], "p": "Lord, I live, yet not I, but Christ in me. Let me perceive that union today, not just believe it as doctrine. Amen.", "k": "I turn the cake that is frying on the pan"},
    {"d": "2026-12-29", "ref": "1 Samuel 7:12", "theme": "Hitherto Hath the Lord Helped Us", "r": "Hitherto hath the Lord helped us. That single word, hitherto, does real work in two directions at once, and both are worth holding onto deliberately. Looking backward, it covers every year behind you, every circumstance already survived, a long avenue stretching back further than memory easily reaches, mercy forming the overhead canopy and faithfulness the pillars actually holding that canopy up rather than merely decorating it.\n\nLooking forward, the same word is honest that the road is not finished yet. More trials almost certainly lie ahead, along with more triumphs, and eventually death itself, followed by whatever glory waits beyond it. Hitherto does not promise the journey is over; it promises that the pattern already established across everything behind you gives real, earned confidence about what still lies ahead, not blind optimism but confidence actually built on a long, specific track record.\n\nThe natural response to a record this consistent is not quiet, private gratitude alone but something more deliberate: raising an actual Ebenezer, a memorial specifically marking what has been true so far, a stone set down not to impress anyone else but to remind yourself, on harder days still to come, exactly what this single word has already proven. Whatever has helped you arrive at today, name it specifically rather than letting gratitude stay vague, and trust that the same hand behind hitherto has not grown tired of helping as the road continues.", "q": ["Looking back honestly, what specific help from God have I let stay vague gratitude instead of naming it clearly?", "What would it look like to set an actual marker, a specific reminder, of how God has helped me so far?"], "p": "Lord, hitherto you have helped me. Thank you for the specific mercies behind me, and I trust you for whatever road is still ahead. Amen.", "k": "By perseverance the snail reached the ark"},
    {"d": "2026-12-30", "ref": "Ecclesiastes 7:8", "theme": "Better Is the End", "r": "Better is the end of a thing than the beginning thereof. Christ's own story follows exactly this pattern before it is asked of anyone else: a beginning marked by rejection and genuine lowliness, followed by an end seated at the Father's right hand in glory that the beginning gave almost no visible hint of. Believers united to him are told plainly to expect the same shape, the cross coming before the crown, not as an unfortunate detour but as the actual, necessary order of things.\n\nA worm eventually becomes a winged creature, nothing about its crawling beginning suggesting what it will later become. A rough, unremarkable stone becomes a diamond only through the deliberate, often uncomfortable work of a skilled cutter who can see what the stone cannot yet see about itself. Both images point toward the same pattern: the beginning of a genuine thing is reliably less glorious than wherever it is actually heading, however little that is visible from partway through the process.\n\nIf you currently feel very much like the stone still being cut rather than the finished jewel, under real pressure with the end nowhere clearly in sight yet, this is, strangely, consistent with being exactly where you are meant to be rather than evidence that something has gone wrong. Faith and patience are what carry the process through to its actual completion, and on the day God gathers up what belongs to him, every one of his people will contribute a distinct ray of a glory none of them could have produced while still only partly cut.", "q": ["Do I judge my current spiritual state by its rough beginning rather than trusting the end it's actually headed toward?", "What current pressure or cutting in my life might be exactly the process producing something I can't yet see?"], "p": "Lord, the end is better than the beginning. Let me trust the process of being cut and shaped, even when I can't yet see the finished jewel. Amen.", "k": "all manner of thing shall be well"},
    {"d": "2026-12-31", "ref": "John 7:37", "theme": "If Any Man Thirst", "r": "If any man thirst, let him come unto me, and drink. On the final day of a feast already drawing to a close, Jesus did not grow quieter or less urgent; he pleaded, loudly and tenderly at once, exactly the posture this reading pictures him taking again on the last day of this particular year, pleading still with whoever happens to be reading these words today, not finished pressing the invitation simply because the calendar is nearly finished.\n\nWhat is actually on offer is comprehensive rather than partial: the atonement to settle a troubled conscience, the gospel to actually instruct a confused mind, and Christ himself to satisfy a restless heart that has tried, probably repeatedly this year, to satisfy itself elsewhere without success. The invitation does not discriminate by the particular flavor of thirst a person carries, spiritual exhaustion, moral failure, grief, confusion, or simple weariness with how the year has gone; it is addressed to every thirsty person without exception, and it comes from someone genuinely, personally present to receive the response rather than a vague principle to privately adopt.\n\nNo preparation is required before coming, no cleaned-up version of yourself assembled first for presentation. Fools, by the plain words used here, thieves, sinners, all are welcome to drink exactly as they currently are. Whatever this year has actually been for you, let its final day include this specific, concrete act: come, honestly thirsty, and drink, before the year closes and a new one begins.", "q": ["What kind of thirst have I been carrying this year that I've tried to satisfy somewhere other than Christ?", "What would it mean to come to him today exactly as I am, without first cleaning myself up?"], "p": "Lord Jesus, I come thirsty, as this year ends, exactly as I am. Satisfy what I have not been able to satisfy on my own. Amen.", "k": "What can I give him, poor as I am"},
    {"ref": "Psalm 23:1-3", "theme": "Provision", "r": "Sheep don’t have to work out where the grass is. The shepherd leads them. The psalm doesn’t promise every path will be easy, but it does say who is leading. When you feel anxious about what you’ll lack, remember you’re not the one in charge of provision. Let him lead you to rest, even for a few minutes today.", "q": ["What am I trying to provide for myself that I could ask my Shepherd for?", "Where do I need to be led to rest?"], "p": "Lord, you are my shepherd. Lead me today. Amen.", "k": "all manner of thing"},
    {"ref": "Proverbs 3:5-6", "theme": "Trust", "r": "Trust doesn’t mean switching off your mind. It means not making your own understanding the final authority. When a decision feels unclear, the call isn’t to figure it all out first but to acknowledge God in the step you’re taking. Direction usually comes one step at a time.", "q": ["Where am I leaning entirely on my own understanding?", "What is one step I can take and offer to God?"], "p": "Lord, I don’t see the whole road. Guide the step in front of me. Amen.", "k": "Man proposes"},
    {"ref": "Philippians 4:6-7", "theme": "Peace", "r": "Paul doesn’t say “never feel anxious.” He says what to do with anxiety: bring it to God, with thanksgiving. The promised peace doesn’t always come with answers. It comes as a guard around your heart and mind. Name what’s worrying you, thank him for something real, and hand the worry over once more.", "q": ["What is worrying me most right now?", "What can I honestly thank God for today?"], "p": "Father, I give you what I’m carrying. Guard my heart and mind with your peace. Amen.", "k": "Spirit of peace"},
    {"ref": "Isaiah 41:10", "theme": "Courage", "r": "God says “do not fear” because he is with you, not because the situation is safe. Notice the promises: I am with you, I will strengthen you, I will help you, I will uphold you. Fear shrinks when it’s set beside his presence. Whatever you face today, you’re not facing it without him.", "q": ["What am I afraid of today?", "How does knowing he is with me change how I face it?"], "p": "Lord, be my strength and my help today. Amen.", "k": "kindly Light"},
    {"ref": "Jeremiah 29:11-13", "theme": "Hope", "r": "These words were written to exiles who would spend decades in Babylon before anything changed. God’s plans for them were good, but they were long. Hope here isn’t about quick rescue. It’s about a God who is faithful over years. Seek him with your whole heart, and keep planting gardens where you are.", "q": ["Where am I waiting for something to change?", "How can I seek God wholeheartedly in the waiting?"], "p": "Lord, help me trust your long faithfulness when things move slowly. Amen.", "k": "all hearts be open"},
    {"ref": "Romans 8:28", "theme": "Purpose", "r": "The verse doesn’t say everything that happens is good. It says God works in all things for the good of those who love him. That’s a claim about the Worker, not about every event. Some things are simply sorrows. But nothing is wasted in his hands. Ask him to work good in the thing you wish hadn’t happened.", "q": ["What am I struggling to see any good in?", "What would it mean to trust him as the one who is working?"], "p": "Father, you can bring good out of what I can’t make sense of. I trust you with it. Amen.", "k": "shall not be overcome"},
    {"ref": "Matthew 6:33", "theme": "Priorities", "r": "Seek first the kingdom, and the rest follows after, not before. Most of us do the reverse: we deal with the urgent list and hope there’s room left for God. Try one small act of seeking first today, like a prayer before you check your messages, or a moment of thanks before the first meeting.", "q": ["What usually comes first in my day?", "What is one small way to put God first today?"], "p": "Lord, be first in my thoughts and my plans today. Amen.", "k": "work of God"},
    {"ref": "Psalm 46:10", "theme": "Stillness", "r": "“Be still” isn’t about finding a quiet room. It’s about ceasing to strive and remembering who God is. Try two minutes with no requests. Just sit and remember that he is God and you are not, which is more a relief than a rebuke.", "q": ["What am I striving to control right now?", "What would two minutes of silence with God look like?"], "p": "Lord, quiet my striving. Help me know that you are God. Amen.", "k": "silent and be"},
    {"ref": "Matthew 11:28-30", "theme": "Rest", "r": "Jesus invites the weary and burdened to come to him. His yoke isn’t the absence of work but work shared, and gentle. If you’re tired, this is an invitation and not a lecture. Come with the weariness you actually have, not the tidy version.", "q": ["Where am I most weary right now?", "What would it mean to take his yoke instead of my own?"], "p": "Jesus, I’m tired. Give me your rest. Amen.", "k": "restless"},
    {"ref": "1 Peter 5:6-7", "theme": "Worry", "r": "Humility and worry are linked. Worry often assumes we have to hold everything up ourselves. Peter says to cast our anxiety on God because he cares for us. Casting is a deliberate act. Name each worry, hand it to him, and then take the next small step.", "q": ["What worries am I holding that I could hand over?", "What is the next small step after I let go?"], "p": "Father, you care for me. I cast my worries on you. Amen.", "k": "kindly Light"},
    {"ref": "Galatians 5:22-23", "theme": "Character", "r": "Fruit grows slowly, and it can’t be manufactured by effort. The Spirit produces love, joy, peace, patience, kindness, goodness, faithfulness, gentleness and self-control in people who stay connected to him. Which fruit feels smallest in you right now? Ask for that one, and notice where it gets tested today.", "q": ["Which of these do I most need?", "Where will it be tested today?"], "p": "Holy Spirit, grow in me what I can’t grow on my own. Amen.", "k": "Love, and do what you will"},
    {"ref": "Colossians 3:23-24", "theme": "Work", "r": "Whatever you do, work at it as for the Lord. That includes the paperwork, the unseen tasks and the difficult people. The audience that matters most isn’t the one in the room. Offer this day’s work to him before you begin, and let that change how you do the small things.", "q": ["What task today feels too small or dull to matter?", "How would I do it if Christ were watching?"], "p": "Lord, receive my work today as an offering to you. Amen.", "k": "cake that is frying"},
    {"ref": "James 1:5", "theme": "Wisdom", "r": "James says to ask God for wisdom, and that he gives generously without scolding. Many of us hesitate because we think we should already know. Ask plainly about the decision in front of you, and then pay attention over the coming days to counsel, circumstances and Scripture.", "q": ["What decision do I need wisdom for?", "Who wise could I talk to about it?"], "p": "Father, I lack wisdom. Please give it generously. Amen.", "k": "Teach me to seek you"},
    {"ref": "Psalm 119:105", "theme": "Guidance", "r": "A lamp lights the next few steps, not the whole road. That’s frustrating if you want the map, but it’s how guidance usually works. Read a small passage of Scripture today and ask what one step it suggests. Take that step and see what the lamp shows next.", "q": ["What passage could I read today?", "What one step might it be asking of me?"], "p": "Lord, let your word light my next step. Amen.", "k": "Ignorance of Scripture"},
    {"ref": "Hebrews 11:1", "theme": "Faith", "r": "Faith isn’t a feeling of certainty. It’s confidence in what God has promised even though it isn’t yet visible. The people in Hebrews 11 mostly didn’t see the promise fulfilled in their lifetime. Faith is a long obedience, not a single leap. What have you been asked to keep doing, unseen?", "q": ["What am I hoping for that I can’t yet see?", "What faithful thing can I keep doing today?"], "p": "Lord, increase my faith to trust what I can’t see. Amen.", "k": "to believe what you do not see"},
    {"ref": "2 Corinthians 12:9", "theme": "Grace", "r": "Paul asked three times for a weakness to be taken away. The answer wasn’t removal but grace, with power made perfect in weakness. That doesn’t make weakness good, but it means God can work through the parts we’d hide. Where are you weak today? Ask for his grace there, and not only for its removal.", "q": ["Where do I feel weak today?", "How might God’s grace be enough there?"], "p": "Lord, in my weakness, be my strength. Amen.", "k": "poor as I am"},
    {"ref": "Psalm 27:1", "theme": "Fear", "r": "Light, salvation, stronghold: the psalmist stacks three names for God against fear. Fear doesn’t vanish, but it gets a rival. What are you afraid of today? Say it aloud, then say the verse. Notice which one feels bigger.", "q": ["What fear keeps coming back to me?", "Which of God’s names do I most need today?"], "p": "Lord, you are my light and my stronghold. Whom shall I fear? Amen.", "k": ""},
    {"ref": "Micah 6:8", "theme": "Justice", "r": "Do justice, love mercy, walk humbly. It’s a short list and it isn’t about being impressive. Justice looks like fairness in ordinary dealings, mercy like patience with failure, humility like staying near God. Which of the three is hardest for you right now?", "q": ["Which of the three do I most need to practice?", "Who could I treat more fairly or more gently today?"], "p": "Lord, teach me to act justly, love mercy and walk humbly with you. Amen.", "k": "steal from them"},
    {"ref": "1 Thessalonians 5:16-18", "theme": "Gratitude", "r": "Rejoice always, pray continually, give thanks in everything. Paul isn’t asking for fake cheer. He’s describing a way of living turned toward God. Thanks in all circumstances, not for all circumstances. Find one thing today, however small, that you can honestly thank him for.", "q": ["What is one small thing I can thank God for right now?", "What makes it hard to give thanks today?"], "p": "Lord, turn my heart toward gratitude today. Amen.", "k": "bright and beautiful"},
    {"ref": "Romans 5:8", "theme": "Love", "r": "God didn’t wait for us to be presentable. While we were still sinners, Christ died for us. Love that waits for us to deserve it isn’t what the gospel describes. Let that settle before you start trying to earn anything today.", "q": ["Where do I feel I have to earn love?", "What would it be like to simply receive his?"], "p": "Jesus, thank you for loving me before I deserved it. Amen.", "k": "measure of love"},
    {"ref": "Psalm 37:4-5", "theme": "Delight", "r": "Delight in the Lord, and commit your way to him. Both verbs are about relationship, not technique. When your delight is in him, your desires slowly change shape. What have you been trying to control that you could commit to him?", "q": ["What gives me delight in God?", "What am I gripping that I can commit to him?"], "p": "Lord, be my delight. I commit my way to you. Amen.", "k": ""},
    {"ref": "Proverbs 16:3", "theme": "Plans", "r": "Commit your work to the Lord, and your plans will be established. Making plans isn’t unspiritual. Presenting them to God is. Write down what you hope to do this week and hold it out open-handed.", "q": ["What am I planning that I haven’t prayed about?", "What would holding it open-handed look like?"], "p": "Lord, I commit my work and plans to you. Amen.", "k": "definite service"},
    {"ref": "John 14:27", "theme": "Peace", "r": "Jesus leaves his peace, and it isn’t the world’s kind, which depends on circumstances. His peace is a gift given before the crisis resolves. Take one anxious thought today and answer it with this: he has already given you peace, and you may receive it.", "q": ["What is disturbing my peace today?", "How can I receive the peace he has already given?"], "p": "Lord Jesus, give me your peace, and calm my troubled heart. Amen.", "k": "Let nothing disturb"},
    {"ref": "John 15:5", "theme": "Abiding", "r": "Branches don’t strain to produce fruit. They stay attached. Abiding is unglamorous: time with Jesus, obedience, staying near. Apart from him, you can do nothing. What has been pulling you away from the vine this week?", "q": ["What pulls me away from staying close to Jesus?", "What is one way to abide today?"], "p": "Jesus, keep me close to you. Bear your fruit in me. Amen.", "k": "soul happy in the Lord"},
    {"ref": "Psalm 139:13-14", "theme": "Worth", "r": "You were knit together on purpose. That applies to the body you sometimes criticize and the mind you sometimes doubt. Worth isn’t earned. It’s given by the one who made you. Thank him today for one thing about how you’re made.", "q": ["What do I criticize most about myself?", "What can I thank God for in how I’m made?"], "p": "Lord, thank you for making me. Help me see myself as you do. Amen.", "k": "glory of God is a living human"},
    {"ref": "Psalm 51:10-12", "theme": "Renewal", "r": "David prays this after his worst failure. Notice what he asks for: a clean heart, a steadfast spirit, God’s presence, restored joy. Confession isn’t only about the past. It’s a request to be made new. Bring what you’re ashamed of, and ask for a fresh start.", "q": ["What do I need to bring to God honestly?", "What would a fresh start look like?"], "p": "Create in me a clean heart, O God, and renew a steadfast spirit within me. Amen.", "k": "hatest nothing"},
    {"ref": "Matthew 7:7-8", "theme": "Asking", "r": "Ask, seek, knock: the verbs are continuous, so keep asking. God isn’t irritated by persistence. It may reveal what you really want, or change what you ask for. What have you stopped praying about because it seemed pointless? Start again.", "q": ["What have I stopped asking God for?", "What would persistent asking look like this week?"], "p": "Father, I keep asking, seeking and knocking. Thank you for hearing. Amen.", "k": "heart without words"},
    {"ref": "Psalm 62:5-8", "theme": "Pouring out", "r": "Wait in silence for God alone, but also pour out your heart to him. Both are true. The silence isn’t empty and the pouring isn’t rude. Today, don’t edit yourself in prayer. Tell him what’s actually there.", "q": ["What am I holding back from God?", "What would it be like to pour it all out?"], "p": "God, you are my refuge. I pour out my heart to you. Amen.", "k": "surge of the heart"},
    {"ref": "Isaiah 43:2", "theme": "Presence", "r": "God doesn’t promise to keep you out of the waters or the fire. He promises to be with you in them. That’s a different kind of safety. Where do you feel you’re in deep water right now? Picture him beside you there, and ask him for what you need to keep going.", "q": ["Where do I feel like I’m in deep water?", "What would it mean to know he is with me in it?"], "p": "Lord, be with me in the waters I can’t avoid. Amen.", "k": ""},
    {"ref": "Romans 15:13", "theme": "Hope", "r": "Hope here is something God gives, and it overflows by the power of the Spirit. It isn’t optimism about how things will turn out. It’s joy and peace in believing. If you feel dry, ask for it directly, and don’t wait until you feel hopeful before you ask.", "q": ["Where is hope running low in me?", "What would it mean to ask for hope as a gift?"], "p": "God of hope, fill me with joy and peace as I trust you. Amen.", "k": "Love divine"},
    {"ref": "Psalm 90:12", "theme": "Time", "r": "Number your days, and teach us to. It isn’t morbid, it’s clarifying: your time is limited, so the question is what to give it to. Today is one of your days. What is the one thing you want to have done well by tonight?", "q": ["What is the one thing that matters most today?", "What could I let go of to make room for it?"], "p": "Lord, teach me to number my days and gain a heart of wisdom. Amen.", "k": "dying man to dying men"},
    {"ref": "Galatians 6:9", "theme": "Perseverance", "r": "Don’t grow weary in doing good, for the harvest comes in due time. Notice “in due time.” The delay is part of the design. If you’ve been faithful in something that isn’t bearing visible fruit, keep on. It isn’t wasted.", "q": ["What good work am I tempted to give up on?", "What might a harvest look like in due time?"], "p": "Lord, keep me from growing weary in doing good. Amen.", "k": "live with all my might"},
    {"ref": "Hebrews 4:15-16", "theme": "Mercy", "r": "Jesus knows weakness from the inside, so you don’t need to approach him with a polished version of yourself. The throne is called a throne of grace. Come boldly with your actual failures, and receive mercy and help at the moment you need it.", "q": ["What do I hesitate to bring to God?", "What help do I need from him right now?"], "p": "Jesus, I come with my need. Give me mercy and grace to help. Amen.", "k": "Love bade me welcome"},
    {"ref": "Psalm 16:8", "theme": "Steadiness", "r": "I keep the Lord always before me, and because he is at my right hand, I will not be shaken. Steadiness comes from where you fix your attention. Try starting your next three tasks with one breath of awareness that he is with you.", "q": ["What tends to shake me during the day?", "How could I remember his presence before each task?"], "p": "Lord, keep my eyes on you so that I am not shaken. Amen.", "k": "trivial round"},
    {"ref": "Psalm 30:5", "theme": "Joy", "r": "Weeping may last for the night, but joy comes with the morning. Nights are real, and the verse doesn’t hurry them. But it says they end. If you’re in a night, hold on to the possibility of morning. If you’re in the morning, remember someone who isn’t.", "q": ["Am I in a night or a morning right now?", "Who could I pray for who is in a long night?"], "p": "Lord, bring joy in the morning, and be near to those who weep. Amen.", "k": ""},
    {"ref": "Nehemiah 8:10", "theme": "Joy", "r": "The joy of the Lord is your strength. This was said to people weeping as they heard the law read, and they were told to eat, drink and share with those who had nothing. Joy here is communal and practical. Who could you share something with today?", "q": ["What is one practical way to share joy today?", "Who could use a meal, a message or a gift?"], "p": "Lord, let your joy be my strength, and let me share it. Amen.", "k": "coat in your closet"},
    {"ref": "Psalm 91:1-2", "theme": "Shelter", "r": "To dwell in the shelter of the Most High is a picture of staying, not visiting. Shelter isn’t escape from all harm. It’s a place to live in the middle of it. Make your home there today by returning to him whenever your mind drifts.", "q": ["When does my mind drift from God today?", "How could I return to him in those moments?"], "p": "Lord, you are my refuge and my fortress. I trust in you. Amen.", "k": "Christ be with me"},
    {"ref": "Romans 8:38-39", "theme": "Love", "r": "Neither death nor life, nor anything else in all creation, can separate us from the love of God in Christ Jesus. The list is comprehensive on purpose. On the days you feel far from him, the distance isn’t on his side.", "q": ["What makes me feel far from God’s love?", "How does this verse answer that feeling?"], "p": "Lord, thank you that nothing can separate me from your love. Amen.", "k": "not my own"},
    {"ref": "Ephesians 3:20-21", "theme": "Power", "r": "God is able to do far more than we ask or imagine, according to the power at work in us. Sometimes we pray small because we’ve been disappointed. Ask for something larger than usual today, and leave the outcome to him.", "q": ["What have I stopped asking for because I was disappointed?", "What bigger request could I bring to God today?"], "p": "Father, you can do more than I ask or imagine. Work in me and through me. Amen.", "k": "Give what you command"},
    {"ref": "James 4:8", "theme": "Nearness", "r": "Draw near to God and he will draw near to you. The first step is small and it’s yours: a prayer, a page of Scripture, a moment of silence. He isn’t hard to find. What would drawing near look like in the next ten minutes?", "q": ["What small step could I take toward God today?", "What keeps me from taking it?"], "p": "Lord, I draw near to you. Draw near to me. Amen.", "k": "ear of your heart"},
    {"ref": "Psalm 103:8-12", "theme": "Forgiveness", "r": "As far as the east is from the west, so far has he removed our transgressions from us. He doesn’t treat us as our sins deserve. If you’re carrying something God has forgiven, you may need to put it down. Ask him to help you believe you’re forgiven.", "q": ["What am I still carrying that God has forgiven?", "What would it mean to believe I’m forgiven?"], "p": "Lord, you are merciful and gracious. Help me receive your forgiveness. Amen.", "k": "Lighten our darkness"},
    {"ref": "1 Corinthians 13:4-7", "theme": "Love", "r": "Read this as a description of how God loves you before you read it as a to-do list for loving others. Patient, kind, not keeping a record of wrongs. Then pick one phrase to practice today with someone who is difficult.", "q": ["Which phrase do I find hardest to live out?", "Who could I practice it with today?"], "p": "Lord, love me with your patience and teach me to love like you. Amen.", "k": "Love feels no burden"},
    {"ref": "Psalm 73:26", "theme": "Strength", "r": "My flesh and my heart may fail, but God is the strength of my heart and my portion forever. This psalm begins in envy and confusion and ends here. Honest wrestling can lead to a firmer faith. What are you wrestling with that you can bring to him?", "q": ["What am I wrestling with?", "How can I bring it honestly to God?"], "p": "Lord, when my strength fails, be the strength of my heart. Amen.", "k": "reasons which reason does not know"},
    {"ref": "Matthew 5:3-6", "theme": "Blessing", "r": "The Beatitudes turn our assumptions upside down: blessed are the poor in spirit, those who mourn, the meek, those who hunger for righteousness. They aren’t goals to achieve but descriptions of people God is near to. Which line do you find yourself in today?", "q": ["Which of these describes me right now?", "How does it feel to hear I’m blessed there?"], "p": "Lord, thank you for being near to the humble and the hungry. Amen.", "k": "poor as I am"},
    {"ref": "Luke 10:38-42", "theme": "Attention", "r": "Martha was doing good things but was distracted and worried. Jesus doesn’t scold the serving. He points to the one thing needed, which is sitting at his feet. Where is busyness crowding out attention today? Take five minutes to sit before you serve.", "q": ["Where am I distracted by many things?", "What would it look like to sit at his feet for five minutes?"], "p": "Lord, quiet my busyness. Help me choose the one thing needed. Amen.", "k": "ear of your heart"},
    {"ref": "Mark 1:35", "theme": "Solitude", "r": "Even the busiest person in history got up early to pray in a solitary place. If Jesus needed it, we do too. Find a few minutes today that could be yours and his, even if it isn’t early and the place isn’t quiet.", "q": ["When could I find a few minutes alone with God today?", "What might I say or hear in that time?"], "p": "Lord, help me make room to be alone with you. Amen.", "k": "your cell will teach"},
    {"ref": "Psalm 42:1-2", "theme": "Thirst", "r": "A deer pants for streams of water, and the soul pants for God. Thirst is a gift that tells you what you’re made for. What have you been drinking to quench something that only he can satisfy?", "q": ["What am I using to fill a thirst only God can satisfy?", "What would it mean to come to him for it?"], "p": "Lord, my soul thirsts for you. Satisfy me. Amen.", "k": ""},
    {"ref": "John 10:11", "theme": "Shepherd", "r": "The good shepherd lays down his life for the sheep. Notice the shape of it: not just guards them, but gives himself. That’s the measure of how you’re loved. When you doubt your worth, look at what was paid.", "q": ["When do I doubt that I’m loved?", "What does it mean that he gave his life for me?"], "p": "Good Shepherd, thank you for laying down your life for me. Amen.", "k": ""},
    {"ref": "Romans 12:1-2", "theme": "Offering", "r": "Offer your bodies as a living sacrifice. It’s a physical, daily offering, not just a mental one. And don’t be conformed to this world. Be transformed by the renewing of your mind. What does offering your body look like in a day of ordinary tasks?", "q": ["What would it mean to offer today’s tasks to God?", "What pattern of the world do I need to resist?"], "p": "Lord, I offer you my body, my mind and my day. Amen.", "k": "liberty, my memory"},
    {"ref": "Psalm 139:23-24", "theme": "Examine", "r": "Search me, God, and know my heart. It’s a bold prayer, and a safe one, because the one searching loves you. Ask him to show you anything hurtful in you, and to lead you in the way everlasting. Then be quiet and listen.", "q": ["What might God want to show me about myself?", "How can I listen for it today?"], "p": "Search me, O God, and lead me in the way everlasting. Amen.", "k": "all hearts be open"},
    {"ref": "Isaiah 55:8-9", "theme": "Mystery", "r": "His thoughts aren’t ours, and his ways aren’t ours. That can sound distant, but it’s also comfort: God isn’t limited to our imagination or our analysis. When something doesn’t make sense, you don’t have to force an explanation. You can trust the one who sees more.", "q": ["What am I trying to explain that I could simply entrust to God?", "How does his greater wisdom comfort me?"], "p": "Lord, your ways are higher than mine. I trust you. Amen.", "k": "If you comprehend it"},
    {"ref": "1 Corinthians 15:58", "theme": "Steadfast", "r": "Because of the resurrection, your labor in the Lord isn’t in vain. That’s Paul’s conclusion after a long argument. Nothing done for him is wasted. Stand firm in the task you’ve been given, and let the resurrection frame it.", "q": ["What work do I sometimes feel is wasted?", "How does the resurrection change how I see it?"], "p": "Lord, keep me steadfast, knowing my labor in you is not in vain. Amen.", "k": "become all flame"},
    {"ref": "Matthew 5:14-16", "theme": "Light", "r": "You are the light of the world. Not “you should try to be,” but “you are.” A lamp doesn’t announce itself, it just shines. Let the good you do today be visible enough that someone might praise the Father.", "q": ["Where can my life point someone to God today?", "What good could I do quietly?"], "p": "Father, let my life shine so that others glorify you. Amen.", "k": "trivial round"},
    {"ref": "Psalm 19:1-2", "theme": "Creation", "r": "The heavens declare the glory of God, day after day. Creation is speaking constantly, and we rarely listen. Step outside today for a minute. Look at something you didn’t make, and let it point you to the one who did.", "q": ["What in creation lifts my heart to God?", "When could I step outside for a minute today?"], "p": "Lord, the heavens declare your glory. Open my eyes to see it. Amen.", "k": ""},
    {"ref": "Psalm 121:1-2", "theme": "Help", "r": "Where does my help come from? It comes from the Lord, who made heaven and earth. The one who keeps you doesn’t slumber. Tonight you can sleep because someone else is awake. Hand over what you can’t solve, and rest.", "q": ["What problem am I trying to solve alone?", "What would it mean to hand it to the one who never sleeps?"], "p": "Lord, my help comes from you. Keep me and mine. Amen.", "k": ""},
    {"ref": "John 14:1-3", "theme": "Home", "r": "Do not let your hearts be troubled. Jesus says this on the night before his arrest, and then he promises to prepare a place for us. Troubled hearts are often asking, where will I end up? He says he’s preparing a home and will return. Take comfort that your story ends with him.", "q": ["What is troubling my heart today?", "What does it mean that he is preparing a place for me?"], "p": "Lord Jesus, you are preparing a home for me. Calm my heart. Amen.", "k": "chief end"}

  var EVENING = {
    "09-21": {
      "ref": "Psalm 26:9",
      "r": "Fear made David pray this way, because a voice inside him whispered, \"Maybe, after all, you will be gathered in with the wicked.\" That fear, though tainted with unbelief, mostly comes from a holy anxiety that rises when we remember our past sins. Even a forgiven person may ask, \"What if my sins are remembered at the end, and I'm left off the list of the saved?\" He remembers how little fruit he bears now, so little grace, so little love, so little holiness. Looking ahead, he considers his weakness and the many temptations around him, and fears that he may fall and become the enemy's prey. A sense of sin, of present evil, and of his lingering corruptions drives him to pray, in fear and trembling, \"Do not gather my soul with sinners.\"\n\nNow, if you and I can use David's language in the verses just before this one, and say that we have walked in our integrity, and that we have trusted in the Lord without wavering, then we may also use this prayer, and be confident it will be heard. Never was a prayer more surely answered than this, if we can make it honestly, for God has never yet allowed a righteous soul to be gathered with the wicked. It is one of the last things that could happen, for it runs against the very nature of God, who judges the righteous from the wicked, and even now sets them apart in the world's estimation, though not always in outward circumstance. Wait a little; time is short. Soon the sheep and the goats will be plainly parted, and no power under heaven can force a saint into the goats' company, or drive a sinner into the fold of the sheep. What God has divided in his eternal decree, and again in the new birth, human confusion cannot unite. Like will be gathered to like at last: the tares will be bound in bundles to burn, and the wheat will be gathered into the barn. Dear reader, if you are resting only on the Lord's mercy, and are like his people in your character and walk, then rest assured, you will not be gathered with the ungodly, for by no possibility can that happen. Those who love the Lord Jesus, and rely on him, are so bound up with him, and made members of him, that as soon could you separate the Head of the church from her members as separate one true member from the rest. Where Christ is, there his people will be, world without end, for they were bought with his blood, and he will not lose so much as a single drop of the price he paid. Trust yourself with your all-glorious Surety, and you need have no anxiety about being confounded with those who will be destroyed."
    },
    "09-22": {
      "ref": "Psalm 61:2",
      "r": "Most of us know something of what it means for the heart to be overwhelmed. Whether through discovering the corruption of our own nature, or through a heavy blow of heartbreak that falls on us wave after wave until our soul faints beneath the surge and swell, we know that broken, weary feeling. At such times our one comfort is to look to God. What a mercy that we are still permitted to pray, even when the mind is in its lowest and most desponding state!\n\nThe Psalm before us was written by David when he was banished from active service, shut away from the sanctuary he loved, and yet even from that distance he pointed his soul toward \"the rock that is higher than I.\" Let us learn from him. In our darkest, most overwhelmed hours, God does not ask that we first climb to him with strong faith or fine words. He asks only that our heart, however faint, be led toward him. When you feel that everything within you has given way, that is exactly the moment for this old, well-tested prayer: \"Lead me to the rock that is higher than I.\"\n\nWhy call God a rock? Because he does not change. When storms rage over us, everything around us shifts and shakes, but he remains exactly what he has always been: an immovable refuge to those who run to him. And why \"higher than I\"? Because our troubles are often higher than our own strength, and no rock of our own choosing, no lower shelter of our own building, will keep the hurricane off us. We need a rock high enough that the storm rages far beneath its summit while we are safe upon it.\n\nNotice too that the prayer is not simply \"let me reach the rock,\" but \"lead me\" there. A troubled, overwhelmed mind cannot always find its own way to comfort; it needs guiding, piloting, almost carrying. Only the Lord himself, by his Spirit, can steer a soul safely through such a sea into so fair a harbor. Let this then be your prayer tonight, whatever the particular cause of your trouble: not that your circumstances would instantly change, but that God, by his own unfailing hand, would lead you, weary and dazed as you are, to the shelter of himself, where the storm will still rage but you, held fast upon the Rock, will be quiet at last."
    },
    "09-23": {
      "ref": "Mark 9:23",
      "r": "A father had brought his afflicted son to Jesus, and, having already watched the disciples fail to help the boy, he came with only a trembling hope, saying, \"If you can do anything, have compassion on us, and help us.\" His \"if\" reveals the wound of an unbelief that had been badly bruised by disappointment. Notice what our Lord did with that \"if.\" He did not scold the man for having doubts, nor did he simply tell him to remove the word altogether. Instead, he took the \"if\" out of the wrong place and set it down in the right one: \"If you can believe, all things are possible to him that believes.\" The man's doubt had been aimed at Christ's power, or perhaps his willingness; but the Savior shows him that the real uncertainty, the real variable in the equation, was never on Christ's side. It lies entirely with us and our capacity to believe.\n\nHow often we do exactly what this poor father did. We sense that there is an \"if\" hovering somewhere near our prayer, and, being sinful and self-focused creatures, we naturally place it beside God's power or God's love, as though those could ever be in question. But the truth is precisely the reverse. With the Lord Jesus there is no \"if\" of any kind; his arm is never shortened, his heart never grows cold. The only conditional element, if we may even call it that, lies in the mustard seed of our own trust. All things are possible, not to the strong, not to the wise, not to the well-deserving, but simply to him that believes, because true faith always operates in complete harmony with the divine will, and therefore obtains whatever it truly, believingly asks.\n\nMy soul, examine yourself tonight before you lay your head down to sleep. Where have you quietly moved the \"if\" of your prayer? Have you doubted, in your heart, whether the Lord is able, or whether he really cares to help you in the matter that presses on you now? Bring that \"if\" back to where it belongs. Say instead: \"Lord, I believe; help my unbelief,\" and you shall find that the door which seemed shut to your reasoning opens wide to your faith. All things, remember, all things, are possible to him that believes."
    },
    "09-24": {
      "ref": "Song of Solomon 5:2",
      "r": "Here is a paradox in the experience of a genuine Christian, and like most paradoxes in grace, it holds two truths together that seem, at first glance, to contradict one another. Sleep is not always what it appears to be. There is a mournful kind of sleepiness which can, at times, settle over even the truest child of God: sin has such a stupefying effect that, if it is not honestly resisted, it will reduce even a strong believer to lethargy in prayer, dullness in worship, and slackness in the pursuit of holiness. If this sleep of soul has crept over you, then you above all people ought to be alarmed by it, since around you the world is passing away, eternity is at hand, and precious souls are perishing for lack of any hand outstretched to help them. Even the wise virgins in the Lord's own parable, though they had oil in their lamps, still slumbered along with the foolish ones while the bridegroom delayed. Watchfulness is what our Master calls for; sleep, in this sense, dishonors him.\n\nBut the second half of this paradox is happier: \"my heart is awake.\" This is the mark that life has not been extinguished, only dulled, and that a struggle is going on within against the very heaviness that has come over the believer. There is something wonderfully hopeful in a heart that groans under its own dullness, longs to break free of it, and cannot rest content in a half-sleeping state, even while the outward faculties seem half-shut. That inward wakefulness, however faint, is itself the gift and work of grace, and where it exists, the Bridegroom takes notice of it. Indeed, this waking heart is, in a very real sense, the voice of Christ himself within the soul, calling, \"Open to me.\" His knock upon the door of a sleepy heart is his own gracious, patient work, seeking entrance where entrance ought never to have been barred in the first place.\n\nIf any believer reads this tonight and recognizes both halves of the paradox in themselves, drowsy in duty yet inwardly restless under the drowsiness, let that restlessness itself become a spur. Do not excuse the sleep because the heart still stirs; rather, let the stirring heart rouse the sleeping soul entirely, throw wide the door, and welcome in the One who has been knocking all along. A little holy zeal will soon unbar what indolence had bolted shut."
    },
    "09-25": {
      "ref": "1 Corinthians 1:30",
      "r": "The human mind, restless as it is, instinctively seeks a resting place for itself somewhere apart from a simple trust in Christ crucified. Give this tendency enough time and enough intellect to work with, and even a person truly converted by grace can be tempted, especially as they grow more learned, to feel that the plain gospel is somehow beneath them, too elementary, too easily grasped by uneducated people, and so they begin to cast around for something more \"intellectual,\" some more refined system that satisfies a cultivated reasoning power. This is precisely the drift that carried many of the early apostolic churches away into heresy after heresy, generation after generation, as clever minds kept trying to improve upon what was already perfect.\n\nLet me say plainly, whoever you are, and however capable your mind: you will search in vain for solid rest anywhere outside of Christ. Reason, philosophy, speculative theology, however dazzling at first, will only ever hand you the alphabet of truth, a few scattered letters, never the whole living word. Meanwhile in Christ Jesus alone is stored up the entire treasury of wisdom and knowledge, every syllable that the deepest thinker could ever need, freely available to the humblest believer who simply receives him by faith.\n\nSo let the learned come back, as they must eventually come back if they are ever to find rest, to that same plain, unadorned truth which delights the heart of the poorest plowboy: that Christ Jesus came into the world to save sinners. There is nothing shameful in this simplicity; it is, in fact, the highest wisdom, because it alone answers the deepest need of every soul, educated or not. The gospel is not a rough stepping-stone that clever people graduate beyond; it is the mountain peak itself, and those who imagine they have outgrown it have only wandered down into the valley of confusion. Christ crucified satisfies the greatest intellect once that intellect humbles itself to receive him by simple faith, but apart from him, no mind, however brilliant, will ever find true and lasting rest. Rest here tonight, then, not in the cleverness of your own thoughts, but in him who is himself made unto us wisdom, and righteousness, and sanctification, and redemption."
    },
    "09-26": {
      "ref": "Zechariah 11:2",
      "r": "When a great oak crashes down in the forest, every tree standing nearby seems to shudder at the sound, for they know the woodman with his axe is near, and none of them can be sure they are not next. In just the same way, we are all trees marked out, sooner or later, for the axe of death, and every funeral we attend, every report of another's passing, ought to send a tremor through our own hearts, a quiet reminder that our own hour, too, draws steadily nearer.\n\nAnd yet how easily we grow callous to this! We hear of death so often that the sound of the axe no longer startles us, much like birds that build their nests undisturbed in a church steeple, growing so accustomed to the tolling of the great bell above them that they no longer even notice its solemn peal. But death is, of all events, the weightiest that can befall a human being, for our whole eternal destiny hangs upon so slender and fragile a thread as the thread of life itself. To go on, day after day, utterly unprepared to meet it, is not caution, nor is it wisdom. It is simply madness dressed up as ordinary living.\n\nLet this then be your resolve tonight, servant of Christ. Be ready, whenever the summons comes, and until it comes, be faithful in whatever work the Lord has placed into your hands, so that you need not scramble in your final hours to make up for a lifetime of neglect. If you are a parent, bring up your children carefully in the fear of God, for you may not always be beside them to do it. If your days are filled with business and trade, keep your accounts and your affairs always in such order that death, should it come suddenly, would find nothing in confusion behind you. Live, in short, as one who fully expects to hear, sooner rather than later, that gracious and longed-for word from the lips of your Master: \"Well done, good and faithful servant; enter into the joy of your Lord.\" Let tonight's rest be the rest of one whose house is in order, in readiness for whenever the great summons finally comes."
    },
    "09-27": {
      "ref": "Song of Solomon 5:4",
      "r": "It was not enough for him merely to knock. My heart, sad to say, was far too full of sleep, and far too cold and sluggish, to bestir itself and open at the sound of a knock alone. Something more was needed, and something more was graciously given: he put his own hand in through the opening in the door, an act so tender, so patient, that I can hardly write of it without shame at my own former coldness. Think how long he must have stood there, shut outside his own house, while I lay comfortable and careless upon the bed of sloth within. Think, too, how condescending it was of him not merely to keep knocking and calling, but finally to reach in with his own hand and begin, himself, the very work of opening that should have been mine to do from the first stirring of his voice.\n\nNothing, I am certain, but his own almighty power could ever have roused so wicked and unworthy a heart as mine. The ordinary means of grace had failed; even the plain preaching of the gospel, sound and searching as it was, had not been sufficient on its own to bring me fully awake, until his hand itself was put forth to accomplish what all else had merely urged. Now, at last, I feel his blessed presence near, but my heart breaks within me to think how I ever allowed my affections to wander so far, how I set up rivals, however small, in the very chamber that belonged to him alone. What a strange, sinful heart is this, that could keep so loving a guest waiting so long outside its own gate.\n\nLord, kiss away these tears of mine with the assurance of your continued love, and, having entered at last, do not merely visit but purge and cleanse this heart thoroughly of every hidden thing that grieves you. Bind it to yourself, I pray, with cords that cannot be broken, with bands sevenfold stronger than any of my own wandering affections, so that it never again strays from you to gather dust upon some lesser, lower love. Let tonight's prayer be simply this: keep the door of my heart open to you always, so that you need never again stand outside and knock in vain."
    },
    "09-28": {
      "ref": "1 Kings 18:43",
      "r": "Success in prayer is certain whenever the Lord himself has made a promise, however long it may seem to delay in coming. You may, like Elijah on the top of Carmel, have pleaded and waited, month after month, without the smallest visible sign of an answer, and yet the Lord cannot possibly be deaf to the earnest cries of his own people, especially when the very matter at stake touches directly upon his own glory before a watching, scoffing world. Elijah did not give up after one petition, nor after six. He kept wrestling before God on that mountaintop, sending his servant back again and again to look toward the sea, and each time the report came back the same: nothing, not a cloud, not a sign. Yet each \"nothing\" only sent Elijah back to his knees rather than back to despair, for true faith always sends hope out to look yet again, and disappointment, rightly used, only sharpens and deepens the fervor of the next petition rather than silencing it altogether.\n\nThere is a purpose in these delays, uncomfortable as they are. They send the heart searching deep within itself, turning over old sins, stirring up genuine contrition, and teaching a patience that could be learned no other way. The real danger in a long season of unanswered prayer is not that God has forgotten, but that we, wearied by the waiting, might faint just short of the blessing and let go of the promise at the very moment it was about to be fulfilled.\n\nAt last, after that seventh look, the small cloud appeared, no bigger than a man's hand, and soon the whole sky was black with the rain that ended a three-year drought. Remember, Elijah was, in the Scripture's own careful words, \"a man of like passions as we are.\" If his prayer, offered by so ordinary a man, could prevail so mightily with God, why should not yours? Plead, then, the precious blood of Christ tonight over whatever burden weighs on you, and having pleaded once, plead again, and go on pleading, refusing to let disappointment become the final word on a promise God himself has spoken."
    },
    "09-29": {
      "ref": "Song of Solomon 3:4",
      "r": "Does the Lord Jesus truly receive us, in spite of every sin of our past, and never once cast in our faces all the other refuges we tried first before we finally came running to him? If this is so, and it is so, then surely we owe him nothing less than our whole and unreserved praise. Down, then, with every rival idol that has ever competed for the throne of our hearts, and up with the name of the Lord Jesus, exalted high above them all. Let the cross, which the careless world so casually scorns and mocks, be lifted higher still in our own esteem, precisely because the world despises it.\n\nHow precious Christ truly is, and how strange, how almost unaccountable, that we could ever have thought so little of him for so long, wasting our best affections on lesser, passing things while he stood ready and waiting to be loved above them all. Let each of us, then, make a solemn covenant with our own heart tonight, that we will never again willingly depart from him, wandering off after some new attraction the moment his back seems turned, and let us ask him, in his mercy, to seal and confirm that covenant himself, since we know all too well how quickly our own resolutions crumble without his help.\n\nAs the sparrow, homeless and wandering, finds at last a house for herself, and the swallow a nest where she may lay her young, even at God's own altars, so would I make my nest and my home in him, my only true rest, my only lasting shelter from every storm. Whatever else may shift and change around me, however unstable the ground beneath my feet may prove, let him be the one fixed and unmovable dwelling place to which my soul continually returns. Tonight, before sleep closes my eyes, let this be my quiet resolve: to nest nowhere else, to rest nowhere else, but in the Lord Jesus Christ, my Beloved."
    },
    "09-30": {
      "ref": "Ecclesiastes 9:4",
      "r": "Life, even in its humblest and least impressive form, is a precious thing, and it stands, in every case, above death, however grand or dignified death may seem to appear. This holds true above all in spiritual matters. The very least in the kingdom of God is, in fact, greater than the mightiest and most celebrated person still standing outside that kingdom, because the life given by the Holy Spirit, however small its outward beginnings, is a gift so far beyond anything that human education, however excellent, could ever produce on its own. Consider it this way: a repentant thief dying on his own cross, with barely an hour left to live, outranks in God's sight a Caesar seated on his throne in all his earthly splendor, simply because the one possesses spiritual life and the other, for all his power, does not.\n\nThe same principle holds true in smaller, more everyday matters as well. A living, Spirit-filled gospel sermon, however rough in its delivery, however plain and unpolished its language, is worth infinitely more than the most eloquent, carefully crafted address that carries no true spiritual power within it. And it is exactly the same with our prayers. When they are quickened and stirred by the Holy Spirit, even our stumbling, broken petitions are graciously accepted before the throne of God, not on their own merit, but through the merit of Christ who presents them. Yet our most grand, most carefully composed devotional performances, however impressive they might sound to human ears, are nothing more than lifeless carrion laid out before the living God, if the heart behind them has remained cold and untouched.\n\nBetter anything, then, however weak, however small, however unimpressive by human standards, than spiritual death dressed up in fine and outwardly religious clothing. Lord, whatever else you withhold from me tonight, do not withhold this: quicken me. Breathe your own living Spirit into whatever small, faltering life remains in me, that even my weakest prayer might rise before you as something truly alive, rather than a lifeless form merely going through the motions of devotion."
    },
    "10-01": {
      "ref": "Psalm 84:11",
      "r": "God is bountiful by his very nature, and giving is not a burden to him but his own settled delight, for it is written that no good thing will he withhold from those who walk uprightly. He gives grace freely and without measure: to his elect because it is his sovereign will to do so, to the redeemed because it is secured to them by covenant promise, to the effectually called because it stands wrapped up in the very promise of their calling, to believers because they earnestly seek it, and to sinners generally because they stand in such desperate need of it. Whatever befalls us in this life, whether sickness that lays us low, poverty that strips away our comforts, or death itself drawing near at last, grace will meet each of these in its own appointed season, sufficient for every trial as it comes.\n\nAnd then notice that small but mighty word joining the two halves of this promise together: grace \"and\" glory. That single conjunction binds our present, often unglamorous experience of grace to our future, unimaginable inheritance of glory, so tightly that no power in heaven, earth, or hell can ever separate what God himself has joined. Glory, rightly understood, is nothing more nor less than grace in its full and final bloom, grace grown up into its perfect maturity, grace wearing, so to speak, its Sabbath clothing at last. How soon that transition from grace to glory will come for any one of us, no one can say with certainty; it may, for all we know, arrive before this very month has drawn to its close. But of this much we may be entirely confident: whoever truly possesses grace today shall as surely possess glory tomorrow, for God has never yet begun the good work of grace in a soul only to abandon it before its glorious completion."
    },
    "10-02": {
      "ref": "Daniel 10:11",
      "r": "Child of God, do you find yourself hesitating tonight to take up that tender name for your own, \"greatly beloved\"? Consider carefully what has already been done for you before you allow any such hesitation to stand. You were purchased, at no small cost, with the precious and irreplaceable blood of Christ himself, and God the Father freely gave up his own beloved Son on your behalf, holding nothing back. He has borne patiently with your sin across long years that would have exhausted any lesser patience, called you effectually by his sovereign grace when you had neither sought nor deserved it, and made you, by adoption, both his own child and a joint heir with Christ of everlasting glory.\n\nLook back, too, over every path you have walked since that calling, whether smooth or rough, and you will find in each one further evidence of this same beloved status. If he has chastened you at any point along the way, be assured it was never done in anger, but always in the tender correction that a true father reserves for a true son. If he has, at times, made you poor in earthly things, you have nonetheless been made rich in the far more lasting currency of grace. Indeed, the more unworthy and undeserving you feel yourself to be as you consider all this, the clearer and more compelling the evidence becomes that nothing less than sovereign, unearned love could ever have reached down and saved someone like you in the first place.\n\nUse your privilege, then, and use it boldly tonight. Come near to him without hanging back, without the timid hesitation of one who suspects he is not truly welcome, for he who did not withhold his own Son from the cross for your sake will surely, freely, and gladly give you every other thing you need alongside him. Go to your bed tonight, therefore, not in anxious uncertainty about your standing, but in the settled and well-founded peace of one who is, and who has always been, greatly beloved."
    },
    "10-03": {
      "ref": "Hebrews 2:18",
      "r": "It is a common enough thought, one you have perhaps heard repeated many times before, and yet tonight it may taste like the sweetest nectar to a weary and tempted soul: Jesus himself was tempted in all points just as we are, even, in a mysterious sense, tempted toward the very same particular sins that trouble us most. Whatever dark and difficult room you find yourself passing through tonight, however unique your trial may feel to you, he passed through that same room long before you ever entered it. Whatever enemy you find yourself grappling with in the shadows, he faced that identical adversary, foot to foot and force to force, and did not flinch.\n\nSweeter still is this: though he was tempted exactly as we are, he never once yielded, never once sinned, which means it is not, after all, some unavoidable necessity that you yourself must sin simply because you are tempted. There is no shame whatsoever in being tempted; shame enters the picture only at the point of yielding. He fought, and he triumphed completely, and because the glorious Head of the church has already won this particular battle on our behalf, every member joined to that Head shares fully in the victory he secured.\n\nPerhaps, indeed, the very temptation pressing on you tonight has been permitted by a wise and loving Father for the express purpose of driving you closer into the shelter of Christ rather than further away from him. Blessed, truly blessed, is any contrary wind, however fierce, that ends up blowing our small vessel safely into the harbor of his love rather than wrecking us on some rock of our own pride or self-sufficiency. Come, then, to your tempted Savior this evening, just as you are, weary and hard-pressed as you feel yourself to be. He knows intimately what it is to be weak, for he has walked that same road himself, and he stands ready, even now, to help and strengthen every one of his people who comes to him honestly in the hour of trial."
    },
    "10-04": {
      "ref": "1 John 2:1",
      "r": "\"We have an advocate with the Father,\" John writes, and notice carefully that he does not say we cease to need one, nor that this advocacy applies only until the believer sins and then stops applying afterward. No sin that a true believer can possibly commit, however grievous, is able to destroy or even diminish his abiding interest in Christ as his ever-present advocate before the Father's throne. Consider, too, how fitting each part of that name truly is. He is called Jesus, because it is both his settled business and his deepest delight to save those given to him, and he carries that saving work forward even now on our behalf. He is called Christ, the Anointed One, and this title assures us that he comes fully authorized and perfectly qualified to plead our cause, having been appointed to this very office by the Father himself, so that his pleading is never presumptuous but always according to sovereign arrangement. And he is called the righteous, which speaks both to his own spotless character as our advocate and, more wonderfully still, to the actual substance of his plea on our behalf, since he answers every accusation brought against us not by denying that we sinned, but by presenting his own perfect righteousness, freely credited to our account, as sufficient and complete satisfaction.\n\nMy soul, take real comfort in this tonight. You possess a friend in the highest court in the universe who is uniquely and perfectly fitted for the office of advocate, one who cannot fail in his pleading because his case rests entirely on his own finished and unimpeachable righteousness rather than on the shifting, uncertain evidence of your own conduct. Whatever accusation your conscience, or the enemy, or even the law itself might bring against you tonight, leave the entire matter confidently and completely in his capable hands. He has never yet lost a case he has undertaken to plead, and he will not begin to lose now with yours."
    },
    "10-05": {
      "ref": "Mark 16:16",
      "r": "It is said that when the islanders of St Kilda were once asked how a person comes to be saved, no single islander gave a complete answer on his own; instead, each one contributed some small fragment, one mentioning repentance, another a sincere and true heart, another prayer, another diligent obedience to the commandments, until between them all they had cobbled together what seemed to them a perfectly respectable creed of salvation by careful human effort. It is a telling little episode, and it ought to stir in any true minister of the gospel the deepest pity, for it illustrates precisely the instinctive drift of the unrenewed human heart. The carnal mind, left to itself, will always eventually construct some pathway to God in which self has a significant part to play and can grow great in its own estimation, whereas the Lord's own appointed way runs in the exact opposite direction, excluding human boasting altogether.\n\n\"He that believes and is baptized shall be saved.\" Notice how remarkably simple this actually is, so simple, in fact, that it deliberately shuts out every possibility of self-congratulation. If you remain unsaved tonight, ask yourself honestly why that should be so. Is the way somehow doubtful or uncertain, when God himself has staked his own unbreakable word upon it? Or is it, perhaps, that the way seems almost too easy, too free of impressive human effort, and this very simplicity leaves you with no excuse whatsoever for your continued unbelief?\n\nTo believe, properly understood, is simply to trust wholly and rely entirely upon Christ for salvation, resting the full weight of your soul upon him alone. Baptism, for its part, pictures outwardly our death, burial, and resurrection together with him; it does not itself save a single soul, yet it is never to be treated as optional or unnecessary by anyone who truly believes. So then, do you believe? If so, dismiss every remaining fear tonight and rest fully in him. And if you cannot yet say that you believe, remember that there remains, even now, only the one door through which any soul has ever entered into life, and that door still stands open before you."
    },
    "10-06": {
      "ref": "Numbers 12:1",
