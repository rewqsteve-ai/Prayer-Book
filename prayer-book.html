  var EVENING = {
    "09-21": {
      "ref": "Psalm 26:9",
      "r": "Fear made David pray this way, because a voice inside him whispered, \"Maybe, after all, you will be gathered in with the wicked.\" That fear, though tainted with unbelief, mostly comes from a holy anxiety that rises when we remember our past sins. Even a forgiven person may ask, \"What if my sins are remembered at the end, and I'm left off the list of the saved?\" He remembers how little fruit he bears now, so little grace, so little love, so little holiness. Looking ahead, he considers his weakness and the many temptations around him, and fears that he may fall and become the enemy's prey. A sense of sin, of present evil, and of his lingering corruptions drives him to pray, in fear and trembling, \"Do not gather my soul with sinners.\"\n\nNow, if you and I can use David's language in the verses just before this one, and say that we have walked in our integrity, and that we have trusted in the Lord without wavering, then we may also use this prayer, and be confident it will be heard. Never was a prayer more surely answered than this, if we can make it honestly, for God has never yet allowed a righteous soul to be gathered with the wicked. It is one of the last things that could happen, for it runs against the very nature of God, who judges the righteous from the wicked, and even now sets them apart in the world's estimation, though not always in outward circumstance. Wait a little; time is short. Soon the sheep and the goats will be plainly parted, and no power under heaven can force a saint into the goats' company, or drive a sinner into the fold of the sheep. What God has divided in his eternal decree, and again in the new birth, human confusion cannot unite. Like will be gathered to like at last: the tares will be bound in bundles to burn, and the wheat will be gathered into the barn. Dear reader, if you are resting only on the Lord's mercy, and are like his people in your character and walk, then rest assured, you will not be gathered with the ungodly, for by no possibility can that happen. Those who love the Lord Jesus, and rely on him, are so bound up with him, and made members of him, that as soon could you separate the Head of the church from her members as separate one true member from the rest. Where Christ is, there his people will be, world without end, for they were bought with his blood, and he will not lose so much as a single drop of the price he paid. Trust yourself with your all-glorious Surety, and you need have no anxiety about being confounded with those who will be destroyed."
    },
    "09-22": {
      "ref": "Psalm 61:2",
      "r": "Most of us know something of what it means for the heart to be overwhelmed. Whether through discovering the corruption of our own nature, or through a heavy blow of heartbreak that falls on us wave after wave until our soul faints beneath the surge and swell, we know that broken, weary feeling. At such times our one comfort is to look to God. What a mercy that we are still permitted to pray, even when the mind is in its lowest and most desponding state!\n\nThe Psalm before us was written by David when he was banished from active service, shut away from the sanctuary he loved, and yet even from that distance he pointed his soul toward \"the rock that is higher than I.\" Let us learn from him. In our darkest, most overwhelmed hours, God does not ask that we first climb to him with strong faith or fine words. He asks only that our heart, however faint, be led toward him. When you feel that everything within you has given way, that is exactly the moment for this old, well-tested prayer: \"Lead me to the rock that is higher than I.\"\n\nWhy call God a rock? Because he does not change. When storms rage over us, everything around us shifts and shakes, but he remains exactly what he has always been: an immovable refuge to those who run to him. And why \"higher than I\"? Because our troubles are often higher than our own strength, and no rock of our own choosing, no lower shelter of our own building, will keep the hurricane off us. We need a rock high enough that the storm rages far beneath its summit while we are safe upon it.\n\nNotice too that the prayer is not simply \"let me reach the rock,\" but \"lead me\" there. A troubled, overwhelmed mind cannot always find its own way to comfort; it needs guiding, piloting, almost carrying. Only the Lord himself, by his Spirit, can steer a soul safely through such a sea into so fair a harbor. Let this then be your prayer tonight, whatever the particular cause of your trouble: not that your circumstances would instantly change, but that God, by his own unfailing hand, would lead you, weary and dazed as you are, to the shelter of himself, where the storm will still rage but you, held fast upon the Rock, will be quiet at last."
    },
    "09-23": {
      "ref": "Mark 9:23",
      "r": "A father had brought his afflicted son to Jesus, and, having already watched the disciples fail to help the boy, he came with only a trembling hope, saying, \"If you can do anything, have compassion on us, and help us.\" His \"if\" reveals the wound of an unbelief that had been badly bruised by disappointment. Notice what our Lord did with that \"if.\" He did not scold the man for having doubts, nor did he simply tell him to remove the word altogether. Instead, he took the \"if\" out of the wrong place and set it down in the right one: \"If you can believe, all things are possible to him that believes.\" The man's doubt had been aimed at Christ's power, or perhaps his willingness; but the Savior shows him that the real uncertainty, the real variable in the equation, was never on Christ's side. It lies entirely with us and our capacity to believe.\n\nHow often we do exactly what this poor father did. We sense that there is an \"if\" hovering somewhere near our prayer, and, being sinful and self-focused creatures, we naturally place it beside God's power or God's love, as though those could ever be in question. But the truth is precisely the reverse. With the Lord Jesus there is no \"if\" of any kind; his arm is never shortened, his heart never grows cold. The only conditional element, if we may even call it that, lies in the mustard seed of our own trust. All things are possible, not to the strong, not to the wise, not to the well-deserving, but simply to him that believes, because true faith always operates in complete harmony with the divine will, and therefore obtains whatever it truly, believingly asks.\n\nMy soul, examine yourself tonight before you lay your head down to sleep. Where have you quietly moved the \"if\" of your prayer? Have you doubted, in your heart, whether the Lord is able, or whether he really cares to help you in the matter that presses on you now? Bring that \"if\" back to where it belongs. Say instead: \"Lord, I believe; help my unbelief,\" and you shall find that the door which seemed shut to your reasoning opens wide to your faith. All things, remember, all things, are possible to him that believes."
    },
    "09-24": {
      "ref": "Song of Solomon 5:2",
      "r": "Here is a paradox in the experience of a genuine Christian, and like most paradoxes in grace, it holds two truths together that seem, at first glance, to contradict one another. Sleep is not always what it appears to be. There is a mournful kind of sleepiness which can, at times, settle over even the truest child of God: sin has such a stupefying effect that, if it is not honestly resisted, it will reduce even a strong believer to lethargy in prayer, dullness in worship, and slackness in the pursuit of holiness. If this sleep of soul has crept over you, then you above all people ought to be alarmed by it, since around you the world is passing away, eternity is at hand, and precious souls are perishing for lack of any hand outstretched to help them. Even the wise virgins in the Lord's own parable, though they had oil in their lamps, still slumbered along with the foolish ones while the bridegroom delayed. Watchfulness is what our Master calls for; sleep, in this sense, dishonors him.\n\nBut the second half of this paradox is happier: \"my heart is awake.\" This is the mark that life has not been extinguished, only dulled, and that a struggle is going on within against the very heaviness that has come over the believer. There is something wonderfully hopeful in a heart that groans under its own dullness, longs to break free of it, and cannot rest content in a half-sleeping state, even while the outward faculties seem half-shut. That inward wakefulness, however faint, is itself the gift and work of grace, and where it exists, the Bridegroom takes notice of it. Indeed, this waking heart is, in a very real sense, the voice of Christ himself within the soul, calling, \"Open to me.\" His knock upon the door of a sleepy heart is his own gracious, patient work, seeking entrance where entrance ought never to have been barred in the first place.\n\nIf any believer reads this tonight and recognizes both halves of the paradox in themselves, drowsy in duty yet inwardly restless under the drowsiness, let that restlessness itself become a spur. Do not excuse the sleep because the heart still stirs; rather, let the stirring heart rouse the sleeping soul entirely, throw wide the door, and welcome in the One who has been knocking all along. A little holy zeal will soon unbar what indolence had bolted shut."
    },
    "09-25": {
      "ref": "1 Corinthians 1:30",
      "r": "The human mind, restless as it is, instinctively seeks a resting place for itself somewhere apart from a simple trust in Christ crucified. Give this tendency enough time and enough intellect to work with, and even a person truly converted by grace can be tempted, especially as they grow more learned, to feel that the plain gospel is somehow beneath them, too elementary, too easily grasped by uneducated people, and so they begin to cast around for something more \"intellectual,\" some more refined system that satisfies a cultivated reasoning power. This is precisely the drift that carried many of the early apostolic churches away into heresy after heresy, generation after generation, as clever minds kept trying to improve upon what was already perfect.\n\nLet me say plainly, whoever you are, and however capable your mind: you will search in vain for solid rest anywhere outside of Christ. Reason, philosophy, speculative theology, however dazzling at first, will only ever hand you the alphabet of truth, a few scattered letters, never the whole living word. Meanwhile in Christ Jesus alone is stored up the entire treasury of wisdom and knowledge, every syllable that the deepest thinker could ever need, freely available to the humblest believer who simply receives him by faith.\n\nSo let the learned come back, as they must eventually come back if they are ever to find rest, to that same plain, unadorned truth which delights the heart of the poorest plowboy: that Christ Jesus came into the world to save sinners. There is nothing shameful in this simplicity; it is, in fact, the highest wisdom, because it alone answers the deepest need of every soul, educated or not. The gospel is not a rough stepping-stone that clever people graduate beyond; it is the mountain peak itself, and those who imagine they have outgrown it have only wandered down into the valley of confusion. Christ crucified satisfies the greatest intellect once that intellect humbles itself to receive him by simple faith, but apart from him, no mind, however brilliant, will ever find true and lasting rest. Rest here tonight, then, not in the cleverness of your own thoughts, but in him who is himself made unto us wisdom, and righteousness, and sanctification, and redemption."
    },
    "09-26": {
      "ref": "Zechariah 11:2",
      "r": "When a great oak crashes down in the forest, every tree standing nearby seems to shudder at the sound, for they know the woodman with his axe is near, and none of them can be sure they are not next. In just the same way, we are all trees marked out, sooner or later, for the axe of death, and every funeral we attend, every report of another's passing, ought to send a tremor through our own hearts, a quiet reminder that our own hour, too, draws steadily nearer.\n\nAnd yet how easily we grow callous to this! We hear of death so often that the sound of the axe no longer startles us, much like birds that build their nests undisturbed in a church steeple, growing so accustomed to the tolling of the great bell above them that they no longer even notice its solemn peal. But death is, of all events, the weightiest that can befall a human being, for our whole eternal destiny hangs upon so slender and fragile a thread as the thread of life itself. To go on, day after day, utterly unprepared to meet it, is not caution, nor is it wisdom. It is simply madness dressed up as ordinary living.\n\nLet this then be your resolve tonight, servant of Christ. Be ready, whenever the summons comes, and until it comes, be faithful in whatever work the Lord has placed into your hands, so that you need not scramble in your final hours to make up for a lifetime of neglect. If you are a parent, bring up your children carefully in the fear of God, for you may not always be beside them to do it. If your days are filled with business and trade, keep your accounts and your affairs always in such order that death, should it come suddenly, would find nothing in confusion behind you. Live, in short, as one who fully expects to hear, sooner rather than later, that gracious and longed-for word from the lips of your Master: \"Well done, good and faithful servant; enter into the joy of your Lord.\" Let tonight's rest be the rest of one whose house is in order, in readiness for whenever the great summons finally comes."
    },
    "09-27": {
      "ref": "Song of Solomon 5:4",
      "r": "It was not enough for him merely to knock. My heart, sad to say, was far too full of sleep, and far too cold and sluggish, to bestir itself and open at the sound of a knock alone. Something more was needed, and something more was graciously given: he put his own hand in through the opening in the door, an act so tender, so patient, that I can hardly write of it without shame at my own former coldness. Think how long he must have stood there, shut outside his own house, while I lay comfortable and careless upon the bed of sloth within. Think, too, how condescending it was of him not merely to keep knocking and calling, but finally to reach in with his own hand and begin, himself, the very work of opening that should have been mine to do from the first stirring of his voice.\n\nNothing, I am certain, but his own almighty power could ever have roused so wicked and unworthy a heart as mine. The ordinary means of grace had failed; even the plain preaching of the gospel, sound and searching as it was, had not been sufficient on its own to bring me fully awake, until his hand itself was put forth to accomplish what all else had merely urged. Now, at last, I feel his blessed presence near, but my heart breaks within me to think how I ever allowed my affections to wander so far, how I set up rivals, however small, in the very chamber that belonged to him alone. What a strange, sinful heart is this, that could keep so loving a guest waiting so long outside its own gate.\n\nLord, kiss away these tears of mine with the assurance of your continued love, and, having entered at last, do not merely visit but purge and cleanse this heart thoroughly of every hidden thing that grieves you. Bind it to yourself, I pray, with cords that cannot be broken, with bands sevenfold stronger than any of my own wandering affections, so that it never again strays from you to gather dust upon some lesser, lower love. Let tonight's prayer be simply this: keep the door of my heart open to you always, so that you need never again stand outside and knock in vain."
    },
    "09-28": {
      "ref": "1 Kings 18:43",
      "r": "Success in prayer is certain whenever the Lord himself has made a promise, however long it may seem to delay in coming. You may, like Elijah on the top of Carmel, have pleaded and waited, month after month, without the smallest visible sign of an answer, and yet the Lord cannot possibly be deaf to the earnest cries of his own people, especially when the very matter at stake touches directly upon his own glory before a watching, scoffing world. Elijah did not give up after one petition, nor after six. He kept wrestling before God on that mountaintop, sending his servant back again and again to look toward the sea, and each time the report came back the same: nothing, not a cloud, not a sign. Yet each \"nothing\" only sent Elijah back to his knees rather than back to despair, for true faith always sends hope out to look yet again, and disappointment, rightly used, only sharpens and deepens the fervor of the next petition rather than silencing it altogether.\n\nThere is a purpose in these delays, uncomfortable as they are. They send the heart searching deep within itself, turning over old sins, stirring up genuine contrition, and teaching a patience that could be learned no other way. The real danger in a long season of unanswered prayer is not that God has forgotten, but that we, wearied by the waiting, might faint just short of the blessing and let go of the promise at the very moment it was about to be fulfilled.\n\nAt last, after that seventh look, the small cloud appeared, no bigger than a man's hand, and soon the whole sky was black with the rain that ended a three-year drought. Remember, Elijah was, in the Scripture's own careful words, \"a man of like passions as we are.\" If his prayer, offered by so ordinary a man, could prevail so mightily with God, why should not yours? Plead, then, the precious blood of Christ tonight over whatever burden weighs on you, and having pleaded once, plead again, and go on pleading, refusing to let disappointment become the final word on a promise God himself has spoken."
    },
    "09-29": {
      "ref": "Song of Solomon 3:4",
      "r": "Does the Lord Jesus truly receive us, in spite of every sin of our past, and never once cast in our faces all the other refuges we tried first before we finally came running to him? If this is so, and it is so, then surely we owe him nothing less than our whole and unreserved praise. Down, then, with every rival idol that has ever competed for the throne of our hearts, and up with the name of the Lord Jesus, exalted high above them all. Let the cross, which the careless world so casually scorns and mocks, be lifted higher still in our own esteem, precisely because the world despises it.\n\nHow precious Christ truly is, and how strange, how almost unaccountable, that we could ever have thought so little of him for so long, wasting our best affections on lesser, passing things while he stood ready and waiting to be loved above them all. Let each of us, then, make a solemn covenant with our own heart tonight, that we will never again willingly depart from him, wandering off after some new attraction the moment his back seems turned, and let us ask him, in his mercy, to seal and confirm that covenant himself, since we know all too well how quickly our own resolutions crumble without his help.\n\nAs the sparrow, homeless and wandering, finds at last a house for herself, and the swallow a nest where she may lay her young, even at God's own altars, so would I make my nest and my home in him, my only true rest, my only lasting shelter from every storm. Whatever else may shift and change around me, however unstable the ground beneath my feet may prove, let him be the one fixed and unmovable dwelling place to which my soul continually returns. Tonight, before sleep closes my eyes, let this be my quiet resolve: to nest nowhere else, to rest nowhere else, but in the Lord Jesus Christ, my Beloved."
    },
    "09-30": {
      "ref": "Ecclesiastes 9:4",
      "r": "Life, even in its humblest and least impressive form, is a precious thing, and it stands, in every case, above death, however grand or dignified death may seem to appear. This holds true above all in spiritual matters. The very least in the kingdom of God is, in fact, greater than the mightiest and most celebrated person still standing outside that kingdom, because the life given by the Holy Spirit, however small its outward beginnings, is a gift so far beyond anything that human education, however excellent, could ever produce on its own. Consider it this way: a repentant thief dying on his own cross, with barely an hour left to live, outranks in God's sight a Caesar seated on his throne in all his earthly splendor, simply because the one possesses spiritual life and the other, for all his power, does not.\n\nThe same principle holds true in smaller, more everyday matters as well. A living, Spirit-filled gospel sermon, however rough in its delivery, however plain and unpolished its language, is worth infinitely more than the most eloquent, carefully crafted address that carries no true spiritual power within it. And it is exactly the same with our prayers. When they are quickened and stirred by the Holy Spirit, even our stumbling, broken petitions are graciously accepted before the throne of God, not on their own merit, but through the merit of Christ who presents them. Yet our most grand, most carefully composed devotional performances, however impressive they might sound to human ears, are nothing more than lifeless carrion laid out before the living God, if the heart behind them has remained cold and untouched.\n\nBetter anything, then, however weak, however small, however unimpressive by human standards, than spiritual death dressed up in fine and outwardly religious clothing. Lord, whatever else you withhold from me tonight, do not withhold this: quicken me. Breathe your own living Spirit into whatever small, faltering life remains in me, that even my weakest prayer might rise before you as something truly alive, rather than a lifeless form merely going through the motions of devotion."
    },
    "10-01": {
      "ref": "Psalm 84:11",
      "r": "God is bountiful by his very nature, and giving is not a burden to him but his own settled delight, for it is written that no good thing will he withhold from those who walk uprightly. He gives grace freely and without measure: to his elect because it is his sovereign will to do so, to the redeemed because it is secured to them by covenant promise, to the effectually called because it stands wrapped up in the very promise of their calling, to believers because they earnestly seek it, and to sinners generally because they stand in such desperate need of it. Whatever befalls us in this life, whether sickness that lays us low, poverty that strips away our comforts, or death itself drawing near at last, grace will meet each of these in its own appointed season, sufficient for every trial as it comes.\n\nAnd then notice that small but mighty word joining the two halves of this promise together: grace \"and\" glory. That single conjunction binds our present, often unglamorous experience of grace to our future, unimaginable inheritance of glory, so tightly that no power in heaven, earth, or hell can ever separate what God himself has joined. Glory, rightly understood, is nothing more nor less than grace in its full and final bloom, grace grown up into its perfect maturity, grace wearing, so to speak, its Sabbath clothing at last. How soon that transition from grace to glory will come for any one of us, no one can say with certainty; it may, for all we know, arrive before this very month has drawn to its close. But of this much we may be entirely confident: whoever truly possesses grace today shall as surely possess glory tomorrow, for God has never yet begun the good work of grace in a soul only to abandon it before its glorious completion."
    },
    "10-02": {
      "ref": "Daniel 10:11",
      "r": "Child of God, do you find yourself hesitating tonight to take up that tender name for your own, \"greatly beloved\"? Consider carefully what has already been done for you before you allow any such hesitation to stand. You were purchased, at no small cost, with the precious and irreplaceable blood of Christ himself, and God the Father freely gave up his own beloved Son on your behalf, holding nothing back. He has borne patiently with your sin across long years that would have exhausted any lesser patience, called you effectually by his sovereign grace when you had neither sought nor deserved it, and made you, by adoption, both his own child and a joint heir with Christ of everlasting glory.\n\nLook back, too, over every path you have walked since that calling, whether smooth or rough, and you will find in each one further evidence of this same beloved status. If he has chastened you at any point along the way, be assured it was never done in anger, but always in the tender correction that a true father reserves for a true son. If he has, at times, made you poor in earthly things, you have nonetheless been made rich in the far more lasting currency of grace. Indeed, the more unworthy and undeserving you feel yourself to be as you consider all this, the clearer and more compelling the evidence becomes that nothing less than sovereign, unearned love could ever have reached down and saved someone like you in the first place.\n\nUse your privilege, then, and use it boldly tonight. Come near to him without hanging back, without the timid hesitation of one who suspects he is not truly welcome, for he who did not withhold his own Son from the cross for your sake will surely, freely, and gladly give you every other thing you need alongside him. Go to your bed tonight, therefore, not in anxious uncertainty about your standing, but in the settled and well-founded peace of one who is, and who has always been, greatly beloved."
    },
    "10-03": {
      "ref": "Hebrews 2:18",
      "r": "It is a common enough thought, one you have perhaps heard repeated many times before, and yet tonight it may taste like the sweetest nectar to a weary and tempted soul: Jesus himself was tempted in all points just as we are, even, in a mysterious sense, tempted toward the very same particular sins that trouble us most. Whatever dark and difficult room you find yourself passing through tonight, however unique your trial may feel to you, he passed through that same room long before you ever entered it. Whatever enemy you find yourself grappling with in the shadows, he faced that identical adversary, foot to foot and force to force, and did not flinch.\n\nSweeter still is this: though he was tempted exactly as we are, he never once yielded, never once sinned, which means it is not, after all, some unavoidable necessity that you yourself must sin simply because you are tempted. There is no shame whatsoever in being tempted; shame enters the picture only at the point of yielding. He fought, and he triumphed completely, and because the glorious Head of the church has already won this particular battle on our behalf, every member joined to that Head shares fully in the victory he secured.\n\nPerhaps, indeed, the very temptation pressing on you tonight has been permitted by a wise and loving Father for the express purpose of driving you closer into the shelter of Christ rather than further away from him. Blessed, truly blessed, is any contrary wind, however fierce, that ends up blowing our small vessel safely into the harbor of his love rather than wrecking us on some rock of our own pride or self-sufficiency. Come, then, to your tempted Savior this evening, just as you are, weary and hard-pressed as you feel yourself to be. He knows intimately what it is to be weak, for he has walked that same road himself, and he stands ready, even now, to help and strengthen every one of his people who comes to him honestly in the hour of trial."
    },
    "10-04": {
      "ref": "1 John 2:1",
      "r": "\"We have an advocate with the Father,\" John writes, and notice carefully that he does not say we cease to need one, nor that this advocacy applies only until the believer sins and then stops applying afterward. No sin that a true believer can possibly commit, however grievous, is able to destroy or even diminish his abiding interest in Christ as his ever-present advocate before the Father's throne. Consider, too, how fitting each part of that name truly is. He is called Jesus, because it is both his settled business and his deepest delight to save those given to him, and he carries that saving work forward even now on our behalf. He is called Christ, the Anointed One, and this title assures us that he comes fully authorized and perfectly qualified to plead our cause, having been appointed to this very office by the Father himself, so that his pleading is never presumptuous but always according to sovereign arrangement. And he is called the righteous, which speaks both to his own spotless character as our advocate and, more wonderfully still, to the actual substance of his plea on our behalf, since he answers every accusation brought against us not by denying that we sinned, but by presenting his own perfect righteousness, freely credited to our account, as sufficient and complete satisfaction.\n\nMy soul, take real comfort in this tonight. You possess a friend in the highest court in the universe who is uniquely and perfectly fitted for the office of advocate, one who cannot fail in his pleading because his case rests entirely on his own finished and unimpeachable righteousness rather than on the shifting, uncertain evidence of your own conduct. Whatever accusation your conscience, or the enemy, or even the law itself might bring against you tonight, leave the entire matter confidently and completely in his capable hands. He has never yet lost a case he has undertaken to plead, and he will not begin to lose now with yours."
    },
    "10-05": {
      "ref": "Mark 16:16",
      "r": "It is said that when the islanders of St Kilda were once asked how a person comes to be saved, no single islander gave a complete answer on his own; instead, each one contributed some small fragment, one mentioning repentance, another a sincere and true heart, another prayer, another diligent obedience to the commandments, until between them all they had cobbled together what seemed to them a perfectly respectable creed of salvation by careful human effort. It is a telling little episode, and it ought to stir in any true minister of the gospel the deepest pity, for it illustrates precisely the instinctive drift of the unrenewed human heart. The carnal mind, left to itself, will always eventually construct some pathway to God in which self has a significant part to play and can grow great in its own estimation, whereas the Lord's own appointed way runs in the exact opposite direction, excluding human boasting altogether.\n\n\"He that believes and is baptized shall be saved.\" Notice how remarkably simple this actually is, so simple, in fact, that it deliberately shuts out every possibility of self-congratulation. If you remain unsaved tonight, ask yourself honestly why that should be so. Is the way somehow doubtful or uncertain, when God himself has staked his own unbreakable word upon it? Or is it, perhaps, that the way seems almost too easy, too free of impressive human effort, and this very simplicity leaves you with no excuse whatsoever for your continued unbelief?\n\nTo believe, properly understood, is simply to trust wholly and rely entirely upon Christ for salvation, resting the full weight of your soul upon him alone. Baptism, for its part, pictures outwardly our death, burial, and resurrection together with him; it does not itself save a single soul, yet it is never to be treated as optional or unnecessary by anyone who truly believes. So then, do you believe? If so, dismiss every remaining fear tonight and rest fully in him. And if you cannot yet say that you believe, remember that there remains, even now, only the one door through which any soul has ever entered into life, and that door still stands open before you."
    },
    "10-06": {
      "ref": "Numbers 12:1",
      "r": "It was, on the surface, a strange and unlikely choice for Moses to have made, taking an Ethiopian woman as his wife. And yet stranger still, far stranger, is the choice made by that far greater Prophet, fair and lovely as the lily of the valleys, who has taken to himself a bride that openly confesses her own spiritual darkness rather than concealing it. It genuinely astonishes the watching angels that the love of Jesus should settle so firmly and so permanently upon poor, guilty, undeserving sinners such as ourselves, and every believer, upon careful reflection, ought to find themselves equally astonished by this same wonder rather than growing casually accustomed to it over time. He found the entire cause and reason for loving us buried deep within his own gracious heart, never in any attractiveness or merit discovered within us, for truthfully there was none to be found there.\n\nEven since the very day of our conversion, we have remained dark in ourselves, though the transforming grace of the Spirit has, thankfully, made us comely and presentable in Christ's own sight. There is a well-known saying attributed to the old Scottish minister Samuel Rutherford, in which he confessed that Christ is exactly the kind of Physician his particular sickness requires, and openly admitted how often he himself plays fast and loose with the Savior's patient love, drifting away and returning, while Christ nonetheless continues faithfully agreeing and reconciling with him, by Rutherford's own reckoning, some twenty times over in a single day. Tender Husband that he is, may he continue his patient work of conforming us more fully to his own image, day after day, until the transformation is finally complete.\n\nMoses, we remember, faced real opposition on account of his unusual marriage, and in exactly the same way, both Jesus and his own chosen bride still face opposition today, particularly whenever some especially great or notorious sinner is genuinely converted to the faith. The old accusation still gets whispered in one form or another: \"This man receives sinners.\" Let it be whispered, then, for it remains, even now, the very best and truest thing that could ever be said of him."
    },
    "10-07": {
      "ref": "Isaiah 36:5",
      "r": "\"On whom do you trust?\" is a searching and important question for any soul to answer honestly, and it deserves a clear response rather than a vague or evasive one. The genuine Christian can answer without hesitation: I trust in the one true and living God, who exists eternally as Father, Son, and Holy Spirit. I trust in the Father, who chose me according to his own sovereign purpose before the foundation of the world, who provides faithfully for all my ongoing needs, who teaches me through both his word and his providence, who corrects me lovingly when I stray, and who has promised, without fail, to bring me safely home to himself at the last.\n\nI trust equally in the Son, both fully God and fully man, who took away my sins entirely through the once-for-all sacrifice of himself, who clothes me even now in his own perfect and spotless righteousness, and who continues to serve, at this very moment, as my faithful Intercessor and Advocate before the Father's throne, right up until the final day of judgment arrives.\n\nAnd I trust no less in the Holy Spirit, who has already begun the ongoing work of saving me from the power and practice of sin, who labors patiently to drive that sin further out of my heart and life with each passing year, who curbs my unruly temper when it threatens to master me, who comforts me faithfully in every season of sorrow, who enlightens my understanding of divine truth, and who will, in his own perfect timing, take me at last to dwell forever among the saints in that unfading light.\n\nThe power of this triune God is never once exhausted by the many demands placed upon it, his love never diminishes or wanes with the passing of time, and his infinite wisdom is never once baffled or outmaneuvered by any scheme the enemy might devise against his people. Happy indeed, unspeakably happy, is the soul who can say, without hesitation or reservation, that this triune God is truly the object of their trust tonight, for such a soul may look forward with confidence to peace even now, and to unclouded glory hereafter."
    },
    "10-08": {
      "ref": "Jude 1:20",
      "r": "The unmistakable mark of genuinely true prayer, the kind of prayer that actually rises and is heard, is that it is offered \"in the Holy Spirit.\" Such prayer, first of all, must originate from heaven's own storehouse rather than from mere human sentiment or eloquence, for only that prayer which genuinely comes down from God in the first place is able to ascend back up to God again; in a very real sense, we are simply shooting the Lord's own arrows back toward himself. Second, this Spirit-wrought prayer is fervent and earnest in its character, for lukewarm, half-hearted prayer would be every bit as strange and unnatural a thing as lukewarm fire, a contradiction in terms.\n\nThird, true prayer is persevering rather than easily discouraged, and it actually grows stronger and more determined precisely when God appears, for whatever wise reason, to delay his answer rather than grant it immediately. Fourth, it is marked throughout by genuine humility, since the Holy Spirit's characteristic work in the human heart is to produce contrition and lowliness, and so we must learn to cry honestly out of the depths of our own unworthiness before we can ever hope to sing gladly of glory in the highest with any real sincerity. Fifth, true prayer is saturated with love, carrying about it the unmistakable fragrance of genuine affection both for fellow believers and for Christ himself, since prayer offered without love quickly degenerates into empty and mechanical formality. And finally, such prayer is thoroughly full of faith, a faith which, we should remember, the Spirit himself graciously strengthens and sustains within us, since we could never manufacture sufficient faith on our own strength alone.\n\nBlessed Comforter, look upon our great and persistent weakness in the whole matter of prayer tonight, and continue your gracious work of helping us, for we know all too well how quickly our own prayers would degenerate into cold formality, wandering thoughts, or faithless repetition, were it not for your constant and patient assistance strengthening us in this, as in every other, spiritual exercise."
    },
    "10-09": {
      "ref": "Matthew 15:23",
      "r": "There is real comfort here for anyone still seeking the Lord tonight who has not yet received the particular blessing they long for. Consider carefully what happened to this Canaanite woman. Christ did not answer her a single word at first, and this despite the fact that her prayer was thoroughly good, her need genuinely great, her earnestness intense and unmistakable, and her faith ultimately so remarkable that Jesus himself openly marveled at it before the watching crowd. We must learn from this encounter that faith, once granted, will always eventually bring peace with it, but that peace does not necessarily arrive at once, immediately upon the first exercise of that faith, and there may well be wise reasons, hidden from our present understanding, why our own faith must first pass through a season of testing before its full reward is finally granted.\n\nSome souls, like the Philippian jailer, are turned in a single dramatic moment from darkness into marvelous light, almost before they have time to fully grasp what has happened to them. Others, however, are more like plants of slower and more gradual growth, requiring patient cultivation over a much longer season before they come to full and settled assurance. It may well be, in fact, that instead of receiving an immediate, comforting sense of pardon, you will instead be given a deeper and more searching sense of your own sinfulness first, and if this proves to be your particular path, you will need considerable patience to walk it faithfully to its end.\n\nEven if, for a season, Christ seems almost to beat and bruise your spirit through delay and apparent silence, trust him still, and learn to believe firmly in his underlying heart of unwavering love even while his providence speaks, for the moment, in what feels like an angry or discouraging voice. Do not, whatever you do, give up seeking my Master tonight simply because his answer has not yet come. He who tested the Canaanite woman so thoroughly, only to reward her so abundantly in the end, deals with every one of his seeking children according to that same wise and ultimately loving pattern."
    },
    "10-10": {
      "ref": "Jeremiah 15:21",
      "r": "Notice carefully the wonderfully personal nature of this promise: \"I will, I will.\" The Lord himself steps forward and takes direct, personal responsibility for delivering and redeeming his people, and observe that nothing whatsoever is said, in this particular promise, about our own effort, our own strength or weakness, or about any human helpers and secondary means we might otherwise be tempted to lean upon. Why, then, do we spend so much of our energy anxiously tallying up our own resources and connections, as though the outcome ultimately depended on the sum we could gather together? Vain indeed are all our anxious glances toward friends and relatives for deliverance; they will prove, every one of them, to be nothing more than broken reeds the moment we actually attempt to lean our full weight upon them.\n\nWhen a promise comes directly and solely from God himself, without any human condition attached, our proper response is simply to wait on him alone for its fulfillment, and our patient expectation, resting on such a foundation, will never ultimately be disappointed. And who, after all, are these wicked ones we so often fear, that we should tremble before them as we do? Rightly considered, they are far more objects of pity than of fear, blind as they are to their own coming destruction even while they imagine themselves triumphant.\n\nIf we hold fast our own integrity through whatever trial presses upon us, the rage and fury of tyrants and oppressors will ultimately be overruled by God's own hand for our lasting good, whether we can presently see how that will happen or not. Just as the great fish found the fleeing prophet Jonah an uncomfortable, indigestible morsel it could not properly digest, so too the hostile world often finds that it cannot ultimately digest or destroy the very church it so eagerly seeks to devour. Whatever fiery trial you find yourself passing through tonight, remember the Master's own counsel: in your patience, possess your soul, and leave the timing and manner of your deliverance entirely in his capable and trustworthy hands."
    },
    "10-11": {
      "ref": "Romans 8:30",
      "r": "Test your own calling carefully tonight, examining it against three particular marks. First, is it a holy calling? True calling always leads a soul away from any remaining trust in its own works, and purges it steadily from dead, lifeless religious activity toward the genuine, ongoing service of the living God. If you continue to live comfortably in sin without any real conflict against it, you have good reason to suspect that you have not, in fact, been effectually called at all. Second, is it a high calling? Has it genuinely lifted your hopes, your tastes, your desires, and indeed the whole direction and purpose of how you spend your life, upward toward God and heavenly things, rather than leaving you contentedly fixed on merely earthly pursuits as before?\n\nThird, is it a heavenly calling? Is it, in other words, a call that originates from heaven itself and that is drawing you steadily toward heaven as its ultimate destination? If the summons you have received came from nowhere higher than mere human tradition or personal sentiment, then, however sincere your religious feelings may be, you remain, in the truest sense, still uncalled. Those who have genuinely received this heavenly calling become, almost immediately, strangers and pilgrims here on the earth, no longer fully at home in this present world, but actively looking forward to that better city whose builder and maker is God himself.\n\nIf, upon honest self-examination tonight, you find your own calling to be holy in its effect, high in its aim, and heavenly in its origin and destination, then you may rest with real confidence and settled peace in the wonderful assurance that you have indeed, in the fullest and truest sense, been called of God, and no power in heaven, earth, or hell shall ever be able to reverse or undo what God himself has sovereignly begun and will surely, faithfully complete."
    },
    "10-12": {
      "ref": "John 14:26",
      "r": "This present age in which we now live is, in a very particular sense, the age of the Holy Spirit's own gracious work among us. He cheers and sustains believers today not through Christ's bodily, visible presence among us, as the first disciples once enjoyed, but rather through his own abiding, indwelling presence within us, serving faithfully as the church's appointed Comforter throughout this entire present age. He convinces sinners of their sin, he instructs believers patiently in the deeper things of God, but his chief and most delightful work, above all else, is to make glad the hearts of God's renewed people by continually revealing more of Jesus to them.\n\nThink of it this way: the Spirit himself functions, in a sense, as the skilled Physician, while Jesus himself remains the actual medicine that Physician so faithfully applies and administers. The Spirit serves as the Comforter, while Jesus himself remains the substance and content of that comfort he brings. Given such rich and continual provision made on our behalf, why then should any believer remain despondent for long? The Holy Spirit has solemnly engaged himself, as part of his own settled office and calling, to comfort God's people, and he will most certainly never forget or neglect the very business he has undertaken.\n\nDo not, then, think so hardly or so suspiciously of this tender, patient Spirit as your own discouraged thoughts sometimes tempt you to do. He delights, far more than we often realize, to give freely the oil of joy in exchange for mourning, and he will continue this gracious exchange faithfully, right up until that final day when the house of mourning is closed forever and the great marriage feast of the Lamb finally begins in full and unclouded splendor. Rest in his care tonight, and let him do the comforting work he has so freely promised to perform."
    },
    "10-13": {
      "ref": "Song of Solomon 8:6",
      "r": "Whose love could possibly be described as strong as death itself? Certainly not my own feeble, inconsistent love, which struggles even to endure a passing scoffing remark without wavering, let alone anything approaching real suffering. No, this description belongs solely to the love of Jesus, a love proven stronger than the most terrible and prolonged death imaginable. His death was lingering rather than quick, shameful rather than honorable in the world's eyes, fully penal in its nature as he bore the actual punishment due to sin, and marked, at its darkest point, by a real and terrible sense of being forsaken even by his own Father. And yet through every stage of that unimaginable ordeal, his love not only survived but triumphed: it endured the prolonged torment without wavering, it despised the accompanying shame without flinching, it bore the full weight of our iniquities without giving way, and it endured to the end the curse that our sins had justly deserved.\n\nDo I feel nothing at all, then, in the presence of such astonishing love as this? Lord, I confess tonight that I long to feel your love burning within my own heart like a consuming furnace, and I find myself wishing I possessed a thousand lives simply so that I might have a thousand opportunities to lay each one down freely for your sake in return. Why, after all, should I continue to despair of ever loving you with anything approaching that same strength and intensity? You alone deserve such love, and I genuinely desire to give it, however far short my present affections still fall.\n\nThe martyrs of old, remember, were flesh and blood exactly as I am, no stronger by nature, no more naturally courageous, and yet by grace alone they came to feel and demonstrate precisely this kind of love, even to the point of a martyr's death. That very same grace remains fully available and fully sufficient for me tonight as it was for them. Shed abroad, I pray, that same burning, sacrificial love in my own heart this very evening, that I too might learn, by grace, to love you as strongly as you have first loved me."
    },
    "10-14": {
      "ref": "Romans 12:2",
      "r": "If it is even possible for a genuine Christian to be saved while still deliberately conforming to the patterns and priorities of this present world, then such a salvation, Scripture itself suggests, would only occur as one passing through fire, a salvation almost as much to be feared and dreaded in the manner of its accomplishment as it might otherwise be desired in its final outcome. Surely you would not want that. Would you not rather want something of heaven's comfort and joy here below, even now, in addition to heaven's glory hereafter, to genuinely know and experience the deep love of Christ in your present daily walk, and to enter through an abundant and generous entrance into your Lord's promised joy rather than merely scraping by at the very last moment? If so, then the necessary path forward is clear: come out from among worldly influences, and be genuinely separate from them.\n\nYou simply cannot expect to gain full, settled assurance of your salvation while you continue keeping close company with those whose priorities and pleasures run entirely contrary to Christ's own. Nor can your heart realistically burn with warm, fervent love for him while it remains constantly drenched and dampened by the cold spray of a godless social environment pressing in around you on every side. Nor, indeed, can you ever hope to become a full-grown, mature Christian while you continue yielding, even in small everyday matters, to the world's competing maxims and priorities rather than to Christ's own clear teaching.\n\nEven seemingly small inconsistencies do real and lasting harm over time, however minor they might initially appear. Little thorns, left unattended, can raise surprisingly great and painful blisters upon the skin, and little moths, however insignificant they seem individually, can together ruin even the finest and most costly garment given enough time and neglect. For the sake of both your own comfort and your ongoing spiritual growth, then, if you are truly a Christian at all, resolve tonight to be a marked, distinct, and unmistakably different Christian, clearly separated from the world's competing patterns and priorities rather than quietly blending into them."
    },
    "10-15": {
      "ref": "Exodus 34:20",
      "r": "Under the old law, every firstborn creature technically belonged to the Lord by right, yet the unclean donkey specifically could never be offered up as an acceptable sacrifice, and God, in giving this particular law, made no exceptions whatsoever to that general rule. The only way of escape provided for the donkey, then, was through redemption: either a lamb had to be substituted and offered in its place, or else the donkey itself, unredeemed, had to be put to death. My own soul, consider carefully tonight: that unclean, unacceptable donkey is precisely what you yourself once were. You belonged rightfully to the Lord who had made you in the first place, and yet you were, in yourself, far too sinful and unclean for him to accept directly, so that the Lamb of God himself was required to stand in your exact place, bearing what you deserved, or else you yourself must have died in your sins without remedy or hope.\n\nIs there truly any meaningful comparison to be drawn between the eternal value of a single human soul and the infinite, incalculable worth of the Lord Jesus Christ's own precious life? And yet, astonishingly, it was the spotless Lamb himself who actually died, while the unclean donkey, redeemed at such cost, was mercifully spared altogether. Even the meanest, most insignificant of worms, spiritually speaking, has been purchased and redeemed at nothing less than the blood of the Son of the Most High God.\n\nHow utterly inestimable, then, how beyond all human calculation of worth, is this same Lamb who has so graciously redeemed us from a doom we could never otherwise have escaped on our own. Let this thought carry you gently into sleep tonight: not the thought of your own former uncleanness, real as it was, but the far greater and more wonderful thought of the costly, willing substitution that has forever secured your deliverance from it."
    },
    "10-16": {
      "ref": "Psalm 36:9",
      "r": "There are certain seasons in the Christian life when human counsel, however well-intentioned, human sympathy, however genuine, and even the ordinary means of grace we normally rely upon, all seem to fail utterly in bringing us any real comfort. Why does God, in his sovereign wisdom, ever allow such barren, dry seasons to come upon us? Perhaps, if we are honest, we have been living too casually, too self-sufficiently, without sufficient daily dependence upon him, and so he graciously removes the very props and supports we had come to lean on instead of himself, precisely in order to drive us back to depend more fully on him alone. While our own water-skins remain comfortably full, we, like Hagar wandering in the wilderness with her own provisions still on hand, remain largely content to go our own way without urgently seeking God. But the moment those familiar supplies finally run completely dry, nothing else will any longer serve or satisfy except that ancient, well-tested cry: \"You are the God who sees me.\"\n\nTruly, anything at all can become a functional idol the moment it begins keeping us at a comfortable distance from God himself, even something as originally good and God-given as the bronze serpent Moses had lifted up in the wilderness, which the people of Israel later came to worship outright and which faithful King Hezekiah was eventually forced to destroy and rename Nehushtan, a mere piece of brass. Remember, too, that the prodigal son in our Lord's own parable was never once safer, nor closer to true blessing, than in that very moment when hunger and utter destitution finally drove him back into his father's welcoming and forgiving arms.\n\nThe very best and safest place for any believer to dwell, then, is living directly and continually upon God's own free grace, never resting our confidence on our own progress in sanctification, however real, and never leaning our full weight upon our own shifting feelings and emotions, however comforting they may sometimes be, but resting instead entirely upon Christ's full and finished atonement, for in him alone are we, even now, already made completely whole. Let your present thirst, then, whatever has caused it, become the very means by which you are driven more eagerly than ever before to that same unfailing fountain of living water."
    },
    "10-17": {
      "ref": "Isaiah 40:11",
      "r": "The good Shepherd's flock is made up of many different kinds of sheep, marked by widely varying experiences, some strong and confident in their faith, others weak and easily discouraged, and yet he remains entirely impartial in the tender care he extends toward every single one of them, so that the weakest lamb in that flock is every bit as dear and precious to him as the most spiritually advanced and mature believer among them. Lambs, by their very nature, tend to lag behind the rest of the flock, to wander off unexpectedly, and to grow weary far more quickly than the older, stronger sheep, and it is precisely for such weak and struggling ones that he protects and gathers with his own strong yet gentle arm.\n\nHe faithfully nourishes those souls newly born again into his kingdom, he graciously consoles weak and fainting minds that seem constantly on the verge of giving up altogether, and he personally gathers every single little one entrusted to his care, for it has never once been our heavenly Father's will that even a single one of these small, seemingly insignificant ones should ultimately perish. What a remarkably quick and watchful eye he possesses, what a tender and compassionate heart, and what a far-reaching, powerful arm he extends on behalf of his weakest sheep!\n\nHow gently he once gathered me to himself, drawing me first to his truth, then to the cleansing power of his blood, then to his own personal love, and finally into the ongoing fellowship of his gathered church, and how often, in the years since, he has patiently restored me again after wandering, accomplishing every bit of this restoration himself, personally, rather than through some distant, impersonal process. How, then, shall I ever love him sufficiently in return for such sustained and personal care? Great Shepherd, add this one further mercy tonight, I pray, to the countless mercies you have already shown me: give me, by your grace, a heart that loves you more truly and more deeply with every passing day."
    },
    "10-18": {
      "ref": "1 Samuel 15:22",
      "r": "Saul had been given a clear and specific command to utterly destroy the Amalekites along with all their cattle, yet instead he spared their king alive and kept back the very best of their flocks and herds for himself, later attempting to justify this direct act of disobedience by claiming he had intended, all along, to offer these very animals as a sacrifice to God. Samuel's reply to this feeble excuse still rings out with unmistakable clarity across the centuries: no amount of outward sacrifice, however impressive or well-intentioned, can ever serve as an acceptable substitute for plain, straightforward obedience to what God has actually commanded. This particular sentence, honestly, deserves to be printed in letters of gold and set before a generation such as ours, one that remains altogether too fond of its own self-designed forms of worship while growing increasingly careless about God's own clearly revealed laws.\n\nTo keep strictly and carefully to your Savior's actual commands is worth infinitely more than any amount of outward religious observance offered instead. If you find yourself presently failing in even the smallest of Christ's commands, resolve tonight to be disobedient in that matter no longer. Ceremony, however elaborate or however grand its outward appearance, can never adequately pay for disobedience; even the extreme act of giving one's own body to be burned profits a person absolutely nothing, according to Scripture's own plain teaching, if that same person continues willfully ignoring the Lord's clear precepts in other areas of life.\n\nBe as teachable and as ready to learn as a small child tonight, and better still, once you have learned the lesson, actually carry it out in practice rather than merely admiring it in theory. Many people spend considerable energy adorning and beautifying their temples of worship, and yet refuse, all the while, to render God the simple, costly obedience he actually requires of them. My own soul, examine yourself honestly, and resolve tonight that you will not quietly join their number in this particular secret failing."
    },
    "10-19": {
      "ref": "Job 35:10",
      "r": "Almost anyone can manage to sing during the daylight hours of prosperity. When the cup runs comfortably full and material wealth abounds on every side, it becomes remarkably easy to lift up praise to God without any real struggle involved. In much the same way, a harp left hanging in the open air will produce a kind of music quite naturally whenever the wind happens to blow across its strings. But the far greater difficulty lies in singing when no favorable wind is blowing at all, when the music must somehow rise from the heart itself, unaided, in the midst of genuine darkness. And this particular kind of night-song, we should note carefully, is not something any person can ever produce entirely on their own strength; it must, of necessity, be divinely inspired by God's own Spirit working within.\n\nPlace me, for instance, in some barren desert where nothing green will grow, or silence my tongue altogether upon a sickbed where I can no longer speak my praises aloud, and how then shall I manage to praise God at all, unless he himself graciously supplies the very song I am to sing? The prophet Habakkuk once sang most gloriously in just such a night season of apparent barrenness: though the fig tree should fail to blossom, and the herd disappear entirely from the stalls, yet he resolved that he would rejoice in the Lord regardless of what his outward circumstances might presently suggest.\n\nSince it is our own gracious Maker, then, who alone gives songs in the night season, let us learn to wait patiently and expectantly upon him for the music we cannot manufacture ourselves, and let us tune our own lips, however faltering at first, toward genuine and heartfelt thanksgiving, trusting that he who gave Habakkuk his song in a season of apparent loss will not withhold a similar song from us in whatever dark season we ourselves are presently passing through."
    },
    "10-20": {
      "ref": "Isaiah 43:6",
      "r": "\"Keep not back,\" the Lord commands, and though these particular words were originally spoken to the nation of Israel, they stand, even now, as a genuine and pressing summons directed toward us as well. We are, by our very fallen nature, backward and reluctant when it comes to pursuing good, and it is only through the ongoing work of grace within us that we ever learn to move forward with any real confidence or resolve. If you remain, even tonight, unconverted, and yet find yourself genuinely longing to trust in Jesus at last, then keep not back any longer: his love stands ready to invite you in, his many promises stand ready to secure and support you, and his own shed blood has already prepared the entire way for your safe approach.\n\nIf you find yourself longing to pray more fervently and more consistently, keep not back from that either, for the mercy seat itself was established and set apart specifically for those who genuinely recognize their own desperate need of mercy. If you already count yourself among the saved, then keep not back from full and open union with God's gathered people, nor from participating faithfully in baptism and the Lord's Supper, however timid or unworthy you may presently feel yourself to be in approaching either. Keep not back, either, from actively using whatever talents, resources, and time the Lord has entrusted specifically into your care, nor from pursuing closer and more intimate communion with God himself day by day, nor from continuing to advance steadily in the ongoing life of genuine faith and holiness. And take care, too, that you yourself never become the cause of holding others back through your own unnecessary coldness or needless suspicion toward them.\n\nUnbelief and superstition, sadly, always seem eager and forward enough whenever it comes to opposing and hindering the work of true faith. Let it never be said, then, of Christ's own soldiers, that they alone hung back reluctantly from the fight while the enemies of true religion pressed eagerly forward. Soldiers of the cross, keep not back."
    }
  };
  function prayDay() {
    var n = new Date(), h = n.getHours();
    if (h < 4) { var d = new Date(n); d.setDate(d.getDate() - 1); return dkey(d); }

  }
  function todaysEvening() { return EVENING[prayDay().slice(5)] || null; }
  function currentPart() {

  }

      return '<button class="parttab' + (part === x[0] ? ' on' : '') + '" data-act="part" data-id="' + x[0] + '" aria-pressed="' + (part === x[0]) + '">' + x[1] + '</button>';
    }).join('') + '</div>';
  }

    var t = prayDay(), e = todaysEvening(), open = ui.eveOpen === t, read = !!(S.eveRead && S.eveRead[t]);

    if (!e) {

    }
    var label = new Date(t + 'T00:00:00').toLocaleDateString(undefined, { month: 'long', day: 'numeric' });
    h += '<div class="row"><p class="small">Tonight\u2019s reading</p><span class="pill">Spurgeon</span></div>' +
      '<p class="verse-ref">' + esc(e.ref) + '</p>' + passageBox(e.ref, true);
    if (open) {
      h += '<div class="dev-body"><p class="small">Reading</p><p class="dev-text">' + esc(e.r) + '</p>' +
        '<p class="small" style="margin-top:14px">A modern rendering of Spurgeon\u2019s evening reading for ' + esc(label) + ', from <i>Morning and Evening</i> (1866).</p>' +
        '<p class="small"><a href="https://ccel.org/s/spurgeon/morn_eve/ME' + t.slice(5, 7) + 'PM.html" target="_blank" rel="noopener noreferrer">Read Spurgeon\u2019s original</a></p></div>';
    }
    h += '<div class="actions"><button class="btn small ' + (open ? 'quiet' : 'primary') + '" data-act="evetoggle">' + (open ? 'Hide reading' : 'Read tonight\u2019s reading') + '</button>' +
      '<button class="btn small quiet" data-act="eveentry">Write about it</button>' +
      (open ? '<button class="btn small ' + (read ? 'on' : 'quiet') + '" data-act="everead" aria-pressed="' + read + '">' + (read ? 'Read' : 'Mark as read') + '</button>' : '') + '</div></section>';
    return h;
  }
  function devCard() { return currentPart() === 'evening' ? eveCard() : morningCard(); }

  /* ---------- verse of the day ---------- */
  function todaysVerse() {
    var n = new Date(), t = dkey(n);

  function todaysQuote() {

  function quoteCard() {

      '<button class="btn small quiet" data-act="newquote">Another quote</button></div></section>';

  /* ---------- views ---------- */
  var CHECK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  function shortLabel(l) { return String(l).replace(/\s+prayer$/i, '') || l; }

  function viewToday() {
    var now = new Date(), mins = now.getHours() * 60 + now.getMinutes();
    var slots = S.slots.slice().sort(byTime);
    var enabled = slots.filter(function (s) { return s.on; });
    var overdue = slots.filter(function (s) { return s.on && toMin(s.time) <= mins && !isDone(s.id); });
    var next = slots.filter(function (s) { return s.on && toMin(s.time) > mins && !isDone(s.id); })[0];
    var doneCount = enabled.filter(function (s) { return isDone(s.id); }).length;
    var status = '';
    if (enabled.length) {
      if (doneCount === enabled.length) status = 'All of today\u2019s prayers are done.';
      else {
        status = doneCount + ' of ' + enabled.length + ' prayers done.';
        if (!overdue.length && next) status += ' Next: ' + esc(next.label) + ', ' + fmt(next.time) + '.';
      }
    }
    var h = '<header><h1>' + esc(now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })) + '</h1>';
    h += '<p class="sub">' + status + '</p></header>';
    if (overdue.length) {
      h += '<div class="banner" role="status"><p>' + esc(overdue[0].label) + ' was set for ' + fmt(overdue[0].time) + '.</p>' +
        '<button class="btn small primary" data-act="slot" data-id="' + overdue[0].id + '">Mark prayed</button></div>';
    }
    if (slots.length) {
      var st = streak();
      h += '<div class="card dayrow" role="group" aria-label="Today\u2019s prayer times"><div class="slotrow">' + slots.map(function (sl) {
        var d = isDone(sl.id), over = overdue.indexOf(sl) !== -1;
        return '<button class="slotbtn' + (d ? ' done' : '') + (over ? ' over' : '') + (sl.on ? '' : ' off') + '" data-act="slot" data-id="' + sl.id + '" aria-pressed="' + d + '" aria-label="' + esc(sl.label) + ' at ' + fmt(sl.time) + '">' +
          '<span class="slotcircle">' + (d ? CHECK_SVG : '') + '</span><span class="slotname">' + esc(shortLabel(sl.label)) + '</span><span class="slottime">' + fmt(sl.time) + '</span></button>';
      }).join('') + '</div><p class="small streakline">' + (st > 0 ? st + (st === 1 ? ' day' : ' days') + ' in a row' : 'Tap a time when you\u2019ve prayed') + '</p></div>';
    } else {
      h += '<p class="empty">No prayer times yet. Add some under Times.</p>';
    }
    h += devCard();
    h += '<div class="actions"><button class="btn ghost" data-act="tab" data-id="pray">Guide me in prayer</button></div>';
    if (now.getDay() === 0) {
      h += '<div class="card row" style="margin-top:14px"><div class="grow"><p class="slot-label">Review your week</p><p class="small">See how the week went and write a short reflection.</p></div>' +
        '<button class="btn small primary" data-act="tab" data-id="week">Open</button></div>';
    }
    var open = S.requests.filter(function (r) { return !r.answered && !r.shelved; });
    open.sort(function (a, b) {
      var pa = prayedToday(a) ? 1 : 0, pb = prayedToday(b) ? 1 : 0;
      if (pa !== pb) return pa - pb;
      return lastPrayed(a) < lastPrayed(b) ? -1 : lastPrayed(a) > lastPrayed(b) ? 1 : 0;
    });
    var prayedN = open.filter(prayedToday).length;
    h += '<section class="section"><div class="row"><h2 style="margin:0">Pray through</h2>' + (open.length ? '<span class="small">' + prayedN + ' of ' + open.length + ' prayed</span>' : '') + '</div>';
    if (!open.length) {
      h += '<p class="empty">Add prayer requests and they\u2019ll show up here to pray through.</p>';
    } else {
      h += '<div class="card list" style="margin-top:10px">' + open.slice(0, 3).map(function (r) {
        var p = prayedToday(r);
        return '<div class="lrow"><span class="lr-text">' + esc(r.text) + '</span><button class="btn small ' + (p ? 'on' : 'quiet') + '" data-act="pray" data-id="' + r.id + '" aria-pressed="' + p + '">' + (p ? 'Prayed' : 'Prayed today') + '</button></div>';
      }).join('') + '</div>';
      if (open.length > 3) h += '<div class="actions"><button class="btn ghost small" data-act="tab" data-id="requests">See all ' + open.length + ' requests</button></div>';
    }
    h += '</section>';
    return h;
  }

  function weekDays(off) {
    var n = new Date(); n.setHours(12, 0, 0, 0);
    var start = new Date(n); start.setDate(n.getDate() - ((n.getDay() + 6) % 7) + off * 7);
    var days = [];
    for (var i = 0; i < 7; i++) { var d = new Date(start); d.setDate(start.getDate() + i); days.push(d); }
    return days;
  }
  function weekLabel(d) { return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
  function weekStats(off) {
    var days = weekDays(off), keys = days.map(function (d) { return dkey(d); }), today = dkey();
    var first = keys[0], last = keys[6];
    var enabled = S.slots.filter(function (s) { return s.on; }).length || S.slots.length;
    var counted = 0, total = 0, prayedDays = 0;
    var per = keys.map(function (k) {
      var n = Object.keys(S.done[k] || {}).length, future = k > today;
      if (!future) counted++;
      total += n; if (n > 0) prayedDays++;
      return { key: k, n: n, future: future, today: k === today };
    });
    var inRange = function (k) { return k >= first && k <= last; };
    return {
      days: days, per: per, first: first, last: last, counted: counted, prayerTotal: total, prayerMax: enabled * counted, prayedDays: prayedDays,
      requestsPrayed: S.requests.filter(function (r) { return (r.prayed || []).some(inRange); }).length,
      answered: S.requests.filter(function (r) { return r.answered && inRange(r.answered.date); }),
      devos: Object.keys(S.devRead || {}).filter(inRange).length + Object.keys(S.eveRead || {}).filter(inRange).length,
      entries: S.journal.filter(function (e) { return inRange(dkey(new Date(e.date))); }).length
    };
  }
  function viewWeek() {
    var off = ui.weekOffset || 0, w = weekStats(off);
    var title = off === 0 ? 'Your week' : off === -1 ? 'Last week' : 'Week of ' + weekLabel(w.days[0]);
    var h = '<header><h1>' + esc(title) + '</h1><p class="sub">' + esc(weekLabel(w.days[0])) + ' to ' + esc(weekLabel(w.days[6])) + '</p></header>';
    h += '<div class="card" style="margin-top:16px"><div class="weekrow">' + w.per.map(function (p, i) {
      return '<div class="weekday"><span class="wcircle' + (p.n > 0 ? ' on' : '') + (p.today ? ' today' : '') + (p.future ? ' future' : '') + '">' + (p.n > 0 ? p.n : '') + '</span>' +
        esc(w.days[i].toLocaleDateString(undefined, { weekday: 'short' })) + '</div>';
    }).join('') + '</div><p class="small" style="text-align:center;margin-top:10px">Numbers show prayer times completed each day</p></div>';
    var stat = function (v, l) { return '<div class="stat"><b>' + v + '</b><span>' + l + '</span></div>'; };
    h += '<div class="stats">' +
      stat(w.prayedDays + ' of ' + w.counted, 'Days you prayed') +
      stat(w.prayerTotal + ' of ' + w.prayerMax, 'Prayer times') +
      stat(w.requestsPrayed, 'Requests prayed for') +
      stat(w.answered.length, 'Answered') +
      stat(w.devos, 'Devotionals read') +
      stat(w.entries, 'Journal entries') + '</div>';
    if (w.answered.length) {
      h += '<section class="section"><h2>Answered this week</h2><ul class="rows">' + w.answered.map(function (r) {
        return '<li class="card"><p class="req-text">' + esc(r.text) + '</p>' + (r.answered.note ? '<div class="answered-note">' + esc(r.answered.note) + '</div>' : '') + '</li>';
      }).join('') + '</ul></section>';
    }

  /* ---------- render ---------- */
  var wakeLock = null, wakePending = false;

        wakePending = true;
        navigator.wakeLock.request('screen').then(function (l) {

          if (l && l.addEventListener) l.addEventListener('release', function () { wakeLock = null; });
        }, function () { wakePending = false; });
      } else if (!want && wakeLock) {
        var l2 = wakeLock; wakeLock = null; l2.release();
      }
    } catch (e) { wakePending = false; }
  }
  function render() {
    var v = tab === 'today' ? viewToday() : tab === 'pray' ? viewPray() : tab === 'week' ? viewWeek() : tab === 'requests' ? viewRequests() : tab === 'journal' ? viewJournal() : viewReminders();

    hydratePassages();
    var btns = document.querySelectorAll('nav button');
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].dataset.id === tab) btns[i].setAttribute('aria-current', 'page'); else btns[i].removeAttribute('aria-current');
    }
