<!DOCTYPE html>
<html lang="en">

<style>
:root {
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#1B2A26; --muted:#4D5F58; --line:#D2DCD6;
  --accent:#2F6B57; --accent-ink:#FFFFFF; --glow:#7FB395; --glow-soft:#DDEBE2; --on-glow:#12281E; --danger:#A33A3A;
  --serif:'Newsreader', Georgia, 'Times New Roman', serif;
  --sans:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0E1714; --surface:#16231F; --ink:#E4EEE9; --muted:#93A99F; --line:#253730;
    --accent:#7FC4A3; --accent-ink:#0E1714; --glow:#6FB08F; --glow-soft:#1E3329; --on-glow:#0B1A14; --danger:#E08A8A;
  }
}
:root[data-theme="dark"] {
  --bg:#0E1714; --surface:#16231F; --ink:#E4EEE9; --muted:#93A99F; --line:#253730;
  --accent:#7FC4A3; --accent-ink:#0E1714; --glow:#6FB08F; --glow-soft:#1E3329; --on-glow:#0B1A14; --danger:#E08A8A;
}
html { scroll-padding-top:env(safe-area-inset-top,0px); }
*, *::before, *::after { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%; }
main { max-width:560px; margin:0 auto; padding:20px 18px 110px; }
h1, h2 { font-family:var(--serif); font-weight:500; margin:0; letter-spacing:-0.01em; }
h1 { font-size:34px; line-height:1.1; }
h2 { font-size:22px; line-height:1.2; margin-bottom:10px; }
p { margin:0; }
.sub { color:var(--muted); margin-top:6px; }
.section { margin-top:28px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
.banner { background:var(--glow-soft); border:1px solid var(--glow); border-radius:14px; padding:12px 14px; margin-bottom:18px; display:flex; gap:12px; align-items:center; justify-content:space-between; }
.banner p { font-weight:500; }
.arc { display:block; width:100%; height:auto; margin-top:14px; overflow:visible; }
.arc .node { cursor:pointer; outline:none; }
.arc .node circle.ring { fill:var(--surface); stroke:var(--accent); stroke-width:2; }
.arc .node.over circle.ring { stroke:var(--glow); stroke-width:3; }
.arc .node.done circle.ring { fill:var(--glow); stroke:var(--glow); }
.arc .node.off { opacity:.45; }
.arc .node:focus-visible circle.ring { stroke:var(--ink); stroke-width:3; }
.arc .dot { fill:var(--accent); }
.arc .check { fill:none; stroke:var(--on-glow); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
.arc text { font-family:var(--sans); font-size:11px; fill:var(--muted); text-anchor:middle; }
.passage { margin-top:12px; padding:12px 14px; background:var(--bg); border-radius:10px; border-left:3px solid var(--glow); }
.passage-ref { font-weight:600; font-size:14px; margin:0; }
.passage-text { font-family:var(--serif); font-size:19px; line-height:1.55; margin:6px 0 8px; overflow-wrap:anywhere; }
.passage-text.small { font-family:var(--sans); font-size:14px; }
.passage-text sup { font-family:var(--sans); font-size:11px; color:var(--muted); margin-right:3px; }
.passage-foot { font-size:12.5px; color:var(--muted); margin:0; }
.passage-foot a { color:var(--accent); }
.verse .passage { margin-top:10px; }
.verse { margin-top:18px; }
.dev-body { margin-top:14px; border-top:1px solid var(--line); padding-top:6px; }
.dev-body .small { margin:12px 0 4px; }
.dev-text { font-family:var(--serif); font-size:18px; line-height:1.6; margin:0; }
.dev-prayer { font-family:var(--serif); font-style:italic; font-size:17px; line-height:1.55; margin:0; }
.dev-quote { background:var(--bg); border-radius:10px; padding:10px 14px 12px; margin-top:16px; }
.dev-quote .small { margin:8px 0 0; }
.dev-quote .small:first-child { margin-top:0; }
.dev-qtext { font-family:var(--serif); font-size:17px; line-height:1.45; margin:6px 0 6px; }
/* morning / evening tabs */
.parttabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.parttab { border:1px solid var(--line); background:transparent; border-radius:10px; padding:9px 8px; font-weight:500; color:var(--ink); min-height:42px; }
.parttab.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
.dev-body a { color:var(--accent); }
/* today row */
.dayrow { margin-top:16px; padding:14px 10px 12px; }
.slotrow { display:grid; grid-template-columns:repeat(auto-fit,minmax(64px,1fr)); gap:6px; }
.slotbtn { background:none; border:0; padding:4px 2px; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink); border-radius:10px; min-width:0; }
.slotcircle { width:42px; height:42px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; background:var(--surface); }
.slotbtn.over .slotcircle { border-color:var(--accent); border-width:2.5px; }
.slotbtn.done .slotcircle { background:var(--glow); border-color:var(--glow); }
.slotbtn.off { opacity:.5; }
.slotcircle svg { width:22px; height:22px; fill:none; stroke:var(--on-glow); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
.slotname { font-size:13px; font-weight:500; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.slottime { font-size:12px; color:var(--muted); }
.streakline { text-align:center; margin-top:10px; }
.list { padding:4px 14px; }
.lrow { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
.lrow:first-child { border-top:0; }
.lr-text { flex:1; min-width:0; overflow-wrap:anywhere; }
/* week */
.weekrow { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
.weekday { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px; color:var(--muted); }
.wcircle { width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--ink); }
.wcircle.on { background:var(--glow); border-color:var(--glow); color:var(--on-glow); font-weight:600; }
.wcircle.today { border-color:var(--accent); }
.wcircle.future { opacity:.4; }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
.stat { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
.stat b { display:block; font-family:var(--serif); font-size:26px; font-weight:500; line-height:1.2; }
.stat span { font-size:13px; color:var(--muted); }
/* focus mode */
body.focus nav { display:none; }
body.focus main { padding-bottom:40px; }
body.focus header h1 { font-size:26px; }
body.focus .step-card { padding:20px 18px; }
body.focus .step-card h2 { font-size:30px; }
body.focus .lordline { font-size:27px; }
body.focus .step-card p:not(.small), body.focus .prompts { font-size:18px; line-height:1.6; }
body.focus .step-card textarea { font-size:19px; }
body.focus .step-card .btn { min-height:50px; font-size:17px; }
body.focus .passage-text { font-size:21px; }
input[type=file] { width:100%; font-size:14px; margin-top:2px; }
.dots { display:flex; gap:6px; margin:14px 0 4px; }
.dots span { flex:1; height:5px; border-radius:3px; background:var(--line); }
.dots span.on { background:var(--glow); }
.lordline { margin:8px 0 4px; font-family:var(--serif); font-size:23px; line-height:1.4; }
.prompts { margin:12px 0 0; padding-left:20px; }
.prompts li { margin:6px 0; }
.reflinks { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:14px; }
a.reflink { border:1px solid var(--line); border-radius:99px; padding:6px 12px; font-size:14px; font-weight:500; color:var(--accent); text-decoration:none; }
.need { margin-top:16px; }
.need h3 { font-size:15px; font-weight:600; margin:0 0 8px; }
.chiprow { display:flex; gap:8px; flex-wrap:wrap; }
.chiprow .chip { color:var(--ink); }
.step-card { margin-top:16px; }
.rest-widget { margin-top:16px; border-top:1px solid var(--line); padding-top:14px; text-align:center; }
.rest-widget .chiprow { justify-content:center; flex-wrap:wrap; }
.rest-widget > .small:first-child { text-align:left; }
.rest-ring { position:relative; width:140px; height:140px; margin:6px auto 4px; }
.rest-ring svg { width:140px; height:140px; transform:rotate(-90deg); }
.ring-bg { fill:none; stroke:var(--line); stroke-width:9; }
.ring-fg { fill:none; stroke:var(--glow); stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
.rest-time { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--serif); font-size:26px; }
.rest-time span { font-family:var(--sans); font-size:11px; color:var(--muted); }
.rest-phrase { font-family:var(--serif); font-style:italic; font-size:17px; line-height:1.5; margin:10px 0 4px; }
.step-card textarea { margin-top:14px; font-size:17px; }
.quote { margin-top:24px; }
.quote blockquote { margin:10px 0 8px; font-family:var(--serif); font-size:22px; line-height:1.4; }
.quote-by { font-weight:600; }
.quote .row { align-items:flex-start; }
.verse-ref { font-family:var(--serif); font-size:28px; line-height:1.2; margin:2px 0; }
a.btn { display:inline-flex; align-items:center; text-decoration:none; }
.streak { display:flex; align-items:baseline; gap:8px; margin-top:6px; }
.streak b { font-family:var(--serif); font-size:28px; font-weight:500; color:var(--glow); }
.rows { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
.row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.row .grow { flex:1; min-width:0; }
.slot-label { font-weight:500; }
.small { font-size:13px; color:var(--muted); }
.pill { display:inline-block; font-size:12px; font-weight:500; padding:2px 10px; border-radius:99px; background:var(--bg); border:1px solid var(--line); color:var(--muted); }
.pill.due { background:var(--glow-soft); border-color:var(--glow); color:var(--ink); }
button, select, input, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
.btn { border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); border-radius:10px; padding:9px 16px; font-weight:600; min-height:42px; }
.btn.ghost { background:transparent; color:var(--accent); }
.btn.quiet { background:transparent; border-color:var(--line); color:var(--ink); font-weight:500; }
.btn.small { font-size:14px; padding:6px 12px; min-height:36px; color:inherit; }
.btn.small.primary { background:var(--accent); color:var(--accent-ink); }
.btn.small.on { background:var(--glow); border-color:var(--glow); color:var(--on-glow); font-weight:600; }
.btn.danger { color:var(--danger); border-color:var(--line); background:transparent; }
:where(button, a, input, select, textarea):focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
input[type=text], input[type=time], select, textarea { width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-height:44px; }
textarea { resize:vertical; font-family:var(--serif); font-size:18px; line-height:1.5; }
label.field { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
.form-row { display:flex; gap:8px; margin-top:8px; }
.form-row > input { flex:1; }
.form-row > select { width:auto; max-width:44%; }
.chips { display:flex; gap:8px; margin:18px 0 12px; }
.chip { border:1px solid var(--line); background:transparent; border-radius:99px; padding:6px 14px; font-weight:500; color:var(--muted); }
.chip[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.req-text { font-size:17px; }
.req-meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.answered-note { background:var(--glow-soft); border-radius:10px; padding:8px 12px; margin-top:10px; font-size:15px; }
.entry-date { font-family:var(--serif); font-size:19px; }
.entry-body { font-family:var(--serif); font-size:18px; line-height:1.55; white-space:pre-wrap; margin-top:6px; overflow-wrap:anywhere; }
.entry-thanks { margin-top:8px; font-size:15px; color:var(--muted); }
.empty { color:var(--muted); padding:18px 4px; }
.slot-edit { display:grid; grid-template-columns:1fr 118px; gap:8px; }
.slot-tools { display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
.switch { display:flex; align-items:center; gap:8px; font-size:15px; }
.switch input { width:20px; height:20px; accent-color:var(--accent); }
.toast { background:var(--ink); color:var(--bg); border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:15px; }
nav { position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(6,1fr); padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px)); z-index:10; }
nav button { background:none; border:0; padding:8px 0 6px; font-size:11.5px; font-weight:500; color:var(--muted); position:relative; min-height:52px; display:flex; flex-direction:column; align-items:center; gap:3px; }
nav button svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
nav button[aria-current="page"] { color:var(--accent); font-weight:600; }
nav button[aria-current="page"]::before { content:""; position:absolute; top:0; left:30%; right:30%; height:3px; border-radius:0 0 3px 3px; background:var(--glow); }
</style>
</head>

  var DEVOS = [
    {"d": "2026-09-20", "ref": "Psalm 122:1", "theme": "Gathering", "r": "There’s a gladness that only shows up when people move toward God together. It’s easy to treat Sunday as one more obligation, or to drift in tired and distracted. Come expecting a little gladness anyway. You don’t need to feel fervent; you only need to show up. God often meets us through the person sitting next to us.", "q": ["What makes gathering with others hard for me right now?", "Who could I greet or encourage today?"], "p": "Lord, make me glad to be in your house today, and open my heart to those around me. Amen.", "k": "banquet", "s": 1},
    {"d": "2026-09-27", "ref": "Psalm 92:1-2", "theme": "Praise", "r": "The psalmist bookends the day with praise: love in the morning, faithfulness at night. It’s a simple rhythm that changes how a day feels. Try it today. Begin by naming one thing about God you’re thankful for, and end the day by naming one way you saw his faithfulness. Praise is a habit before it is a feeling.", "q": ["What is one thing about God I can thank him for this morning?", "How might I notice his faithfulness by tonight?"], "p": "Lord, let my day begin and end with you. Amen.", "k": "blessings flow", "s": 1},
    {"d": "2026-10-01", "ref": "1 Timothy 2:1-2", "theme": "Your nation", "r": "Paul’s first instruction to the church isn’t to complain about leaders or to ignore them, but to pray for them. That includes people we didn’t choose and may not trust. Praying for a government doesn’t endorse everything it does. It asks God for justice, peace and wisdom where decisions touch ordinary lives. Pray today for your country and for those who lead it, by name if you can.", "q": ["Which leaders or situations in my country need prayer most?", "How could I pray for them without cynicism?"], "p": "Father, give wisdom, honesty and mercy to those in authority, and peace to our land. Amen.", "k": "tranquility of order"},
    {"d": "2026-10-04", "ref": "Mark 2:27", "theme": "Rest", "r": "Jesus says the Sabbath was made for people, not people for the Sabbath. Rest isn’t a reward for finishing everything. It’s a gift built into the shape of the week. If you’re the sort of person who always has one more thing to do, resting today is a small act of trust that God holds the world without your help.", "q": ["What would real rest look like for me today?", "What am I afraid will fall apart if I stop?"], "p": "Lord of the Sabbath, teach me to receive rest as a gift and not as a reward. Amen.", "k": "Be at peace with your own soul", "s": 1},
    {"d": "2026-10-11", "ref": "Psalm 84:1-2", "theme": "Longing", "r": "The psalmist isn’t describing duty but longing: a soul that faints for God’s presence. Some days we don’t feel that ache, and it’s worth being honest about that. But longing can be asked for. If your heart feels flat this morning, tell God so, and ask him to stir up the desire you wish you had.", "q": ["Do I feel any longing for God today? If not, what has dulled it?", "What is one way I could draw near to him?"], "p": "Lord, if I don’t long for you, make me want to. Amen.", "k": "Late have I loved you", "s": 1},
    {"d": "2026-10-18", "ref": "Colossians 4:14", "theme": "Luke the physician", "r": "Today the church remembers Luke, whom Paul calls a dear friend and a physician. Luke also wrote a Gospel and the book of Acts, and he seems to have stayed with Paul when others left. For Luke, caring for the sick and telling the story of Jesus were both ways of loving people. Whatever your work is, it can be a place where you notice and serve others.", "q": ["How is my work a way of caring for people?", "Who needs a faithful friend at their side this week?"], "p": "Lord, bless all who care for the sick, and make my work a service to others. Amen.", "k": "proof of love"},
    {"d": "2026-10-25", "ref": "Luke 22:19-20", "theme": "Remembering", "r": "Christians differ on how, but we agree on this: Jesus asked his followers to remember him at the table. Remembering isn’t only recalling a fact. It’s letting the story shape who you are again. Whether or not you share communion today, take a moment to remember that his body was given and his blood poured out for you.", "q": ["What does it mean to me that Jesus gave himself for me?", "What do I most need to remember today?"], "p": "Lord Jesus, help me remember what you have done, and live in the light of it. Amen.", "k": "wondrous cross", "s": 1},
    {"d": "2026-10-31", "ref": "Ephesians 2:8-10", "theme": "Grace", "r": "For many Christians today recalls the Reformation, when believers rediscovered how much of the gospel is gift. Whatever your tradition, the verse stands: you were saved by grace, through faith, and it wasn’t your doing. The good works that follow aren’t payment. They’re what a saved person does. Rest in that before you get busy.", "q": ["Where am I trying to earn what God has already given?", "What good work has he prepared for me today?"], "p": "Father, thank you that salvation is a gift. Let my work flow from gratitude and not from fear. Amen.", "k": "taught my heart"},
    {"d": "2026-11-01", "ref": "Hebrews 12:1-2", "theme": "All Saints", "r": "Today many churches remember the saints, the faithful who have gone before us. Hebrews pictures them as witnesses who show the race can be finished. You aren’t running alone or first. Give thanks for someone whose faith helped you, and keep your eyes on Jesus, who is both the example and the finish line.", "q": ["Whose faith has helped me most, and have I thanked God for them?", "What is weighing me down that I could lay aside?"], "p": "God of all the saints, thank you for those who showed me the way. Fix my eyes on Jesus. Amen.", "k": "eighty-six years"},
    {"d": "2026-11-02", "ref": "John 11:25-26", "theme": "Remembering the departed", "r": "Grief doesn’t keep a schedule. Today many Christians remember those who have died. Jesus doesn’t tell Martha to stop crying. He tells her who he is: the resurrection and the life. If there’s someone you miss, you can bring them to him today with gratitude and with tears, trusting them to his mercy.", "q": ["Who am I remembering today, and what am I thankful for about them?", "What do I want to say to Jesus about my loss?"], "p": "Lord Jesus, you are the resurrection and the life. Comfort those who grieve, and hold our loved ones in your mercy. Amen.", "k": "life reigns"},
    {"d": "2026-11-08", "ref": "Acts 2:42", "theme": "Together", "r": "The first believers gave themselves to four things: the apostles’ teaching, fellowship, breaking bread, and prayer. Nothing exotic. Their faith grew through ordinary, repeated habits shared with other people. Which of the four is thinnest in your life right now? Pick one to strengthen this week, and invite someone to join you.", "q": ["Which of these four is weakest for me right now?", "Who could I share it with?"], "p": "Lord, give me a hunger for the simple habits that keep me near you and your people. Amen.", "k": "God as your Father", "s": 1},
    {"d": "2026-11-15", "ref": "Hebrews 10:24-25", "theme": "Encouragement", "r": "Encouragement isn’t a personality type. It’s a habit the writer commands: stir one another up toward love and good works. That usually happens in small ways, like a message, a question or a meal. Who could use a word from you today? Send it before the day gets away.", "q": ["Who comes to mind when I think of someone who is struggling?", "What is one specific thing I could say to encourage them?"], "p": "Lord, use me to lift someone up today. Amen.", "k": "island", "s": 1},
    {"d": "2026-11-22", "ref": "Colossians 1:15-18", "theme": "Christ the King", "r": "Today many churches celebrate Christ as King, the last Sunday before Advent. Paul describes him as the image of the invisible God, the one through whom and for whom all things were made, and in whom they hold together. That means no part of your week is outside his rule, including the parts that feel out of control. The one who holds the universe together can hold your Monday.", "q": ["What part of my life am I treating as outside Christ’s rule?", "What would it mean to say “You are Lord of this” today?"], "p": "Christ the King, hold together what I cannot. Rule in my heart and in my day. Amen.", "k": "Christ within me"},
    {"d": "2026-11-26", "ref": "Psalm 107:1-2", "theme": "Thanks", "r": "Some days are set aside for thanks, and there’s wisdom in that: gratitude needs practice. Try naming, out loud, five specific things you’re thankful for. Include one that’s hard to be thankful for, and one person who doesn’t know how much they mean to you. Then thank the one who gives every good gift.", "q": ["What am I thankful for that I usually overlook?", "Who could I thank today, in person or in writing?"], "p": "Lord, you are good, and your love endures. Thank you for all you’ve given. Amen.", "k": "creation, preservation"},
    {"d": "2026-11-29", "ref": "Romans 13:11-12", "theme": "Waking up", "r": "Advent begins today, and the season opens with an alarm: wake up, the night is nearly over. Paul isn’t scolding. He’s reminding drowsy people that morning is closer than they think. Advent is the church’s way of training us to live awake to the fact that Christ has come, comes to us now, and will come again. What in your life needs waking?", "q": ["Where have I grown drowsy in my faith?", "What would it look like to live this Advent awake?"], "p": "Lord Jesus, wake me from spiritual sleep. Let this Advent draw me close to you. Amen.", "k": "Lighten our darkness", "se": "Advent"},
    {"d": "2026-11-30", "ref": "Mark 13:33-37", "theme": "Watch", "r": "Jesus tells a story about a master who leaves and a doorkeeper told to stay alert. Watching doesn’t mean anxiety. It means faithful attention: doing the work you’ve been given while staying aware that the master will return. Today, do one ordinary thing as if you were doing it for him, because you are.", "q": ["What has Christ given me to do while I wait?", "How can I stay alert without being anxious?"], "p": "Lord, keep me faithful and watchful until you come. Amen.", "k": "dying man to dying men", "se": "Advent"},
    {"d": "2026-12-01", "ref": "Psalm 130:5-6", "theme": "Waiting", "r": "“My soul waits for the Lord more than watchmen wait for the morning.” Watchmen know the morning is coming, and still the night is long. Advent gives us words for waiting without pretending it’s easy. What are you waiting for? Bring it to God, and let the waiting be a kind of prayer.", "q": ["What am I waiting for right now?", "How could waiting itself become a prayer?"], "p": "Lord, my soul waits for you. Give me patience in the night. Amen.", "k": "have mercy on me, a sinner", "se": "Advent"},
    {"d": "2026-12-02", "ref": "Isaiah 2:5", "theme": "Walking in the light", "r": "Come, let us walk in the light of the Lord. It’s an invitation to move, not just to admire the light from a distance. Light is given for the next step. What step has been waiting for you? Take it this Advent, trusting that he lights the road as you go.", "q": ["What step have I been avoiding?", "How could I walk in the light of God today?"], "p": "Lord, let us walk in your light today. Amen.", "k": "kindly Light", "se": "Advent"},
    {"d": "2026-12-03", "ref": "Psalm 24:7-10", "theme": "King of glory", "r": "The gates are told to lift their heads because the King of glory is coming in. Advent teaches us to prepare room for him. Not the room of a tidy house, but the room of a heart that is open. What gate in you has been shut, and could you lift it today?", "q": ["What part of my heart have I kept closed?", "What would it mean to welcome the King there?"], "p": "King of glory, come in. Open every gate in me. Amen.", "k": "all hearts be open", "se": "Advent"},
    {"d": "2026-12-04", "ref": "Isaiah 9:2", "theme": "Light in darkness", "r": "The people who walked in darkness have seen a great light. Notice the tense: seen, not “might see.” Isaiah speaks as if it has already happened. In a season that is bright with decoration, some of us are in a dark place. This verse isn’t for people who have their light sorted. It’s for people in the dark.", "q": ["Where do I feel I’m walking in darkness?", "What would it mean to look for his light there?"], "p": "Light of the world, shine where I can’t see. Amen.", "k": "Lighten our darkness", "se": "Advent"},
    {"d": "2026-12-05", "ref": "Luke 21:28", "theme": "Lift your heads", "r": "When things begin to fall apart, Jesus says to stand up and lift your heads because redemption is drawing near. It’s the opposite of the instinct to cower. Advent is a season for lifting our eyes past the noise of the news to the one who is coming. Where do you need to look up today?", "q": ["What is making me want to look down?", "How could I lift my eyes to Christ today?"], "p": "Lord, when the world shakes, help me lift my head to you. Amen.", "k": "kindly Light", "se": "Advent"},
    {"d": "2026-12-06", "ref": "Isaiah 40:1-5", "theme": "Comfort", "r": "“Comfort, comfort my people.” The prophet is speaking to people who had been in exile for a long time. God’s first word isn’t rebuke but tenderness. Advent begins with comfort, and then a road is built through the wilderness. Wherever you need comfort today, God begins with kindness.", "q": ["What do I need comfort for today?", "How might God be speaking kindly to me?"], "p": "Lord, speak comfort to my heart today. Amen.", "k": "all manner of thing", "se": "Advent"},
    {"d": "2026-12-07", "ref": "Luke 3:3-6", "theme": "Prepare the way", "r": "John the Baptist calls people to prepare for the Lord by repentance. The image is of road-building: filling valleys, flattening hills, straightening what is crooked. Repentance is preparation, not punishment. What crooked place in your life could you ask God to straighten this Advent?", "q": ["What needs straightening in me?", "What is one act of repentance I could offer him this week?"], "p": "Lord, prepare in me a way for you. Amen.", "k": "hatest nothing", "se": "Advent"},
    {"d": "2026-12-08", "ref": "Malachi 3:1", "theme": "The messenger", "r": "Malachi speaks of a messenger sent to prepare the way, and then the Lord himself will suddenly come to his temple. The Christian church sees this fulfilled in John and in Christ. The surprising thing is “suddenly.” God’s arrival is not always announced with a long lead. Be ready today, not just on the calendar’s schedule.", "q": ["What would it mean to be ready for God today?", "What do I need to attend to before he arrives?"], "p": "Lord, make me ready for your coming. Amen.", "k": "", "se": "Advent"},
    {"d": "2026-12-09", "ref": "Isaiah 40:9-11", "theme": "The shepherd king", "r": "Isaiah announces good news: here is your God. And then the surprise. He comes with power, yet he tends his flock like a shepherd, gathering the lambs in his arms and gently leading those with young. The one who rules is gentle. If you’ve been afraid of God, look at this picture first.", "q": ["What does it mean that God is gentle with the weak?", "Where do I need to be carried?"], "p": "Shepherd of Israel, gather me in your arms. Amen.", "k": "Love divine", "se": "Advent"},
    {"d": "2026-12-10", "ref": "Matthew 3:1-3", "theme": "Repentance", "r": "“Repent” means to turn. John’s message is simple: turn toward the one who’s coming. Repentance isn’t self-hatred. It’s reorienting your life toward God. Where do you sense you’ve drifted this year? Turn now, in a small and specific way, and see what he does with it.", "q": ["Where have I drifted from God?", "What does turning back look like today?"], "p": "Lord, I turn to you. Have mercy on me. Amen.", "k": "have mercy on me, a sinner", "se": "Advent"},
    {"d": "2026-12-11", "ref": "Psalm 85:10-13", "theme": "Peace and righteousness", "r": "Steadfast love and faithfulness meet; righteousness and peace kiss. The psalm pictures two things we often pit against each other, justice and peace, embracing. The Christian hope is that God’s coming brings both. Who do you know that needs both justice and peace this Advent? Pray for them.", "q": ["Where do I see a need for both justice and peace?", "Who could I pray for today?"], "p": "Lord, let righteousness and peace kiss in our world and in my heart. Amen.", "k": "tranquility of order", "se": "Advent"},
    {"d": "2026-12-12", "ref": "Isaiah 11:1-5", "theme": "A shoot from Jesse", "r": "After the great tree of Israel’s monarchy is cut down to a stump, a shoot appears. Hope grows from what looks finished. Christians see this in Jesus. If some part of your life looks like a stump, Isaiah says God isn’t done. Watch for a shoot.", "q": ["What in my life looks like a stump?", "What would it mean to watch for a shoot of new life?"], "p": "Lord, bring new life where I see only a stump. Amen.", "k": "shall not be overcome", "se": "Advent"},
    {"d": "2026-12-13", "ref": "Zephaniah 3:14-17", "theme": "Rejoice", "r": "The third week of Advent is traditionally a week of joy. Zephaniah tells us God rejoices over his people with gladness and quiets them with his love. The picture isn’t a stern God waiting for you to earn joy. It’s a God who sings over you. If you can’t feel joyful, let yourself be sung over.", "q": ["What would it mean that God rejoices over me?", "What is one small source of joy I can notice today?"], "p": "Lord, quiet me with your love, and let me rejoice in you. Amen.", "k": "bright and beautiful", "se": "Advent"},
    {"d": "2026-12-14", "ref": "Philippians 4:4-5", "theme": "Gentleness", "r": "Rejoice always, and let your gentleness be known to everyone, for the Lord is near. Notice the reason: the Lord is near. The season can make us frantic. Gentleness is a discipline. Who will you be gentle with today, especially when things get busy?", "q": ["Where am I most likely to be harsh this week?", "What would gentleness look like there?"], "p": "Lord, make me gentle with everyone, because you are near. Amen.", "k": "blessings flow", "se": "Advent"},
    {"d": "2026-12-15", "ref": "James 5:7-8", "theme": "Patience", "r": "James uses the farmer as an example: he waits for the precious crop, patient until the early and the late rains. Farmers can’t hurry the rain. Advent is a season for learning to wait without forcing. What are you trying to hurry that needs to ripen in God’s time?", "q": ["What am I trying to rush?", "What would it mean to wait like a farmer?"], "p": "Lord, teach me to wait patiently for your coming. Amen.", "k": "Man proposes", "se": "Advent"},
    {"d": "2026-12-16", "ref": "Isaiah 35:1-4", "theme": "Be strong", "r": "The desert will bloom, and the weak hands are told to be strong. The message to the fearful: your God will come. Advent isn’t only for the cheerful. It’s for the tired and the anxious. If you’re tired, you’re invited into this promise. Strength is given, not summoned.", "q": ["Where do I feel weak or fearful?", "How does this promise speak to it?"], "p": "Lord, strengthen weak hands and steady trembling knees. Amen.", "k": "shall not be overcome", "se": "Advent"},
    {"d": "2026-12-17", "ref": "Isaiah 9:6-7", "theme": "A child is born", "r": "Isaiah names the coming child with four names: Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace. The Christian confession is that this child is God with us. That is astonishing: the Almighty comes small. Pick one of the four names for today. Which one do you need?", "q": ["Which of these names do I need most today?", "What does it mean that God came as a child?"], "p": "Lord Jesus, you are my Counselor, my God, my Father and my Prince of Peace. Amen.", "k": "made man that we might be made God", "se": "Advent"},
    {"d": "2026-12-18", "ref": "Matthew 1:18-21", "theme": "Joseph", "r": "Joseph is a man in a hard situation, and he is described as a just man who didn’t want to shame Mary. Then an angel tells him to not be afraid. Joseph says nothing in the Gospels, but he does what God asks. Quiet obedience can be as faithful as any speech. What might God be asking of you quietly?", "q": ["What would quiet obedience look like for me?", "Where do I need to hear “do not be afraid”?"], "p": "Lord, give me the quiet faithfulness of Joseph. Amen.", "k": "Christ be with me", "se": "Advent"},
    {"d": "2026-12-19", "ref": "Luke 1:76-79", "theme": "The dawn", "r": "Zechariah, after months of silence, sings that the dawn from on high will break upon us, to give light to those who sit in darkness and to guide our feet into the way of peace. Notice that God’s mercy is called tender. The sunrise doesn’t shout. It rises. Sit in some quiet today and watch for light.", "q": ["What would tender mercy look like for me today?", "Where do I need light for my next steps?"], "p": "Lord, let your tender mercy shine on me and guide my feet into peace. Amen.", "k": "kindly Light", "se": "Advent"},
    {"d": "2026-12-20", "ref": "Luke 1:26-33", "theme": "Mary", "r": "The angel greets Mary as favored, and she is troubled. Many of us assume God’s favor means ease, but here it means being given a hard and holy task. Mary’s first response is honest confusion. God isn’t offended by questions. What is God asking of you that is bigger than you feel ready for?", "q": ["What is God asking of me that feels too big?", "What honest question could I bring to him?"], "p": "Lord, you have favored me with your call. Give me courage to answer. Amen.", "k": "your dignity", "se": "Advent"},
    {"d": "2026-12-21", "ref": "Luke 1:34-38", "theme": "Let it be", "r": "“Let it be to me according to your word.” Mary’s answer is the model of trusting surrender: not passive, but willing. She doesn’t know how it will work. She says yes to the one who does. What would it mean to say “let it be” to something God is asking of you today?", "q": ["What is my “let it be” this Advent?", "What might I be holding back?"], "p": "Lord, let it be to me according to your word. Amen.", "k": "liberty, my memory", "se": "Advent"},
    {"d": "2026-12-22", "ref": "Luke 1:39-45", "theme": "Elizabeth", "r": "Elizabeth greets Mary with joy and blessing. She celebrates someone else’s calling without envy. There are people in your life whose good news you can amplify. Who could you bless today, especially someone whose gift is different from yours?", "q": ["Whose good news can I celebrate today?", "Where do I feel envy that I could turn into blessing?"], "p": "Lord, make me generous in celebrating what you do in others. Amen.", "k": "island", "se": "Advent"},
    {"d": "2026-12-23", "ref": "Luke 1:46-50", "theme": "Mary’s song", "r": "“My soul magnifies the Lord.” Mary’s song is one of the great prayers of the church, sung for centuries at evening prayer. She praises God for looking on the humble. A song like this is a good pattern for your own prayers: begin with who God is, and what he has done. Try writing a few lines of your own.", "q": ["What has God done that I could magnify today?", "What are three lines of praise I could write?"], "p": "My soul magnifies the Lord, and my spirit rejoices in God my Savior. Amen.", "k": "blessings flow", "se": "Advent"},
    {"d": "2026-12-24", "ref": "Luke 2:1-7", "theme": "No room", "r": "Mary and Joseph arrive in Bethlehem, and there is no room for them. The King is born in the margins. If you ever feel there’s no room for you, this story is very near. And it also asks: is there room in me? Make a little room tonight, even if it is a quiet corner of a busy evening.", "q": ["Where in my life is there no room for Jesus?", "How could I make a little room tonight?"], "p": "Lord Jesus, there is room in my heart. Come. Amen.", "k": "Word without a word", "se": "Advent"},
    {"d": "2026-12-25", "ref": "Luke 2:8-14", "theme": "Good news", "r": "The first announcement of Christ’s birth goes to shepherds working the night shift, overlooked and ordinary. The angel says, “Do not be afraid; I bring you good news of great joy for all the people.” Merry Christmas. Whatever this day looks like for you, the news is for you. Let it be received simply, like a gift.", "q": ["What would it mean to receive this news as a gift?", "Who could I share it with today?"], "p": "Glory to God in the highest, and on earth peace. Thank you for coming, Lord Jesus. Amen.", "k": "your dignity", "se": "Christmas"},
    {"d": "2026-12-26", "ref": "Acts 7:59-60", "theme": "Stephen", "r": "The day after Christmas the church remembers Stephen, the first martyr. His last words echo Jesus: he entrusts his spirit and asks forgiveness for his killers. Christmas doesn’t end the difficulty of following Christ. It gives the reason to endure it. Is there someone you need to forgive?", "q": ["Who do I need to forgive?", "How does Christ’s example help me?"], "p": "Lord Jesus, receive my spirit, and help me forgive as you forgave. Amen.", "k": "heart without words", "se": "Christmas"},
    {"d": "2026-12-27", "ref": "1 John 1:1-4", "theme": "Witness", "r": "John writes about what he heard, saw and touched: the Word of life. Christianity begins with an event, not just an idea. God became something you could touch. Today, take a moment to be grateful for the ordinary people who handed the story down to you.", "q": ["Who handed the faith to me?", "What is one way I can pass on what I’ve received?"], "p": "Lord, thank you for the witnesses who told me about you. Amen.", "k": "He became what we are", "se": "Christmas"},
    {"d": "2026-12-28", "ref": "Matthew 2:13-15", "theme": "Refuge", "r": "Soon after his birth, Jesus’ family becomes refugees, fleeing to Egypt to escape a king’s violence. Today the church remembers the children who suffered in Herod’s anger. Christmas does not hide the world’s cruelty. It enters it. Pray today for children in danger and for families who are displaced.", "q": ["Who could I pray for today who is in danger or displaced?", "What could I do to help someone vulnerable?"], "p": "Lord, protect the children, and shelter those who flee. Amen.", "k": "Christ be with me", "se": "Christmas"},
    {"d": "2026-12-29", "ref": "Luke 2:25-32", "theme": "Simeon", "r": "Simeon has waited his whole life. When he sees the baby, he can say he’s ready to go in peace. The consolation of Israel is in his arms. Some of us have waited long for something, and God can meet us in an unexpected way. What are you still waiting for? Bring it to him.", "q": ["What have I waited for a long time?", "What would it mean to hold Christ and be at peace?"], "p": "Lord, let me depart in peace, for my eyes have seen your salvation. Amen.", "k": "Be at peace with your own soul", "se": "Christmas"},
    {"d": "2026-12-30", "ref": "John 1:14-16", "theme": "The Word became flesh", "r": "The Word became flesh and dwelt among us. God didn’t send a message from a distance. He moved into the neighborhood. In Jesus we see grace upon grace. If you’re looking for evidence of God’s love, look here: he came near, and he stays near.", "q": ["What does it mean that God became flesh?", "Where do I need his nearness today?"], "p": "Word made flesh, dwell in me. Thank you for coming near. Amen.", "k": "made man that we might be made God", "se": "Christmas"},
    {"d": "2026-12-31", "ref": "Lamentations 3:22-26", "theme": "New mercies", "r": "On the last day of the year, we look back and forward. The writer of Lamentations speaks from a broken place and still says that God’s mercies are new every morning. Tonight, you can thank God for what has been, ask forgiveness for what you regret, and entrust what’s coming. His faithfulness is greater than your year.", "q": ["What am I thankful for from this year?", "What do I want to entrust to God as the new year begins?"], "p": "Lord, your mercies are new every morning. Thank you for this year, and be with me in the next. Amen.", "k": "taught my heart", "se": "Christmas"},
    {"ref": "Psalm 23:1-3", "theme": "Provision", "r": "Sheep don’t have to work out where the grass is. The shepherd leads them. The psalm doesn’t promise every path will be easy, but it does say who is leading. When you feel anxious about what you’ll lack, remember you’re not the one in charge of provision. Let him lead you to rest, even for a few minutes today.", "q": ["What am I trying to provide for myself that I could ask my Shepherd for?", "Where do I need to be led to rest?"], "p": "Lord, you are my shepherd. Lead me today. Amen.", "k": "all manner of thing"},
    {"ref": "Proverbs 3:5-6", "theme": "Trust", "r": "Trust doesn’t mean switching off your mind. It means not making your own understanding the final authority. When a decision feels unclear, the call isn’t to figure it all out first but to acknowledge God in the step you’re taking. Direction usually comes one step at a time.", "q": ["Where am I leaning entirely on my own understanding?", "What is one step I can take and offer to God?"], "p": "Lord, I don’t see the whole road. Guide the step in front of me. Amen.", "k": "Man proposes"},
    {"ref": "Philippians 4:6-7", "theme": "Peace", "r": "Paul doesn’t say “never feel anxious.” He says what to do with anxiety: bring it to God, with thanksgiving. The promised peace doesn’t always come with answers. It comes as a guard around your heart and mind. Name what’s worrying you, thank him for something real, and hand the worry over once more.", "q": ["What is worrying me most right now?", "What can I honestly thank God for today?"], "p": "Father, I give you what I’m carrying. Guard my heart and mind with your peace. Amen.", "k": "Spirit of peace"},
    {"ref": "Isaiah 41:10", "theme": "Courage", "r": "God says “do not fear” because he is with you, not because the situation is safe. Notice the promises: I am with you, I will strengthen you, I will help you, I will uphold you. Fear shrinks when it’s set beside his presence. Whatever you face today, you’re not facing it without him.", "q": ["What am I afraid of today?", "How does knowing he is with me change how I face it?"], "p": "Lord, be my strength and my help today. Amen.", "k": "kindly Light"},
    {"ref": "Jeremiah 29:11-13", "theme": "Hope", "r": "These words were written to exiles who would spend decades in Babylon before anything changed. God’s plans for them were good, but they were long. Hope here isn’t about quick rescue. It’s about a God who is faithful over years. Seek him with your whole heart, and keep planting gardens where you are.", "q": ["Where am I waiting for something to change?", "How can I seek God wholeheartedly in the waiting?"], "p": "Lord, help me trust your long faithfulness when things move slowly. Amen.", "k": "all hearts be open"},
    {"ref": "Romans 8:28", "theme": "Purpose", "r": "The verse doesn’t say everything that happens is good. It says God works in all things for the good of those who love him. That’s a claim about the Worker, not about every event. Some things are simply sorrows. But nothing is wasted in his hands. Ask him to work good in the thing you wish hadn’t happened.", "q": ["What am I struggling to see any good in?", "What would it mean to trust him as the one who is working?"], "p": "Father, you can bring good out of what I can’t make sense of. I trust you with it. Amen.", "k": "shall not be overcome"},
    {"ref": "Matthew 6:33", "theme": "Priorities", "r": "Seek first the kingdom, and the rest follows after, not before. Most of us do the reverse: we deal with the urgent list and hope there’s room left for God. Try one small act of seeking first today, like a prayer before you check your messages, or a moment of thanks before the first meeting.", "q": ["What usually comes first in my day?", "What is one small way to put God first today?"], "p": "Lord, be first in my thoughts and my plans today. Amen.", "k": "work of God"},
    {"ref": "Psalm 46:10", "theme": "Stillness", "r": "“Be still” isn’t about finding a quiet room. It’s about ceasing to strive and remembering who God is. Try two minutes with no requests. Just sit and remember that he is God and you are not, which is more a relief than a rebuke.", "q": ["What am I striving to control right now?", "What would two minutes of silence with God look like?"], "p": "Lord, quiet my striving. Help me know that you are God. Amen.", "k": "silent and be"},
    {"ref": "Matthew 11:28-30", "theme": "Rest", "r": "Jesus invites the weary and burdened to come to him. His yoke isn’t the absence of work but work shared, and gentle. If you’re tired, this is an invitation and not a lecture. Come with the weariness you actually have, not the tidy version.", "q": ["Where am I most weary right now?", "What would it mean to take his yoke instead of my own?"], "p": "Jesus, I’m tired. Give me your rest. Amen.", "k": "restless"},
    {"ref": "1 Peter 5:6-7", "theme": "Worry", "r": "Humility and worry are linked. Worry often assumes we have to hold everything up ourselves. Peter says to cast our anxiety on God because he cares for us. Casting is a deliberate act. Name each worry, hand it to him, and then take the next small step.", "q": ["What worries am I holding that I could hand over?", "What is the next small step after I let go?"], "p": "Father, you care for me. I cast my worries on you. Amen.", "k": "kindly Light"},
    {"ref": "Galatians 5:22-23", "theme": "Character", "r": "Fruit grows slowly, and it can’t be manufactured by effort. The Spirit produces love, joy, peace, patience, kindness, goodness, faithfulness, gentleness and self-control in people who stay connected to him. Which fruit feels smallest in you right now? Ask for that one, and notice where it gets tested today.", "q": ["Which of these do I most need?", "Where will it be tested today?"], "p": "Holy Spirit, grow in me what I can’t grow on my own. Amen.", "k": "Love, and do what you will"},
    {"ref": "Colossians 3:23-24", "theme": "Work", "r": "Whatever you do, work at it as for the Lord. That includes the paperwork, the unseen tasks and the difficult people. The audience that matters most isn’t the one in the room. Offer this day’s work to him before you begin, and let that change how you do the small things.", "q": ["What task today feels too small or dull to matter?", "How would I do it if Christ were watching?"], "p": "Lord, receive my work today as an offering to you. Amen.", "k": "cake that is frying"},
    {"ref": "James 1:5", "theme": "Wisdom", "r": "James says to ask God for wisdom, and that he gives generously without scolding. Many of us hesitate because we think we should already know. Ask plainly about the decision in front of you, and then pay attention over the coming days to counsel, circumstances and Scripture.", "q": ["What decision do I need wisdom for?", "Who wise could I talk to about it?"], "p": "Father, I lack wisdom. Please give it generously. Amen.", "k": "Teach me to seek you"},
    {"ref": "Psalm 119:105", "theme": "Guidance", "r": "A lamp lights the next few steps, not the whole road. That’s frustrating if you want the map, but it’s how guidance usually works. Read a small passage of Scripture today and ask what one step it suggests. Take that step and see what the lamp shows next.", "q": ["What passage could I read today?", "What one step might it be asking of me?"], "p": "Lord, let your word light my next step. Amen.", "k": "Ignorance of Scripture"},
    {"ref": "Hebrews 11:1", "theme": "Faith", "r": "Faith isn’t a feeling of certainty. It’s confidence in what God has promised even though it isn’t yet visible. The people in Hebrews 11 mostly didn’t see the promise fulfilled in their lifetime. Faith is a long obedience, not a single leap. What have you been asked to keep doing, unseen?", "q": ["What am I hoping for that I can’t yet see?", "What faithful thing can I keep doing today?"], "p": "Lord, increase my faith to trust what I can’t see. Amen.", "k": "to believe what you do not see"},
    {"ref": "2 Corinthians 12:9", "theme": "Grace", "r": "Paul asked three times for a weakness to be taken away. The answer wasn’t removal but grace, with power made perfect in weakness. That doesn’t make weakness good, but it means God can work through the parts we’d hide. Where are you weak today? Ask for his grace there, and not only for its removal.", "q": ["Where do I feel weak today?", "How might God’s grace be enough there?"], "p": "Lord, in my weakness, be my strength. Amen.", "k": "poor as I am"},
    {"ref": "Psalm 27:1", "theme": "Fear", "r": "Light, salvation, stronghold: the psalmist stacks three names for God against fear. Fear doesn’t vanish, but it gets a rival. What are you afraid of today? Say it aloud, then say the verse. Notice which one feels bigger.", "q": ["What fear keeps coming back to me?", "Which of God’s names do I most need today?"], "p": "Lord, you are my light and my stronghold. Whom shall I fear? Amen.", "k": ""},
    {"ref": "Micah 6:8", "theme": "Justice", "r": "Do justice, love mercy, walk humbly. It’s a short list and it isn’t about being impressive. Justice looks like fairness in ordinary dealings, mercy like patience with failure, humility like staying near God. Which of the three is hardest for you right now?", "q": ["Which of the three do I most need to practice?", "Who could I treat more fairly or more gently today?"], "p": "Lord, teach me to act justly, love mercy and walk humbly with you. Amen.", "k": "steal from them"},
    {"ref": "1 Thessalonians 5:16-18", "theme": "Gratitude", "r": "Rejoice always, pray continually, give thanks in everything. Paul isn’t asking for fake cheer. He’s describing a way of living turned toward God. Thanks in all circumstances, not for all circumstances. Find one thing today, however small, that you can honestly thank him for.", "q": ["What is one small thing I can thank God for right now?", "What makes it hard to give thanks today?"], "p": "Lord, turn my heart toward gratitude today. Amen.", "k": "bright and beautiful"},
    {"ref": "Romans 5:8", "theme": "Love", "r": "God didn’t wait for us to be presentable. While we were still sinners, Christ died for us. Love that waits for us to deserve it isn’t what the gospel describes. Let that settle before you start trying to earn anything today.", "q": ["Where do I feel I have to earn love?", "What would it be like to simply receive his?"], "p": "Jesus, thank you for loving me before I deserved it. Amen.", "k": "measure of love"},
    {"ref": "Psalm 37:4-5", "theme": "Delight", "r": "Delight in the Lord, and commit your way to him. Both verbs are about relationship, not technique. When your delight is in him, your desires slowly change shape. What have you been trying to control that you could commit to him?", "q": ["What gives me delight in God?", "What am I gripping that I can commit to him?"], "p": "Lord, be my delight. I commit my way to you. Amen.", "k": ""},
    {"ref": "Proverbs 16:3", "theme": "Plans", "r": "Commit your work to the Lord, and your plans will be established. Making plans isn’t unspiritual. Presenting them to God is. Write down what you hope to do this week and hold it out open-handed.", "q": ["What am I planning that I haven’t prayed about?", "What would holding it open-handed look like?"], "p": "Lord, I commit my work and plans to you. Amen.", "k": "definite service"},
    {"ref": "John 14:27", "theme": "Peace", "r": "Jesus leaves his peace, and it isn’t the world’s kind, which depends on circumstances. His peace is a gift given before the crisis resolves. Take one anxious thought today and answer it with this: he has already given you peace, and you may receive it.", "q": ["What is disturbing my peace today?", "How can I receive the peace he has already given?"], "p": "Lord Jesus, give me your peace, and calm my troubled heart. Amen.", "k": "Let nothing disturb"},
    {"ref": "John 15:5", "theme": "Abiding", "r": "Branches don’t strain to produce fruit. They stay attached. Abiding is unglamorous: time with Jesus, obedience, staying near. Apart from him, you can do nothing. What has been pulling you away from the vine this week?", "q": ["What pulls me away from staying close to Jesus?", "What is one way to abide today?"], "p": "Jesus, keep me close to you. Bear your fruit in me. Amen.", "k": "soul happy in the Lord"},
    {"ref": "Psalm 139:13-14", "theme": "Worth", "r": "You were knit together on purpose. That applies to the body you sometimes criticize and the mind you sometimes doubt. Worth isn’t earned. It’s given by the one who made you. Thank him today for one thing about how you’re made.", "q": ["What do I criticize most about myself?", "What can I thank God for in how I’m made?"], "p": "Lord, thank you for making me. Help me see myself as you do. Amen.", "k": "glory of God is a living human"},
    {"ref": "Psalm 51:10-12", "theme": "Renewal", "r": "David prays this after his worst failure. Notice what he asks for: a clean heart, a steadfast spirit, God’s presence, restored joy. Confession isn’t only about the past. It’s a request to be made new. Bring what you’re ashamed of, and ask for a fresh start.", "q": ["What do I need to bring to God honestly?", "What would a fresh start look like?"], "p": "Create in me a clean heart, O God, and renew a steadfast spirit within me. Amen.", "k": "hatest nothing"},
    {"ref": "Matthew 7:7-8", "theme": "Asking", "r": "Ask, seek, knock: the verbs are continuous, so keep asking. God isn’t irritated by persistence. It may reveal what you really want, or change what you ask for. What have you stopped praying about because it seemed pointless? Start again.", "q": ["What have I stopped asking God for?", "What would persistent asking look like this week?"], "p": "Father, I keep asking, seeking and knocking. Thank you for hearing. Amen.", "k": "heart without words"},
    {"ref": "Psalm 62:5-8", "theme": "Pouring out", "r": "Wait in silence for God alone, but also pour out your heart to him. Both are true. The silence isn’t empty and the pouring isn’t rude. Today, don’t edit yourself in prayer. Tell him what’s actually there.", "q": ["What am I holding back from God?", "What would it be like to pour it all out?"], "p": "God, you are my refuge. I pour out my heart to you. Amen.", "k": "surge of the heart"},
    {"ref": "Isaiah 43:2", "theme": "Presence", "r": "God doesn’t promise to keep you out of the waters or the fire. He promises to be with you in them. That’s a different kind of safety. Where do you feel you’re in deep water right now? Picture him beside you there, and ask him for what you need to keep going.", "q": ["Where do I feel like I’m in deep water?", "What would it mean to know he is with me in it?"], "p": "Lord, be with me in the waters I can’t avoid. Amen.", "k": ""},
    {"ref": "Romans 15:13", "theme": "Hope", "r": "Hope here is something God gives, and it overflows by the power of the Spirit. It isn’t optimism about how things will turn out. It’s joy and peace in believing. If you feel dry, ask for it directly, and don’t wait until you feel hopeful before you ask.", "q": ["Where is hope running low in me?", "What would it mean to ask for hope as a gift?"], "p": "God of hope, fill me with joy and peace as I trust you. Amen.", "k": "Love divine"},
    {"ref": "Psalm 90:12", "theme": "Time", "r": "Number your days, and teach us to. It isn’t morbid, it’s clarifying: your time is limited, so the question is what to give it to. Today is one of your days. What is the one thing you want to have done well by tonight?", "q": ["What is the one thing that matters most today?", "What could I let go of to make room for it?"], "p": "Lord, teach me to number my days and gain a heart of wisdom. Amen.", "k": "dying man to dying men"},
    {"ref": "Galatians 6:9", "theme": "Perseverance", "r": "Don’t grow weary in doing good, for the harvest comes in due time. Notice “in due time.” The delay is part of the design. If you’ve been faithful in something that isn’t bearing visible fruit, keep on. It isn’t wasted.", "q": ["What good work am I tempted to give up on?", "What might a harvest look like in due time?"], "p": "Lord, keep me from growing weary in doing good. Amen.", "k": "live with all my might"},
    {"ref": "Hebrews 4:15-16", "theme": "Mercy", "r": "Jesus knows weakness from the inside, so you don’t need to approach him with a polished version of yourself. The throne is called a throne of grace. Come boldly with your actual failures, and receive mercy and help at the moment you need it.", "q": ["What do I hesitate to bring to God?", "What help do I need from him right now?"], "p": "Jesus, I come with my need. Give me mercy and grace to help. Amen.", "k": "Love bade me welcome"},
    {"ref": "Psalm 16:8", "theme": "Steadiness", "r": "I keep the Lord always before me, and because he is at my right hand, I will not be shaken. Steadiness comes from where you fix your attention. Try starting your next three tasks with one breath of awareness that he is with you.", "q": ["What tends to shake me during the day?", "How could I remember his presence before each task?"], "p": "Lord, keep my eyes on you so that I am not shaken. Amen.", "k": "trivial round"},
    {"ref": "Psalm 30:5", "theme": "Joy", "r": "Weeping may last for the night, but joy comes with the morning. Nights are real, and the verse doesn’t hurry them. But it says they end. If you’re in a night, hold on to the possibility of morning. If you’re in the morning, remember someone who isn’t.", "q": ["Am I in a night or a morning right now?", "Who could I pray for who is in a long night?"], "p": "Lord, bring joy in the morning, and be near to those who weep. Amen.", "k": ""},
    {"ref": "Nehemiah 8:10", "theme": "Joy", "r": "The joy of the Lord is your strength. This was said to people weeping as they heard the law read, and they were told to eat, drink and share with those who had nothing. Joy here is communal and practical. Who could you share something with today?", "q": ["What is one practical way to share joy today?", "Who could use a meal, a message or a gift?"], "p": "Lord, let your joy be my strength, and let me share it. Amen.", "k": "coat in your closet"},
    {"ref": "Psalm 91:1-2", "theme": "Shelter", "r": "To dwell in the shelter of the Most High is a picture of staying, not visiting. Shelter isn’t escape from all harm. It’s a place to live in the middle of it. Make your home there today by returning to him whenever your mind drifts.", "q": ["When does my mind drift from God today?", "How could I return to him in those moments?"], "p": "Lord, you are my refuge and my fortress. I trust in you. Amen.", "k": "Christ be with me"},
    {"ref": "Romans 8:38-39", "theme": "Love", "r": "Neither death nor life, nor anything else in all creation, can separate us from the love of God in Christ Jesus. The list is comprehensive on purpose. On the days you feel far from him, the distance isn’t on his side.", "q": ["What makes me feel far from God’s love?", "How does this verse answer that feeling?"], "p": "Lord, thank you that nothing can separate me from your love. Amen.", "k": "not my own"},
    {"ref": "Ephesians 3:20-21", "theme": "Power", "r": "God is able to do far more than we ask or imagine, according to the power at work in us. Sometimes we pray small because we’ve been disappointed. Ask for something larger than usual today, and leave the outcome to him.", "q": ["What have I stopped asking for because I was disappointed?", "What bigger request could I bring to God today?"], "p": "Father, you can do more than I ask or imagine. Work in me and through me. Amen.", "k": "Give what you command"},
    {"ref": "James 4:8", "theme": "Nearness", "r": "Draw near to God and he will draw near to you. The first step is small and it’s yours: a prayer, a page of Scripture, a moment of silence. He isn’t hard to find. What would drawing near look like in the next ten minutes?", "q": ["What small step could I take toward God today?", "What keeps me from taking it?"], "p": "Lord, I draw near to you. Draw near to me. Amen.", "k": "ear of your heart"},
    {"ref": "Psalm 103:8-12", "theme": "Forgiveness", "r": "As far as the east is from the west, so far has he removed our transgressions from us. He doesn’t treat us as our sins deserve. If you’re carrying something God has forgiven, you may need to put it down. Ask him to help you believe you’re forgiven.", "q": ["What am I still carrying that God has forgiven?", "What would it mean to believe I’m forgiven?"], "p": "Lord, you are merciful and gracious. Help me receive your forgiveness. Amen.", "k": "Lighten our darkness"},
    {"ref": "1 Corinthians 13:4-7", "theme": "Love", "r": "Read this as a description of how God loves you before you read it as a to-do list for loving others. Patient, kind, not keeping a record of wrongs. Then pick one phrase to practice today with someone who is difficult.", "q": ["Which phrase do I find hardest to live out?", "Who could I practice it with today?"], "p": "Lord, love me with your patience and teach me to love like you. Amen.", "k": "Love feels no burden"},
    {"ref": "Psalm 73:26", "theme": "Strength", "r": "My flesh and my heart may fail, but God is the strength of my heart and my portion forever. This psalm begins in envy and confusion and ends here. Honest wrestling can lead to a firmer faith. What are you wrestling with that you can bring to him?", "q": ["What am I wrestling with?", "How can I bring it honestly to God?"], "p": "Lord, when my strength fails, be the strength of my heart. Amen.", "k": "reasons which reason does not know"},
    {"ref": "Matthew 5:3-6", "theme": "Blessing", "r": "The Beatitudes turn our assumptions upside down: blessed are the poor in spirit, those who mourn, the meek, those who hunger for righteousness. They aren’t goals to achieve but descriptions of people God is near to. Which line do you find yourself in today?", "q": ["Which of these describes me right now?", "How does it feel to hear I’m blessed there?"], "p": "Lord, thank you for being near to the humble and the hungry. Amen.", "k": "poor as I am"},
    {"ref": "Luke 10:38-42", "theme": "Attention", "r": "Martha was doing good things but was distracted and worried. Jesus doesn’t scold the serving. He points to the one thing needed, which is sitting at his feet. Where is busyness crowding out attention today? Take five minutes to sit before you serve.", "q": ["Where am I distracted by many things?", "What would it look like to sit at his feet for five minutes?"], "p": "Lord, quiet my busyness. Help me choose the one thing needed. Amen.", "k": "ear of your heart"},
    {"ref": "Mark 1:35", "theme": "Solitude", "r": "Even the busiest person in history got up early to pray in a solitary place. If Jesus needed it, we do too. Find a few minutes today that could be yours and his, even if it isn’t early and the place isn’t quiet.", "q": ["When could I find a few minutes alone with God today?", "What might I say or hear in that time?"], "p": "Lord, help me make room to be alone with you. Amen.", "k": "your cell will teach"},
    {"ref": "Psalm 42:1-2", "theme": "Thirst", "r": "A deer pants for streams of water, and the soul pants for God. Thirst is a gift that tells you what you’re made for. What have you been drinking to quench something that only he can satisfy?", "q": ["What am I using to fill a thirst only God can satisfy?", "What would it mean to come to him for it?"], "p": "Lord, my soul thirsts for you. Satisfy me. Amen.", "k": ""},
    {"ref": "John 10:11", "theme": "Shepherd", "r": "The good shepherd lays down his life for the sheep. Notice the shape of it: not just guards them, but gives himself. That’s the measure of how you’re loved. When you doubt your worth, look at what was paid.", "q": ["When do I doubt that I’m loved?", "What does it mean that he gave his life for me?"], "p": "Good Shepherd, thank you for laying down your life for me. Amen.", "k": ""},
    {"ref": "Romans 12:1-2", "theme": "Offering", "r": "Offer your bodies as a living sacrifice. It’s a physical, daily offering, not just a mental one. And don’t be conformed to this world. Be transformed by the renewing of your mind. What does offering your body look like in a day of ordinary tasks?", "q": ["What would it mean to offer today’s tasks to God?", "What pattern of the world do I need to resist?"], "p": "Lord, I offer you my body, my mind and my day. Amen.", "k": "liberty, my memory"},
    {"ref": "Psalm 139:23-24", "theme": "Examine", "r": "Search me, God, and know my heart. It’s a bold prayer, and a safe one, because the one searching loves you. Ask him to show you anything hurtful in you, and to lead you in the way everlasting. Then be quiet and listen.", "q": ["What might God want to show me about myself?", "How can I listen for it today?"], "p": "Search me, O God, and lead me in the way everlasting. Amen.", "k": "all hearts be open"},
    {"ref": "Isaiah 55:8-9", "theme": "Mystery", "r": "His thoughts aren’t ours, and his ways aren’t ours. That can sound distant, but it’s also comfort: God isn’t limited to our imagination or our analysis. When something doesn’t make sense, you don’t have to force an explanation. You can trust the one who sees more.", "q": ["What am I trying to explain that I could simply entrust to God?", "How does his greater wisdom comfort me?"], "p": "Lord, your ways are higher than mine. I trust you. Amen.", "k": "If you comprehend it"},
    {"ref": "1 Corinthians 15:58", "theme": "Steadfast", "r": "Because of the resurrection, your labor in the Lord isn’t in vain. That’s Paul’s conclusion after a long argument. Nothing done for him is wasted. Stand firm in the task you’ve been given, and let the resurrection frame it.", "q": ["What work do I sometimes feel is wasted?", "How does the resurrection change how I see it?"], "p": "Lord, keep me steadfast, knowing my labor in you is not in vain. Amen.", "k": "become all flame"},
    {"ref": "Matthew 5:14-16", "theme": "Light", "r": "You are the light of the world. Not “you should try to be,” but “you are.” A lamp doesn’t announce itself, it just shines. Let the good you do today be visible enough that someone might praise the Father.", "q": ["Where can my life point someone to God today?", "What good could I do quietly?"], "p": "Father, let my life shine so that others glorify you. Amen.", "k": "trivial round"},
    {"ref": "Psalm 19:1-2", "theme": "Creation", "r": "The heavens declare the glory of God, day after day. Creation is speaking constantly, and we rarely listen. Step outside today for a minute. Look at something you didn’t make, and let it point you to the one who did.", "q": ["What in creation lifts my heart to God?", "When could I step outside for a minute today?"], "p": "Lord, the heavens declare your glory. Open my eyes to see it. Amen.", "k": ""},
    {"ref": "Psalm 121:1-2", "theme": "Help", "r": "Where does my help come from? It comes from the Lord, who made heaven and earth. The one who keeps you doesn’t slumber. Tonight you can sleep because someone else is awake. Hand over what you can’t solve, and rest.", "q": ["What problem am I trying to solve alone?", "What would it mean to hand it to the one who never sleeps?"], "p": "Lord, my help comes from you. Keep me and mine. Amen.", "k": ""},
    {"ref": "John 14:1-3", "theme": "Home", "r": "Do not let your hearts be troubled. Jesus says this on the night before his arrest, and then he promises to prepare a place for us. Troubled hearts are often asking, where will I end up? He says he’s preparing a home and will return. Take comfort that your story ends with him.", "q": ["What is troubling my heart today?", "What does it mean that he is preparing a place for me?"], "p": "Lord Jesus, you are preparing a home for me. Calm my heart. Amen.", "k": "chief end"}

    return h;
