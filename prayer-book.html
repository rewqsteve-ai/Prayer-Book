      "r": "\"Then Herod, when he saw that he was deceived by the wise men, was exceedingly angry, and he sent forth and put to death all the male children who were in Bethlehem and in all its districts, from two years old and under.\" Two days after Christmas, the church remembers these Holy Innocents, the children slaughtered by Herod's jealous rage in his attempt to eliminate the newborn king he perceived as a threat to his own throne.\n\nThis is a difficult passage to sit with, particularly so close to the tenderness of Christmas itself. The same birth that brought angels singing and shepherds rejoicing also, almost immediately, brought violent grief to the mothers of Bethlehem, whose children were slaughtered simply because they happened to be the right age in the wrong town at the wrong historical moment.\n\nConsider what this juxtaposition teaches about the world Christ actually entered. He was not born into a sentimental, protected scene untouched by real evil, but into a world that responded to his very arrival with jealous, murderous violence, a world where innocent children could be slaughtered by a paranoid ruler's command. Christmas does not promise an escape from such a world; it promises, rather, that God himself has entered directly into it, experiencing its dangers and griefs from the inside.\n\nIf you are grieving tonight, perhaps for a child lost, or for any innocent suffering that seems to make a mockery of the season's supposed joy, know that this grief has a genuine place within the Christmas story itself, not excluded from it but woven into its very beginning. Pray tonight for parents presently grieving children, for refugees fleeing violence as Christ's own family soon would, and trust that the same God who entered this dangerous world at Bethlehem has not grown distant from its ongoing sorrows now."
    },
    "12-29": {
      "ref": "Luke 2:36-38",
      "r": "\"Now there was one, Anna, a prophetess... She did not depart from the temple, but served God with fastings and prayers night and day. And coming in that instant she gave thanks to the Lord, and spoke of Him to all those who looked for redemption in Jerusalem.\" Anna appears only briefly in the Gospel accounts, an elderly widow who had spent decades in the temple, fasting and praying continuously, waiting for a redemption she would not live to see completed in any ordinary timeframe.\n\nConsider the sheer length of her waiting. Having been widowed after only seven years of marriage, she had then spent, by the text's own reckoning, something like eighty-four years as a widow devoted entirely to prayer and fasting in the temple. This was not a brief season of waiting but the greater part of an entire lifetime, spent faithfully in anticipation of a redemption that remained, for most of those decades, entirely unrealized.\n\nAnd yet, when that redemption finally did arrive, in the form of an infant brought to the temple for the ordinary rite of presentation, Anna recognized it immediately, and responded not with quiet private satisfaction but with immediate public testimony, speaking of this child to everyone who shared her own long-held hope for Jerusalem's redemption.\n\nAs this Christmas season moves toward its conclusion, consider Anna's example of long, faithful waiting rewarded, in her case, only at the very end of an exceptionally long life. If your own waiting for some promised redemption has stretched far longer than you expected, let Anna's eighty-four years encourage you rather than discourage you. The redemption she waited for came, eventually, precisely on schedule by God's own reckoning, and her response, immediate testimony once it finally arrived, models exactly how your own long-delayed answer, whenever it finally comes, might best be received and shared."
    },
    "12-30": {
      "ref": "Psalm 90:12",
      "r": "\"So teach us to number our days, that we may gain a heart of wisdom.\" As this calendar year draws to its final days, this ancient prayer of Moses takes on particular weight. He does not ask merely for more days, nor for an easier accounting of time, but specifically for the wisdom that comes from numbering days rightly, recognizing their limited, finite nature rather than treating them as though they stretched out endlessly before us.\n\nConsider what it means to number days rightly. It is not morbid dwelling on mortality for its own sake, but a clear-eyed recognition that time is genuinely limited, that this particular year, now nearly finished, will not come again, that whatever was done or left undone within it belongs now to a chapter that is closing rather than one still open for revision.\n\nThis numbering, rightly done, produces not despair but wisdom, a heart that makes better use of whatever days remain precisely because it has stopped assuming an unlimited supply of them. The person who has genuinely reckoned with their own mortality tends to spend their remaining time rather differently than one who has pushed that reckoning indefinitely into some distant, unexamined future.\n\nAs you reflect tonight on the year now drawing to its close, consider what it might mean to number these particular days rightly, this specific year, with its specific joys and sorrows, successes and failures, now essentially complete. What wisdom might this numbering produce for how you spend the days still remaining to you, whether the final days of this year or the great unknown number still to come? Ask, with Moses, for exactly this teaching tonight: not merely more days, but a heart made wise by rightly numbering the ones already given."
    },
    "12-31": {
      "ref": "Lamentations 3:22-23",
      "r": "\"Through the Lord's mercies we are not consumed, because His compassions fail not. They are new every morning; great is Your faithfulness.\" On this final night of the calendar year, these words offer a fitting place to rest. Written from the very heart of a book otherwise devoted to grief and devastation, they insist that whatever has been lost, whatever wreckage the year now ending has left behind, God's mercies have not, in fact, failed across any of it.\n\nNotice the specific claim: not simply that mercy exists somewhere in general, but that it is new every morning, a fresh supply given daily rather than a single store that might eventually run dry through overuse. Whatever mercy carried you through January of this year was not the same, exhausted supply still being stretched thin by December; it was renewed, freshly given, morning after morning, throughout the entire year now closing.\n\nConsider, too, the word \"great\" attached to his faithfulness, not merely adequate or sufficient, but great, expansive, more than matching whatever the year has actually required of it. Whatever this particular year held, joys worth remembering and sorrows worth grieving honestly, his faithfulness has proven itself great enough to meet every single day of it.\n\nAs this year ends and a new one begins, give thanks tonight for whatever specific mercies carried you through these past months, and trust that the same faithfulness that proved great across this entire year will prove equally great, equally fresh each morning, across whatever the coming year holds. Whatever remains unresolved as this year closes, whatever hopes remain unfulfilled, rest in a faithfulness that has never yet failed, not once across this whole year now ending, and that promises, with the same steady reliability, to meet you fresh again tomorrow morning, and on every morning still to come."
    }
  };
  function prayDay() {
    var n = new Date(), h = n.getHours();
    if (h < 4) { var d = new Date(n); d.setDate(d.getDate() - 1); return dkey(d); }
    return dkey(n);
  }
  function todaysEvening() { return EVENING[prayDay().slice(5)] || null; }
  function currentPart() {
    if (ui.partManual) return ui.part;
    var h = new Date().getHours();
    return (h >= 17 || h < 4) ? 'evening' : 'morning';

  function partTabs(part) {

      "main": "Antony was not the first hermit, but he became the most famous, and soon others followed him into the wilderness, first as scattered individuals, then as loose communities of huts clustered within walking distance of one another. These were the first monks, from the Greek monos, meaning alone. They came for different reasons: some fled the growing comfort and compromise of a now-legal, fashionable Christianity; some wanted to take Jesus's hardest sayings about renunciation with total literalness; some simply craved an arena fierce enough to test whether their faith was real.\n\nWhat they left behind was a remarkable body of short, blunt sayings, later collected as the Sayings of the Desert Fathers. Abba Moses, a former bandit, told a disciple to go sit in his cell, because the cell would teach him everything. Abba Poemen was once asked what to do about anger and gave an answer with no trace of sentimentality: distrust yourself until your last breath. These were not academic theologians. They were, in their own rough and sometimes strange way, spiritual physicians, diagnosing the soul's real diseases: pride, distraction, the endless hunger for human approval.",

      "main": "Constantine and Licinius, meeting in Milan, agreed to a policy of religious toleration across the Roman Empire, restoring confiscated church property and, crucially, granting Christians, along with everyone else, the legal right to worship according to their own conscience. It was not, strictly speaking, an establishment of Christianity as the state religion, that would come later under Theodosius, but it ended the era in which being a Christian was itself a capital crime.\n\nThe change in circumstance was dramatic and, in some ways, dangerous for the church's own health. Congregations that had met in catacombs and private homes could now build public buildings. Bishops who had once risked execution found themselves, within a generation, advising emperors. Constantine's own conversion, whether fully sincere or partly political, brought imperial patronage, funding for church construction, and eventually imperial involvement in theological disputes, as seen just twelve years later at the Council of Nicaea, which Constantine himself summoned and funded.\n\nMany church historians see the Edict of Milan as a genuine mercy, ending real bloodshed, and simultaneously as the opening of a door to a different kind of danger: a church tempted by comfort, political entanglement, and the loss of the costly clarity persecution had once enforced. Both things were true at once.",

      "title": "The Great Schism of 1054",

      "era": "1054 AD",
      "mins": "4 min read",
      "intro": "On a July afternoon in 1054, a cardinal from Rome named Humbert walked into the Hagia Sophia in Constantinople during the Saturday liturgy and laid a document on the altar excommunicating the Patriarch of Constantinople. Days later, the Patriarch convened his own council and excommunicated the cardinal right back. Neither man, by most accounts, intended to split the church in two permanently. Both believed they were defending the faith. The rupture nonetheless lasted, in practical terms, for most of the next thousand years.",
      "main": "The dramatic exchange of excommunications was less a sudden event than a final spark landing on long-accumulated kindling. East and West had been drifting apart for centuries: different languages, Greek in the East and Latin in the West, which made careful theological conversation increasingly difficult; different political histories, as the Western Roman Empire collapsed while the Eastern Empire continued in Constantinople for another thousand years; and specific theological disputes, especially over a phrase quietly added to the Nicene Creed in the West describing the Holy Spirit as proceeding from the Father “and the Son,” which Eastern churches saw as an unauthorized alteration of an ecumenical council's wording, and over the nature and extent of the Pope's authority over the universal church, which Rome was increasingly asserting and the East was increasingly resisting.\n\nThe 1054 excommunications themselves were later technically lifted, in a joint declaration by Pope Paul VI and Patriarch Athenagoras in 1965. But by then the churches had developed along genuinely separate paths for nine centuries: distinct liturgies, different approaches to papal authority, different emphases in theology and spirituality, Eastern Orthodoxy's rich tradition of icons and the Jesus Prayer standing alongside, and sometimes in real tension with, the Western church's later scholastic theology and eventual Reformation.",
      "why": "The Great Schism is a sobering reminder that genuine, Spirit-filled believers can divide over real and not merely petty issues, and that division, once it sets, has a long half-life. It is also a reminder that reconciliation, however partial, remains possible even after nine hundred years, which should give any of us pause before assuming our own, much younger disagreements are too old to heal.",
      "reflect": [
        "Is there a long-standing division, in a church or a family, that you have assumed is simply permanent?",
        "What would it take for you to be the first to extend an olive branch across an old rift?"
      ]
    },
    {
      "id": "francis-assisi",
      "title": "Francis of Assisi and the Kiss of the Leper",
      "kind": "Person",
      "era": "13th century",
      "mins": "4 min read",
      "intro": "Before he was a saint, Francesco di Bernardone was, by his own later account, a vain and pleasure-loving young man, the son of a wealthy cloth merchant in the Italian town of Assisi, more interested in fine clothes and troubadour songs than in religion. A failed military campaign, a year as a prisoner of war, and a long illness afterward left him restless and dissatisfied with the life he had been living, though he could not yet say what should replace it.",
      "main": "The turning point Francis himself identified was an encounter with a leper. Lepers in medieval Italy were among the most feared and avoided people in society, considered walking symbols of divine punishment, kept at a physical distance by law and by instinct alike. Francis had always felt a particular horror of them. One day, riding along a road, he came upon a leper suddenly and found himself, almost before he had decided to, dismounting, embracing the man, and kissing his disfigured hand. He later wrote that what had been bitter to him turned, in that moment, into sweetness of soul and body, and that from then on, what he had once found unbearable now seemed easy.\n\nFrom there, Francis began stripping away everything that marked him as the wealthy merchant's son he had been, eventually tearing off his clothes in the town square in front of his own father and the local bishop and renouncing his inheritance entirely. He took to literally rebuilding a ruined chapel stone by stone, which he initially understood as a literal command from God, before gradually realizing the real building project was the church itself, worn down by wealth, politics, and institutional comfort. Followers gathered around him, drawn by his insistence on absolute poverty, joyful simplicity, and care for the poor and the sick, and the movement became the Franciscan order, one of the largest and most influential in Christian history.",
      "why": "Francis never set out to found an institution; he set out to follow Christ as literally as he knew how, starting with the person he found hardest to love. Eight centuries later, a sitting pope chose his name for the first time in history, a reminder that the kiss given to one feared stranger on a dusty road still echoes.",
      "reflect": [
        "Who is the “leper” in your own life, the person or group you instinctively avoid?",
        "What would it cost you to move toward them, even in some small way, this week?"
      ]
    },
    {
      "id": "julian-norwich",
      "title": "Julian of Norwich and the Showings",
      "kind": "Person",
      "era": "14th century",
      "mins": "4 min read",
      "intro": "In May 1373, a thirty-year-old Englishwoman lay dying. A priest was called to her bedside to perform last rites, and he held a crucifix before her eyes as her sight began to fail. Then, unexpectedly, she recovered, and over the following hours she experienced a series of sixteen visions, or “showings,” centered on the suffering and love of Christ. She would spend the next twenty years writing and rewriting her reflections on what she had seen, producing what became the first surviving book written in English by a woman: Revelations of Divine Love.",
      "main": "We do not even know her birth name. She took the name Julian from the church of St. Julian in Norwich, where she later lived as an anchoress, a woman voluntarily enclosed for life in a small cell attached to the church wall, devoted to prayer and spiritual counsel through a single window opening onto the street. Medieval England was no stranger to plague, war, and religious anxiety, and Julian wrote in the shadow of all three. Her own era was not calm or safe; it was marked by repeated waves of the Black Death, peasant uprisings, and a church often more focused on fear of judgment than assurance of love.\n\nAgainst that backdrop, her writing is strikingly, almost startlingly tender. She describes seeing all of creation held in God's hand like a small hazelnut, so small it seemed it might simply fall apart, and understanding that it continues to exist for one reason only: because God loves it. Her most famous line, now printed on mugs and greeting cards with little sense of its original context, comes from a vision in which Christ assures her that despite all the sin and sorrow in the world, “all shall be well, and all shall be well, and all manner of thing shall be well.” She did not mean this as shallow optimism; she wrote it from a sickbed, in an era of mass death, having stared directly at a crucifix while expecting to die herself.",
      "why": "Julian's theology of God's motherly tenderness, alongside his fatherly authority, and her insistence that God is never angry at the soul he loves, however countercultural it sounded in her own fearful age, has made her one of the most quietly influential mystics in Christian history, still read, still comforting, nearly 650 years later.",
      "reflect": [
        "Where in your life right now do you most need to hear “all shall be well”, not as denial, but as trust?",
        "Julian wrote from a sickbed in a plague-stricken century. What has your own hardest season taught you about God that comfort never could?"
      ]
    },
    {
      "id": "catherine-siena",
      "title": "Catherine of Siena and the Avignon Papacy",
      "kind": "Person",
      "era": "14th century",
      "mins": "4 min read",
      "intro": "For nearly seventy years in the 14th century, the pope did not live in Rome. A series of French-influenced popes had relocated the papal court to Avignon, in southern France, a period later critics would call the church's Babylonian Captivity, echoing Israel's own exile centuries earlier. Into this political and spiritual mess stepped an unlikely figure: a Dominican laywoman from Siena who had never held any formal church office and could not read until adulthood.",
      "main": "Catherine of Siena experienced intense mystical visions from childhood and, against her family's wishes, devoted herself entirely to prayer, service to the sick and poor, and eventually an extraordinary public ministry of letters and direct counsel to popes, cardinals, and kings. What makes her remarkable is not simply her spirituality but her boldness: she wrote directly to Pope Gregory XI, urging him, as a laywoman addressing the most powerful churchman in Christendom, to return the papacy to Rome, calling him in one letter to be a courageous man rather than a coward.\n\nGregory eventually did return to Rome in 1377, and while historians debate exactly how much credit belongs to Catherine's persistent urging among many other political pressures, she was present in Rome herself, actively engaged in church affairs, when the move finally happened. She continued working for church unity until her death at only thirty-three, having dictated hundreds of letters and a major theological work, The Dialogue, despite her limited formal education.\n\nShe was canonized in 1461 and, remarkably for a woman in a deeply male-dominated institutional church, was declared a Doctor of the Church in 1970, one of only a small handful of women to hold that title, placing her theological writing alongside figures like Augustine and Aquinas.",
      "why": "Catherine's story complicates any assumption that institutional reform only ever comes from within institutional power structures. A laywoman with no formal authority reshaped the direction of the papacy itself, through nothing but conviction, prayer, and an unwillingness to stay silent in the face of what she saw as clear spiritual failure.",
      "reflect": [

    {
      "id": "printing-press",
      "title": "The Printing Press and the Reformation",
      "kind": "Event",
      "era": "15th century",
      "mins": "4 min read",
      "intro": "Around 1450, a German goldsmith named Johannes Gutenberg perfected a technology that had existed in various forms elsewhere but never quite like this: movable metal type, combined with an oil-based ink and a modified wine press, capable of producing books far faster and far cheaper than any scribe copying by hand ever could. His first major product, completed around 1455, was a Latin Bible. Within a few decades, printing presses had spread across Europe, and the cost of a book had dropped by a factor of more than a hundred.",
      "main": "The effect on the church was seismic, though not immediately obvious. Before printing, a hand-copied Bible could take a scribe the better part of a year to produce and cost roughly the equivalent of a laborer's wages for several years, putting Scripture almost entirely out of reach for ordinary people and concentrating religious authority heavily in the hands of clergy who alone had regular access to the text. Printing changed the arithmetic entirely. By the early 1500s, pamphlets, translated Scripture portions, and theological tracts could be produced by the thousands and distributed across the continent within weeks.\n\nMartin Luther understood this almost instinctively. His Ninety-Five Theses, nailed to a church door in Wittenberg in 1517 as an invitation to academic debate, were translated from Latin into German and printed within two weeks, circulating across the Holy Roman Empire far faster than any single preacher could have traveled. Luther became, by some estimates, the best-selling author in Europe for the first decades of the 1500s, and the Reformation he helped spark spread at a pace that would have been simply impossible a century earlier, when ideas moved only as fast as a traveler on horseback and a scribe's slow pen.",
      "why": "It is worth pausing on this: the Reformation's core conviction, that ordinary believers should read Scripture for themselves rather than relying entirely on clergy to mediate it, was itself made practically possible by a new printing technology. The medium and the message arrived together, and neither would have reshaped Europe quite the same way alone.",
      "reflect": [
        "How do you access Scripture, and how easily do you take that access for granted?",
        "What technology has most changed how your own generation encounters faith, for better or worse?"
      ]
    },

      "era": "1521",

      "intro": "In April 1521, a German monk and university professor stood before the most powerful political and religious authorities in Europe: the twenty-one-year-old Holy Roman Emperor Charles V, assorted princes, archbishops, and papal representatives, gathered in the city of Worms for an imperial assembly, or diet. On a table before him sat a stack of his own books. He was asked a single, simple question: would he recant what he had written?",

      "why": "Luther left Worms under his safe conduct but was declared an outlaw within weeks, his books ordered burned, his person liable to be killed by anyone without legal consequence. He survived only because a sympathetic prince secretly “kidnapped” him into protective hiding at Wartburg Castle, where Luther, in hiding, translated the New Testament into German in just eleven weeks. A single monk's refusal to recant, at real and immediate risk to his life, became one of the hinge moments of the entire Reformation.",

      "intro": "William Tyndale, an English scholar fluent in at least seven languages, reportedly told a clergyman in an argument around 1522 that if God spared his life, he would cause a boy who drove a plough to know more of Scripture than the clergyman did. At the time, English Bibles were effectively illegal; the church permitted Scripture in Latin, accessible mainly to the educated clergy, and a prior English translation effort by John Wycliffe over a century earlier had been officially condemned, its supporters hunted as heretics.",
      "main": "Unable to find support for his translation project in England, Tyndale left for the continent in 1524 and never returned. Working first in Germany and then in the Low Countries, often moving between cities to avoid agents sent to arrest him, he translated the New Testament directly from Greek into clear, vigorous English prose, completing it in 1526. Copies were printed on the continent and smuggled into England hidden in bales of cloth and barrels of flour, where English church authorities, aware of their arrival, bought up and publicly burned as many copies as they could find, inadvertently funding Tyndale's ongoing translation work with the very money paid to destroy his books.\n\nTyndale went on to translate much of the Old Testament as well before his luck ran out. Betrayed by a man posing as a friend, he was arrested in 1535, imprisoned for over a year in a castle near Brussels, and finally strangled and burned at the stake in October 1536, reportedly crying out with his last breath, “Lord, open the King of England's eyes.” The prayer was answered with startling speed. Within three years, King Henry VIII had authorized an English Bible to be placed in every parish church in England, a translation, the so-called Great Bible, that borrowed extensively, often word for word, from Tyndale's own condemned work.",
      "why": "When the King James Version appeared in 1611, scholars estimate that roughly eighty to ninety percent of its New Testament wording traces directly back to Tyndale's original translation, eight decades after his execution. Phrases every English speaker still uses, “let there be light,” “the powers that be,” “a law unto themselves,” “fight the good fight,” came from his pen. His ploughboy's wish was granted, though he did not live to see it.",

      "title": "John Calvin and the Reform of Geneva",
      "kind": "Person",
      "era": "16th century",
      "mins": "4 min read",
      "intro": "In 1536, a quiet, scholarly Frenchman in his mid-twenties, already a refugee from Catholic persecution and the recent author of a theological work called the Institutes of the Christian Religion, stopped overnight in Geneva on his way to a planned life of private study elsewhere. A local reformer, William Farel, confronted him and declared that God would curse his studies if he refused to stay and help reform the city's church. Calvin later said the threat terrified him into staying.",
      "main": "Geneva in the 1530s had only recently broken from Catholic rule and was, by most accounts, a politically unstable and morally disorderly city, hardly the obvious place for careful theological reform. Calvin's early attempts at discipline were unpopular enough that he and Farel were actually expelled from the city in 1538. Calvin spent three years in Strasbourg, pastoring a congregation of French refugees and, by his own later account, some of the happiest years of his life, before Geneva's city council, facing continued instability, asked him to return in 1541.\n\nThis second period lasted until his death in 1564, and it was during these years that Calvin built what became one of the most influential theological and educational centers in Protestant history. He established a rigorous system of church governance involving both pastors and lay elders, founded the Geneva Academy for training ministers, and continued expanding the Institutes across several editions into a comprehensive systematic theology still studied today. Geneva became a haven for Protestant refugees from across Europe, including John Knox, who would carry Reformed theology to Scotland, and countless others who studied there before returning to plant Reformed churches throughout France, the Netherlands, and beyond.\n\nCalvin was not a uniformly gentle figure; his Geneva enforced strict moral discipline, and the city's involvement in the execution of the heretic Michael Servetus in 1553 remains a serious and much-debated stain on his legacy.",
      "why": "Calvin's systematic theological work and Geneva's model of pastoral training reshaped Protestantism far beyond Switzerland, giving the Reformed tradition, from Scottish Presbyterianism to the Puritans to much of global evangelicalism today, its basic theological vocabulary and institutional pattern of combining serious doctrine with disciplined church life.",

    {
      "id": "council-trent",
      "title": "The Council of Trent",
      "kind": "Event",
      "era": "16th century",
      "mins": "4 min read",
      "intro": "For eighteen years, spread across three distinct periods between 1545 and 1563, Catholic bishops and theologians gathered intermittently in the northern Italian town of Trent to respond to the growing Protestant Reformation. It was not a quick reaction; the council's first session did not even convene until nearly three decades after Luther's initial objections, delayed repeatedly by war, politics, and disagreement over whether reform or condemnation should come first.",
      "main": "When the bishops finally did meet, they addressed two distinct tasks that are often blurred together in popular memory. First, doctrinal clarification and condemnation: the council firmly restated Catholic positions on justification, denying the Protestant formula of faith alone while still affirming that grace, not human merit alone, is the necessary foundation of salvation; it reaffirmed seven sacraments, the authority of church tradition alongside Scripture, and the real presence of Christ in the Eucharist, explicitly rejecting key Protestant alternatives on each point. Second, and less often remembered, genuine internal reform: the council addressed real and widely acknowledged corruptions that had helped trigger the Reformation in the first place, including the sale of church offices, bishops who never visited their own dioceses, and poorly educated, sometimes barely literate parish priests. It mandated the founding of seminaries for proper priestly training and required bishops to actually reside in and oversee their own dioceses.\n\nThe result, often called the Counter-Reformation or Catholic Reformation depending on which aspect is emphasized, reshaped the Catholic Church into a more doctrinally defined, more disciplined, and in many respects more genuinely reformed institution than it had been before Luther ever posted his theses, even while it hardened the lines of division with Protestants that remain largely in place today.",
      "why": "Trent is a useful reminder that the Reformation produced two reform movements rather than one: a Protestant reformation that broke from Rome, and a Catholic reformation that addressed real abuses while reaffirming core Catholic doctrine. Understanding both, rather than only the Protestant side of the story, gives a fuller and fairer picture of a genuinely complicated century.",
      "reflect": [
        "Where might your own tradition need the kind of honest, internal reform Trent pursued, regardless of what you believe about its doctrinal conclusions?",
        "How might church history look different if we studied movements we disagree with as carefully as the ones we already affirm?"
      ]

      "id": "wilberforce-abolition",
      "title": "William Wilberforce and the Abolition of the Slave Trade",
      "kind": "Person",
      "era": "18th–19th century",
      "mins": "4 min read",
      "intro": "In 1785, a wealthy twenty-five-year-old member of the British Parliament, known more for his wit and social charm than any particular seriousness of purpose, underwent a profound evangelical conversion that left him seriously questioning whether he should abandon politics altogether for quiet religious life. A friend and former teacher, John Newton, the reformed slave-ship captain who had written the hymn Amazing Grace, counseled him instead to remain in public life and use his position for God's purposes. William Wilberforce took that counsel and spent the next forty-six years pursuing a single overriding cause: the abolition of the British slave trade.",
      "main": "The scale of what Wilberforce opposed is difficult to overstate. The transatlantic slave trade was, by the late 1700s, a massive and deeply entrenched part of the British economy, defended by powerful commercial interests, and the idea of simply ending it struck many in Parliament as economically reckless and practically impossible. Wilberforce introduced abolition bills year after year, beginning in 1789, enduring repeated defeats, public ridicule, and even threats to his life, while gathering evidence of the trade's horrors, organizing petition drives, and building a coalition that came to be known as the Clapham Sect, a circle of wealthy evangelical reformers who combined serious faith with sustained political activism on issues including prison reform and care for the poor.\n\nThe Slave Trade Act finally passed in 1807, banning the trade itself, though slavery as an institution continued in British territories for another generation. Wilberforce, in declining health, continued fighting for full emancipation until, remarkably, news reached him on his deathbed in 1833 that the Slavery Abolition Act had passed its crucial parliamentary vote, ending slavery itself throughout most of the British Empire.",
      "why": "Wilberforce's decades-long campaign stands as one of history's clearest examples of faith translated into sustained, unglamorous political persistence rather than a single dramatic gesture. He did not simply feel strongly about injustice; he organized, documented, lobbied, and kept returning to Parliament year after disappointing year until the work was finally done.",

      "intro": "When James Hudson Taylor first sailed for China in 1853, a twenty-one-year-old from a modest English family with no formal theological training and chronic poor health, most existing missionary societies worked almost exclusively in a handful of coastal treaty ports, protected by Western gunboats and largely cut off from the vast Chinese interior where hundreds of millions of people lived. Taylor came to believe this was a serious missed opportunity, and the method he chose to address it struck many of his contemporaries as reckless.",
      "main": "He adopted Chinese dress and grew his hair into the required queue hairstyle, a highly controversial decision among Western missionaries of his era, many of whom considered it beneath their dignity or even spiritually compromising to adopt local customs rather than Western ones. In 1865, convinced that the task of reaching inland China required an entirely new kind of organization, he founded the China Inland Mission with an unusual founding principle: the mission would never go into debt or publicly solicit funds, relying instead entirely on prayer and what Taylor called “God's work done in God's way,” trusting that it would never lack God's provision.\n\nThe mission grew far beyond what its small, faith-funded beginnings suggested was possible, eventually becoming the largest Protestant missionary organization working in China, with hundreds of missionaries stationed across provinces that had never before had a sustained Western Christian presence. Taylor endured repeated personal tragedy along the way, including the deaths of his first wife and several of his children on the mission field, hardships that never appeared to shake his basic conviction that the work itself was worth the cost. By the time of his death in 1905, the mission he founded had planted churches and trained Chinese believers across the interior, laying groundwork that would prove remarkably resilient even after Western missionaries were eventually expelled following the 1949 revolution, as the Chinese church continued to grow, largely on its own, into one of the largest Christian populations in the world today.",

      "intro": "By his own account, the Oxford scholar and lifelong atheist C.S. Lewis was, in September 1931, “the most dejected and reluctant convert in all England,” brought to his knees not by longing for God but by the sheer weight of argument. A late-night conversation with fellow Oxford writers J.R.R. Tolkien and Hugo Dyson, walking the paths of Magdalen College discussing myth and meaning, proved decisive in a conversion process Lewis had been resisting intellectually for months.",

      "why": "Lewis's conversion offers a different pattern than dramatic Damascus-road experiences: a slow, resisted, deeply reasoned surrender, useful encouragement for anyone who feels their own faith was argued into rather than suddenly felt, and a reminder that reluctant, honest wrestling with God can still end in genuine, world-shaping faith.",

      "intro": "In 1939, a respected German theologian in his early thirties had safely reached New York, having been invited to teach and lecture away from the growing danger of Nazi Germany. Within weeks, Dietrich Bonhoeffer made the decision to return to Germany, writing to a friend that he would have no right to participate in the reconstruction of Christian life in Germany after the war if he did not share the trials of this time with his own people.",
      "main": "Bonhoeffer had already spent years resisting the Nazi regime's attempt to co-opt the German church, helping lead the Confessing Church movement, which refused to accept state control over church teaching or to exclude Jewish Christians from ministry as the government-aligned “German Christian” movement demanded. His 1937 book, The Cost of Discipleship, written during this struggle, drew a sharp distinction between what he called cheap grace, forgiveness without any real cost or change of life, and costly grace, which calls a person to actual obedience, even when that obedience is dangerous.\n\nReturning to Germany, Bonhoeffer eventually became involved, through family and church connections, in the political resistance against Hitler, including indirect knowledge of assassination plots, a position that sat in visible tension with his own earlier writing on peace and discipleship, and which he wrestled with seriously rather than resolving easily. He was arrested in 1943 on related charges and imprisoned for two years, during which he wrote extensively, including letters later published as Letters and Papers from Prison, reflecting on faith, suffering, and what Christianity might mean in what he called a world come of age.\n\nIn April 1945, with Allied forces closing in and the war clearly lost, Bonhoeffer was executed by hanging at Flossenbürg concentration camp, just weeks before the camp's liberation. A doctor who witnessed his final moments later described him as composed and at peace, kneeling in prayer shortly before his death.",
      "why": "Bonhoeffer's life and writing continue to press an uncomfortable question at believers in comfortable circumstances: whether the grace they have received has actually cost them anything, or whether, as he put it, they have settled for grace without discipleship, forgiveness without obedience, a church without the cross.",
      "reflect": [
        "Where in your own life might you be settling for Bonhoeffer's “cheap grace,” comfort without real cost?",

      "kind": "Person",
      "era": "5th century",
      "mins": "4 min read",
      "intro": "At sixteen, a Romano-British teenager named Patrick was captured by Irish raiders and sold into slavery, spending six lonely years herding sheep on a cold hillside, by his own account praying up to a hundred times a day out of sheer desperation. He eventually escaped, walking some two hundred miles to a ship, and returned home to his family. Most people in his position would have counted themselves fortunate simply to be free. Patrick, remarkably, chose to go back.",
      "main": "Years after his escape, Patrick wrote that he received a vision calling him to return to Ireland, this time not as a captive but as a missionary to the very people who had enslaved him. His own account, the Confessio, is strikingly honest about his inadequacy for the task: he describes himself as unlearned, a rough and unpolished writer compared to the trained clergy of his day, and admits real anxiety about whether he was equal to the work God had apparently given him.\n\nHe went anyway, and spent decades traveling across an island with no previous organized Christian presence, baptizing converts, ordaining local clergy, and navigating real danger from hostile chieftains along the way, at one point writing that he expected to be killed, robbed, or enslaved again at any time. He deliberately worked within Irish tribal structures rather than imposing a foreign model wholesale, securing the protection of local kings and training native Irish leaders to carry the work forward rather than keeping it dependent on missionaries from abroad. By the time of his death, Ireland had a growing network of churches and monasteries that would, within a century or two, become one of the most significant centers of learning and missionary sending in all of early medieval Europe.",
      "why": "Patrick's willingness to return to the very place of his suffering, armed with little more than conviction and a felt sense of calling, planted a church that would later send its own missionaries back across Europe, helping preserve Christian learning through the difficult centuries after Rome's collapse. Few conversion stories in Christian history involve quite so costly a forgiveness as choosing to serve the people who once enslaved you.",
      "reflect": [

      "intro": "In 1095, Pope Urban II stood before a council at Clermont in France and called on Western Christians to march east and reclaim Jerusalem, recently closed to Christian pilgrims under new Muslim rule, and to aid the Byzantine Empire against encroaching Turkish forces. The response was larger and more chaotic than he likely anticipated: within four years, an armed pilgrimage of knights, nobles, and a great many ordinary, poorly equipped peasants had fought its way to Jerusalem itself, and would launch a series of further military campaigns to the Holy Land over the following two centuries.",
      "main": "The First Crusade succeeded, brutally, capturing Jerusalem in 1099 after a siege that ended in a massacre of the city's Muslim and Jewish inhabitants, an atrocity even some contemporary Christian chroniclers described with visible discomfort. Four Crusader states were established along the eastern Mediterranean coast, and for roughly two generations Western Europeans held territory in the Levant, until a resurgent Muslim leadership, eventually under Saladin, began reclaiming it, recapturing Jerusalem itself in 1187. Later crusades followed, with decreasing success and, in several cases, increasingly troubling targets: the Fourth Crusade in 1204 never reached Muslim territory at all, instead sacking Constantinople, the great Christian city it had nominally set out to assist, a betrayal that poisoned relations between Eastern and Western Christianity for centuries afterward.\n\nMotivations on the Crusader side were genuinely mixed, even within individual participants: sincere pilgrim piety and a desire to protect fellow Christians in the East existed alongside land hunger, political ambition, and, in several notorious episodes, violent antisemitic pogroms against Jewish communities in Europe itself, conducted by crusading mobs who never even reached the Holy Land. The human cost, on every side, across two centuries of intermittent warfare, was immense.",

      "intro": "In January 1536, a Dutch Catholic priest named Menno Simons, already quietly troubled for years by doubts about the doctrine of transubstantiation and by what he considered the state church's compromise with violence, made a decision that would cost him any remaining safety he had: he left the priesthood and joined the Anabaptists, a radical and widely persecuted wing of the Reformation that insisted baptism belonged only to believers who could personally confess their own faith, not to infants.",

      "intro": "In April 1906, on a run-down street in a poor, largely Black neighborhood of Los Angeles, a revival broke out in a converted livery stable that would, within a few short years, help give birth to the fastest-growing branch of global Christianity. It began under the leadership of William Seymour, the son of former slaves, who had traveled to California after studying briefly under a Bible teacher in Texas who taught that speaking in tongues was the necessary evidence of Spirit baptism.",
      "main": "Seymour himself had initially been locked out of the small Los Angeles congregation that first invited him to preach, after its leaders grew uneasy with his teaching before he had even personally experienced the tongues-speaking he proclaimed; he continued holding meetings in a private home instead, where the experience he had been teaching about finally broke out among those gathered there. The crowds quickly outgrew the house, and the group moved to a former African Methodist Episcopal church building on Azusa Street that had most recently been used as a warehouse and stable, meeting there almost nightly for over three years.\n\nWhat made Azusa Street remarkable extended well beyond the tongues-speaking and healings reported there, striking as contemporary observers found them. In an era of rigid American racial segregation, the Azusa Street meetings were strikingly, deliberately integrated, Black, white, Latino, and Asian worshippers praying and worshipping together under a Black pastor's leadership, a pattern one visiting white minister described with evident astonishment as the color line being washed away in the blood of Christ. Visitors came from across the country and eventually from around the world, carrying what they experienced back to their own congregations and mission fields, planting Pentecostal churches and denominations across the globe within a remarkably short span of years.\n\nThe revival did not go unquestioned, even among sympathetic observers, and it did not hold together as cleanly as its early reputation suggests. Some holiness leaders of the day, including Charles Parham, the very teacher under whom Seymour had studied tongues-speaking, publicly broke with the Azusa Street meetings, calling some of what happened there excessive or counterfeit. The press mocked it outright. And within little more than a decade, the movement it spawned split repeatedly, over competing doctrines of sanctification, over the nature of the Trinity, and, most painfully given how the revival began, largely along racial lines, as white and Black Pentecostal bodies organized into separate denominations. The color line the revival was said to have washed away reasserted itself within a single generation.",

      "intro": "Around the year 107, an elderly bishop named Ignatius was marched in chains across Asia Minor under armed Roman guard, bound for the Colosseum in Rome, where he had been condemned to be torn apart by wild beasts for the crime of being a Christian leader. Most people facing that journey would have spent it in despair or desperate appeals for rescue. Ignatius spent it writing letters, and asking the churches along his route not to save him.",

      "title": "John Chrysostom, the Golden-Mouthed Preacher",
      "kind": "Person",
      "era": "4th century",
      "mins": "4 min read",
      "intro": "By the late 4th century, John of Antioch had earned a nickname that would outlast his own name in common use: Chrysostom, golden-mouthed, for a preaching style so vivid and so demanding that crowds would reportedly applaud mid-sermon, a habit he found more troubling than flattering, since he suspected his listeners enjoyed being moved by his words rather more than they enjoyed actually obeying them.",
      "main": "Trained as a monk and hermit before poor health forced him back into city ministry, Chrysostom became a renowned preacher in Antioch, where his sermons combined careful, verse-by-verse biblical exposition with blunt, specific moral challenge, criticizing wealthy Christians by name-adjacent description for ignoring the poor at their own church doors while decorating their homes lavishly, and insisting that genuine Christian worship was inseparable from how believers treated the hungry and the destitute sitting just outside the sanctuary. In 398 he was made Archbishop of Constantinople, against his own wishes, reportedly removed from Antioch under something close to a ruse to get him to the capital without a riot breaking out among the people who did not want to lose him.\n\nAs archbishop, his bluntness did not soften; if anything, it sharpened, now aimed at the imperial court itself, including the empress Eudoxia, whose extravagance and whose erection of a silver statue near the cathedral he publicly criticized. This did not go unanswered. Court-aligned bishops, resentful of his reforms and his sermons alike, maneuvered him into exile not once but twice, the second exile deliberately brutal, forcing the aging, already unwell Chrysostom on a punishing forced march through harsh terrain that he did not survive, dying in 407 with his final recorded words reportedly being, Glory be to God for all things.",
      "why": "Chrysostom's insistence that true worship cannot be separated from care for the poor, and that a preacher's job includes saying uncomfortable things to the powerful rather than only the comfortable, has made his sermons required reading in both Eastern Orthodox and Western Christian tradition for over sixteen centuries since.",

      "main": "Boniface had already spent years as a missionary among the still-largely-pagan Germanic peoples east of the Rhine, an assignment he had specifically requested rather than remaining in the comparative safety of an English monastery, and he understood that the tribes he was trying to reach would never be persuaded by argument alone that their old gods held no real power; they needed to see it demonstrated. According to the earliest surviving account, written by a companion not long after Boniface's own death, a sudden wind arose partway through the felling and finished toppling the massive tree with a thunderous crash before Boniface had cut all the way through it, splitting the trunk into four pieces as it fell. The watching crowd, who had expected divine retribution, instead witnessed what looked to them like the opposite: Thor's own sacred tree destroyed without the god lifting a finger to stop it.\n\nMany of those present reportedly converted on the spot, and Boniface used the timber from the felled oak to build a small chapel dedicated to Peter on the same site, a deliberate and pointed substitution of the old sacred space with a new one. He spent the following decades organizing the previously scattered and disorganized German church, founding monasteries, training clergy, and corresponding extensively with Rome to coordinate the mission, before finally being killed by a band of robbers in 754 while awaiting a group of converts for confirmation, his final act one of continuing patient ministry rather than retreat.",

  var wakeLock = null, wakePending = false;

        }, function () { wakePending = false; });

        var l2 = wakeLock; wakeLock = null; l2.release();
      }
    } catch (e) { wakePending = false; }
  }
  function render() {

    hydratePassages();
    var btns = document.querySelectorAll('nav button');
    var navTab = (tab === 'week' || tab === 'history' || tab === 'reminders') ? 'more' : tab;
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].dataset.id === navTab) btns[i].setAttribute('aria-current', 'page'); else btns[i].removeAttribute('aria-current');

    var inGuide = tab === 'pray' && !!ui.session && !ui.session.done;
    var focusOn = inGuide && ui.focus !== false;
    if (document.body && document.body.classList) document.body.classList.toggle('focus', focusOn);
    syncWake(focusOn);
  }

  function act(a, id) {

    switch (a) {
      case 'tab': tab = id; ui.answering = null; ui.confirm = null; ui.flash = ''; ui.editing = null; ui.pendingRestore = null; ui.backupShow = false; ui.histOpen = null; if (id === 'week') ui.weekOffset = 0; render(); window.scrollTo(0, 0); return;
      case 'histweek': tab = 'history'; ui.answering = null; ui.confirm = null; ui.flash = ''; ui.editing = null; ui.pendingRestore = null; ui.backupShow = false; ui.histOpen = HISTORY[historyIndex()].id; render(); window.scrollTo(0, 0); return;
      case 'slot':
        S.done[t] = S.done[t] || {};
        if (S.done[t][id]) delete S.done[t][id]; else S.done[t][id] = true;
        if (!Object.keys(S.done[t]).length) delete S.done[t];
        save(); render(); return;
      case 'pray':
        r = S.requests.filter(function (x) { return x.id === id; })[0]; if (!r) return;
        r.prayed = r.prayed || [];

        save(); render(); return;
      case 'addreq':
        var text = val('reqText');

        ui.filter = 'open'; ui.flash = ''; save(); render(); return;

        ui.answering = null; save(); render(); return;
      case 'shelve':
        r = S.requests.filter(function (x) { return x.id === id; })[0]; if (r) { r.shelved = true; r.shelvedAt = t; }
        save(); render(); return;
      case 'unshelve':
        r = S.requests.filter(function (x) { return x.id === id; })[0]; if (r) { r.shelved = false; r.shelvedAt = null; }
        save(); render(); return;
      case 'reopen':
        r = S.requests.filter(function (x) { return x.id === id; })[0]; if (r) r.answered = null;
        save(); render(); return;
      case 'delreq': case 'delentry': case 'delslot':
        if (ui.confirm !== a + id) { ui.confirm = a + id; render(); return; }
        ui.confirm = null;
        if (a === 'delreq') S.requests = S.requests.filter(function (x) { return x.id !== id; });
        if (a === 'delentry') S.journal = S.journal.filter(function (x) { return x.id !== id; });
        if (a === 'delslot') S.slots = S.slots.filter(function (x) { return x.id !== id; });
        save(); render(); return;
      case 'addentry':
        var body = val('jText');
        if (!body) { flash('Write something first.'); return; }
        S.journal.push({ id: uid(), date: new Date().toISOString(), text: body, thanks: val('jThanks') });
        ui.flash = 'Entry saved.'; save(); render(); return;
      case 'addslot':
        S.slots.push({ id: uid(), label: 'Prayer', time: '12:00', on: true });
        save(); render(); return;
      case 'newverse':
        todaysVerse(); S.verse.offset++; save(); render(); return;
      case 'verseentry':
        var vv = todaysVerse(); ui.prefill = 'On ' + vv.ref + ': ';
        tab = 'journal'; ui.flash = ''; render(); window.scrollTo(0, 0);
        var jt = document.getElementById('jText');
        if (jt) { jt.focus(); jt.setSelectionRange(jt.value.length, jt.value.length); }
        return;
      case 'start':
        ui.session = newSession(id); ui.openRefs = {}; ui.flash = ''; render(); window.scrollTo(0, 0); return;
      case 'startpsalm':
        ui.session = newSession('psalm', id); ui.openRefs = {}; ui.flash = ''; render(); window.scrollTo(0, 0); return;
      case 'snext':
        if (ui.session && ui.session.rest && ui.session.rest.running) { ui.session.rest.remaining = restRemaining(ui.session); ui.session.rest.running = false; ui.session.rest.endAt = null; }
        if (ui.session) {
          if (ui.session.step >= sessionSteps(ui.session).length - 1) ui.session.done = true; else ui.session.step++;
          render(); window.scrollTo(0, 0);
        }
        return;
      case 'sback':
        if (ui.session && ui.session.rest && ui.session.rest.running) { ui.session.rest.remaining = restRemaining(ui.session); ui.session.rest.running = false; ui.session.rest.endAt = null; }
        if (ui.session && ui.session.step > 0) { ui.session.step--; render(); window.scrollTo(0, 0); }
        return;
      case 'leave':
        if (ui.session && ui.session.rest && ui.session.rest.running) { ui.session.rest.remaining = restRemaining(ui.session); ui.session.rest.running = false; ui.session.rest.endAt = null; }
        ui.session = null; ui.openRefs = {}; render(); window.scrollTo(0, 0); return;
      case 'sfsave':
        if (ui.session) {
          var stxt = sessionText(ui.session);
          if (stxt) { S.journal.push({ id: uid(), date: new Date().toISOString(), text: stxt, thanks: '' }); ui.session.saved = true; save(); }
          render();
        }
        return;
      case 'part':
        ui.part = id; ui.partManual = true; render(); return;
      case 'evetoggle':
        var et = prayDay(); ui.eveOpen = ui.eveOpen === et ? '' : et; render(); return;
      case 'everead':
        var et2 = prayDay(); S.eveRead = S.eveRead || {};
        if (S.eveRead[et2]) delete S.eveRead[et2]; else S.eveRead[et2] = true;
        save(); render(); return;
      case 'eveentry':
        var evx = todaysEvening();
        ui.prefill = 'On ' + (evx ? evx.ref : 'tonight\u2019s reading') + ': ';
        tab = 'journal'; ui.flash = ''; render(); window.scrollTo(0, 0);
        var jev = document.getElementById('jText');
        if (jev) { jev.focus(); jev.setSelectionRange(jev.value.length, jev.value.length); }
        return;
      case 'focustoggle':
        ui.focus = ui.focus === false; render(); window.scrollTo(0, 0); return;
      case 'histopen':
        ui.histOpen = id; render(); window.scrollTo(0, 0); return;
      case 'histback':
        ui.histOpen = null; render(); window.scrollTo(0, 0); return;
      case 'histentry':
        var he = HISTORY.filter(function (x) { return x.id === ui.histOpen; })[0];
        ui.prefill = he ? 'On ' + he.title + ': ' : '';
        tab = 'journal'; ui.histOpen = null; ui.flash = ''; render(); window.scrollTo(0, 0);
        var jh = document.getElementById('jText');
        if (jh) { jh.focus(); jh.setSelectionRange(jh.value.length, jh.value.length); }
        return;
      case 'weekprev':
        ui.weekOffset = (ui.weekOffset || 0) - 1; render(); return;
      case 'weeknext':
        if ((ui.weekOffset || 0) < 0) ui.weekOffset++; render(); return;
      case 'weekentry':
        var wk = weekDays(ui.weekOffset || 0);
        ui.prefill = 'Weekly review, week of ' + wk[0].toLocaleDateString(undefined, { month: 'long', day: 'numeric' }) +
          '\n\nWhere I saw God at work:\n\nWhat I\u2019m thankful for:\n\nWhat I\u2019ll carry into next week:\n';
        tab = 'journal'; ui.flash = ''; render(); window.scrollTo(0, 0);
        var jw = document.getElementById('jText');
        if (jw) { jw.focus(); jw.setSelectionRange(jw.value.length, jw.value.length); }
        return;
      case 'devtoggle':
        ui.devOpen = ui.devOpen === t ? '' : t; render(); return;
      case 'devread':
        S.devRead = S.devRead || {};
        if (S.devRead[t]) delete S.devRead[t]; else S.devRead[t] = true;
        save(); render(); return;
      case 'deventry':
        ui.prefill = 'On ' + todaysDevotional().ref + ': ';
        tab = 'journal'; ui.flash = ''; render(); window.scrollTo(0, 0);
        var jd = document.getElementById('jText');
        if (jd) { jd.focus(); jd.setSelectionRange(jd.value.length, jd.value.length); }
        return;
      case 'ref':
        ui.openRefs[id] = !ui.openRefs[id]; render(); return;
      case 'startlectio':
        ui.session = newSession('lectio', id); ui.openRefs = {}; ui.flash = ''; render(); window.scrollTo(0, 0); return;
      case 'restpick':
        if (ui.session && ui.session.rest && !ui.session.rest.started) {
          ui.session.rest.duration = +id; ui.session.rest.remaining = +id; ui.session.rest.done = false; render();
        }
        return;
      case 'restphrase':
        if (ui.session) {
          if (!ui.session.rest) ui.session.rest = freshRest();
          var opts = restPhraseOptions(ui.session);
          ui.session.rest.phrase = opts[+id] || ''; render();
        }
        return;
      case 'resttoggle':
        if (ui.session && ui.session.rest && ui.session.rest.duration) {
          var rs = ui.session.rest;
          if (rs.running) { rs.remaining = restRemaining(ui.session); rs.running = false; rs.endAt = null; }
          else { var rem = rs.remaining || rs.duration; rs.remaining = rem; rs.endAt = Date.now() + rem * 1000; rs.running = true; rs.started = true; ensureAudioCtx(); }
          render();
        }
        return;
      case 'restend':
        if (ui.session && ui.session.rest) {
          var re2 = ui.session.rest; re2.running = false; re2.endAt = null; re2.remaining = 0; re2.done = true; re2.endedEarly = true; render();
        }
        return;
      case 'restreset':
        if (ui.session) { ui.session.rest = freshRest(); render(); }
        return;
      case 'retrypassage':
        delete passages[id]; render(); return;
      case 'newquote':
        todaysQuote(); S.quote.offset++; save(); render(); return;
      case 'quoteentry':
        var qq = todaysQuote(); ui.prefill = 'Reflecting on ' + qq.by + ': ';
        tab = 'journal'; ui.flash = ''; render(); window.scrollTo(0, 0);
        var jq = document.getElementById('jText');
        if (jq) { jq.focus(); jq.setSelectionRange(jq.value.length, jq.value.length); }
        return;
      case 'editreq':
        r = S.requests.filter(function (x) { return x.id === id; })[0]; if (!r) return;
        ui.editing = { kind: 'req', id: id, err: '', d: { text: r.text, cat: r.cat, note: r.answered ? (r.answered.note || '') : '' } };
        ui.answering = null; ui.confirm = null; render();
        var ie = document.getElementById('editReqText'); if (ie) ie.focus();
        return;
      case 'editentry':
        var en = S.journal.filter(function (x) { return x.id === id; })[0]; if (!en) return;
        ui.editing = { kind: 'entry', id: id, err: '', d: { text: en.text, thanks: en.thanks || '' } };
        ui.confirm = null; render();
        var it = document.getElementById('editEntryText'); if (it) it.focus();
        return;
      case 'canceledit':
        ui.editing = null; render(); return;
      case 'saveedit':
        var ed = ui.editing; if (!ed) return;
        syncDraft();
        var etxt = (ed.d.text || '').trim();
        if (!etxt) { ed.err = ed.kind === 'req' ? 'Write a request first.' : 'Write something first.'; render(); return; }
        if (ed.kind === 'req') {
          var er = S.requests.filter(function (x) { return x.id === ed.id; })[0];
          if (er) { er.text = etxt; if (ed.d.cat) er.cat = ed.d.cat; if (er.answered) er.answered.note = (ed.d.note || '').trim(); }
        } else {
          var ee = S.journal.filter(function (x) { return x.id === ed.id; })[0];
          if (ee) { ee.text = etxt; ee.thanks = (ed.d.thanks || '').trim(); ee.edited = new Date().toISOString(); }
        }
        ui.editing = null; ui.flash = ''; save(); render(); return;
      case 'export': doExport(); return;
      case 'copybackup': doCopyBackup(); return;
      case 'restore':
        var rt = val('restoreText');
        if (!rt) { flash('Paste your backup first, or choose a backup file.'); return; }
        prepareRestore(rt, ''); return;
      case 'restoreconfirm': applyRestore(); return;
      case 'restorecancel': ui.pendingRestore = null; render(); return;
    }
  }

  function backupStatus() {
    if (!S.lastBackup) return 'You haven\u2019t saved a backup yet.';
    var t = new Date(S.lastBackup);
    if (isNaN(t.getTime())) return 'You haven\u2019t saved a backup yet.';
    var days = Math.floor((Date.now() - t.getTime()) / 86400000);
    return 'Last backed up ' + t.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) + (days >= 7 ? '. It\u2019s been a while, so now is a good time for a new one.' : '.');
  }
  function backupData(stamp) {
    var o = {};
    for (var k in S) o[k] = S[k];
    o.lastBackup = stamp;
    return JSON.stringify(o, null, 2);
  }
  function backupDone(stamp, msg) { S.lastBackup = stamp; save(); flash(msg); }
  function browserDownload(filename, text) {
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  }
  function doExport() {
    var stamp = new Date().toISOString(), data = backupData(stamp), filename = 'prayer-book-backup-' + dkey() + '.json';
    function fallback() {
      try { browserDownload(filename, data); backupDone(stamp, 'Backup saved. Look in your Downloads folder.'); }
      catch (e) { flash('Couldn\u2019t save a file here. Try Copy backup instead.'); }
    }
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function (dl) {
        if (!dl) { fallback(); return; }
        return dl.save({ filename: filename, data: data }).then(function () { backupDone(stamp, 'Backup saved.'); }, function (err) {
          if (err && err.code === 'declined') return;
          flash('Couldn\u2019t save the backup. Try Copy backup instead.');
        });
      }, fallback);
    } else fallback();
  }
  function doCopyBackup() {
    var stamp = new Date().toISOString(), data = backupData(stamp);
    function shown() { ui.backupShow = true; flash('Couldn\u2019t copy automatically. Select the text below and copy it yourself.'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(data).then(function () { ui.backupShow = false; backupDone(stamp, 'Backup copied. Paste it into a note or message and keep it safe.'); }, shown);
    } else shown();
  }
  function prepareRestore(raw, label) {
    var d = null;
    try { d = JSON.parse(raw); } catch (e) {}
    if (!d || !Array.isArray(d.slots) || !Array.isArray(d.requests) || !Array.isArray(d.journal) || !d.done || typeof d.done !== 'object') {
      ui.pendingRestore = null; flash('That doesn\u2019t look like a Prayer Book backup.'); return;
    }
    ui.pendingRestore = { data: d, label: label || '' }; ui.flash = ''; render();
  }
  function applyRestore() {
    var pr = ui.pendingRestore; if (!pr) return;
    var d = pr.data;
    try { localStorage.setItem(KEY + ':before-restore', JSON.stringify(S)); } catch (e) {}
    (d.requests || []).forEach(function (r) { if (typeof r.shelved === 'undefined') r.shelved = false; if (typeof r.shelvedAt === 'undefined') r.shelvedAt = null; });
    S = {
      slots: d.slots, done: d.done || {}, requests: d.requests, journal: d.journal,
      verse: d.verse || { day: '', offset: 0 }, quote: d.quote || { day: '', offset: 0 }, devRead: d.devRead || {}, eveRead: d.eveRead || {},
      lastBackup: typeof d.lastBackup === 'string' ? d.lastBackup : ''
    };
    ui.pendingRestore = null; ui.editing = null; save(); flash('Backup restored.');
  }
  function syncDraft() {
    var ed = ui.editing; if (!ed) return;
    var map = ed.kind === 'req' ? { text: 'editReqText', cat: 'editReqCat', note: 'editReqNote' } : { text: 'editEntryText', thanks: 'editEntryThanks' };
    for (var k in map) { var el = document.getElementById(map[k]); if (el && typeof el.value === 'string') ed.d[k] = el.value; }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (el) act(el.getAttribute('data-act'), el.getAttribute('data-id'));
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var t0 = e.target, en0 = t0 && t0.getAttribute && t0.getAttribute('data-enter');
      if (en0) { e.preventDefault(); act(en0, null); return; }
    }
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target;
    if (el && el.getAttribute && el.getAttribute('role') === 'button' && el.getAttribute('data-act')) {
      e.preventDefault(); act(el.getAttribute('data-act'), el.getAttribute('data-id'));
    }
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    if (el.getAttribute('data-note') && ui.session) ui.session.notes[ui.session.step] = el.value;
    var dk = el.getAttribute('data-draft');
    if (dk && ui.editing) ui.editing.d[dk] = el.value;
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    var dk = el.getAttribute('data-draft');
    if (dk && ui.editing) { ui.editing.d[dk] = el.value; return; }
    if (el.id === 'restoreFile') {
      var file = el.files && el.files[0]; if (!file) return;
      var fr = new FileReader();
      fr.onload = function () { prepareRestore(String(fr.result || ''), file.name); };
      fr.onerror = function () { flash('Couldn’t read that file.'); };
      fr.readAsText(file); return;
    }
    var id = el.getAttribute('data-slot');
    if (!id) return;
    var s = S.slots.filter(function (x) { return x.id === id; })[0]; if (!s) return;
    var f = el.getAttribute('data-field');
    if (f === 'on') s[f] = el.checked;
    else if (f === 'time') { if (!el.value) return; s[f] = el.value; }
    else s[f] = el.value.trim() || 'Prayer';
    save();
    if (f !== 'label') render();
  });

  if (typeof navigator !== 'undefined' && navigator.serviceWorker && window.self === window.top) {
    window.addEventListener('load', function () {
      try { navigator.serviceWorker.register('./sw.js').catch(function () {}); } catch (e) {}
    });
  }

  setInterval(function () {
    if (ui.session && ui.session.rest && ui.session.rest.running) {
      var rem = restRemaining(ui.session);
      ui.session.rest.remaining = rem;
      if (rem <= 0) {
        ui.session.rest.running = false; ui.session.rest.endAt = null; ui.session.rest.done = true; ui.session.rest.endedEarly = false;
        try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
        playChime();
      }
      if (tab === 'pray') render();
    }
  }, 1000);

  setInterval(function () { if (tab === 'today' && !document.hidden) render(); }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { wakeLock = null; wakePending = false; if (tab === 'today' || ui.session) render(); } });
  render();
})();
</script>
</body>
</html>
